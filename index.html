<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kakao Taxi Jump</title>
<meta name="description" content="엔터 한 번으로 테슬라를 뛰어넘어라! 원버튼 점프 게임">
<meta name="theme-color" content="#020617">
<!-- 링크 공유 미리보기 (카카오톡·슬랙·페이스북 등: Open Graph / X: Twitter Card) -->
<!-- og:image·og:url 은 배포 주소 기준 절대 경로여야 썸네일이 표시됨 -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kakao Taxi Jump">
<meta property="og:description" content="엔터 한 번으로 테슬라를 뛰어넘어라! 원버튼 점프 게임">
<meta property="og:image" content="https://lapin-world.github.io/car-jump/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://lapin-world.github.io/car-jump/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kakao Taxi Jump">
<meta name="twitter:description" content="엔터 한 번으로 테슬라를 뛰어넘어라!">
<meta name="twitter:image" content="https://lapin-world.github.io/car-jump/assets/og-image.png">
<style>
  html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* 게임 오버 시 랭킹 패널 */
  #rank {
    position: fixed; left: 50%; top: 40%; transform: translateX(-50%); overflow-y: auto; /* top·max-height 는 JS(layoutOver)에서 문구 아래로 맞춤 */
    width: min(320px, calc(100vw - 32px)); box-sizing: border-box; padding: 14px 16px;
    border: 1px solid rgba(148,197,255,0.4); border-radius: 14px;
    background: rgba(15,23,42,0.9); color: #f8fafc; font: 14px system-ui, sans-serif;
  }
  #rank[hidden] { display: none; }
  #rank-form { display: flex; gap: 8px; margin-bottom: 10px; }
  #rank-form[hidden] { display: none; } /* display:flex 가 hidden 속성을 덮어쓰지 않게 */
  #rank-form input {
    flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #475569; border-radius: 8px;
    background: #0f172a; color: #f8fafc; font: inherit; user-select: text; -webkit-user-select: text;
    font-size: 16px; /* iOS Safari는 16px 미만 입력칸에 포커스하면 화면을 자동 확대함 */
  }
  #rank-form button {
    padding: 8px 12px; border: 0; border-radius: 8px; background: #fbbf24; color: #111827; font: 600 14px system-ui, sans-serif;
  }
  #rank-form button:disabled { opacity: 0.5; }
  #rank ol { list-style: none; margin: 0; padding: 0; }
  #rank li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; }
  #rank li .no { width: 24px; text-align: center; color: #94a3b8; }
  #rank li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rank li .score { font-variant-numeric: tabular-nums; }
  /* 1~3등 강조 (금·은·동) */
  #rank li.top { margin-bottom: 4px; font-weight: 700; }
  #rank li.top .no { font-size: 18px; }
  #rank li.g1 { background: linear-gradient(90deg, rgba(251,191,36,0.35), rgba(251,191,36,0.05)); border: 1px solid rgba(251,191,36,0.7); font-size: 17px; padding: 8px; box-shadow: 0 0 12px rgba(251,191,36,0.35); }
  #rank li.g1 .score { color: #fbbf24; }
  #rank li.g2 { background: linear-gradient(90deg, rgba(203,213,225,0.28), rgba(203,213,225,0.04)); border: 1px solid rgba(203,213,225,0.6); font-size: 15px; }
  #rank li.g2 .score { color: #e2e8f0; }
  #rank li.g3 { background: linear-gradient(90deg, rgba(217,119,6,0.3), rgba(217,119,6,0.04)); border: 1px solid rgba(217,119,6,0.65); font-size: 15px; }
  #rank li.g3 .score { color: #f59e0b; }
  /* 내 기록 강조 */
  #rank li.me { outline: 2px solid #38bdf8; }
  #rank .msg { color: #94a3b8; margin: 4px 0; }
  /* 낮은 가로 화면: 2단 배치. 왼쪽(#rank-side)에 이름 입력, 오른쪽 패널에 랭킹을 촘촘하게 */
  #rank-side { position: fixed; transform: translateX(-50%); width: min(300px, 42vw); }
  #rank-side[hidden] { display: none; }
  /* 일시정지 버튼: 게임 중에만 왼쪽 위에 표시 */
  #pause-btn {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(148,163,184,0.4);
    background: rgba(15,23,42,0.6); color: #f8fafc; font: 600 16px system-ui, sans-serif; padding: 0;
  }
  #pause-btn[hidden] { display: none; }
  #rank.split { left: auto; right: 16px; transform: none; width: min(320px, 46vw); padding: 8px 12px; }
  #rank.split .msg { margin: 0 0 4px; font-size: 12px; }
  #rank.split li { padding: 2px 8px; font-size: 13px; }
  #rank.split li.top { margin-bottom: 3px; }
  #rank.split li.top .no { font-size: 15px; }
  #rank.split li.g1 { padding: 4px 8px; font-size: 15px; }
  #rank.split li.g2, #rank.split li.g3 { font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rank" hidden>
  <form id="rank-form">
    <input id="rank-name" maxlength="20" placeholder="이름 (최대 12자)" autocomplete="off">
    <button type="submit">등록</button>
  </form>
  <p class="msg" id="rank-msg"></p>
  <ol id="rank-list"></ol>
</div>
<div id="rank-side" hidden></div>
<button id="pause-btn" type="button" aria-label="일시정지" hidden>❚❚</button>
<script>
// 배포 버전: 코드를 바꿔 배포할 때마다 함께 올려야 캐시된 예전 화면이 자동으로 갱신됨
const VERSION = '2026-10-24.29';
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // 물리 상수: 체공 약 0.9초, 최고 높이 약 185px
  const GRAVITY = 1850;
  const JUMP_VELOCITY = 830;
  const CAR_SCALE = 1.6; // 로드스터 크기 배율
  const ROLLS_PER_JUMP = 1; // 점프당 배럴롤 횟수 (영상 기준 약 1바퀴)
  const START_SPEED = 380;
  const MAX_SPEED = 900;
  const SPEED_GAIN = 9; // 초당 속도 증가량
  // 길게 누르기: 상승 중 누르고 있는 동안(최대 HOLD_MAX초) 중력을 줄여 더 높고 길게 점프
  // 탭: 최고 약 186px·체공 0.9초 / 길게: 최고 약 333px·체공 1.26초
  const HOLD_GRAVITY = 0.4;
  const HOLD_MAX = 0.35;
  const NEAR_MISS = 16;     // 차량 위를 이 높이(px) 이내로 스치면 '아슬아슬'
  const MAX_COMBO_BONUS = 3;
  // 라이벌 차량: 차량을 ROLL_AFTER대 넘긴 뒤부터 가끔(ROLL_CHANCE) 우리 차와 같은 모델(민트 단색 랩핑)이
  // 배럴롤 점프로 우리 차를 뛰어넘어 뒤로 지나감. 가만히 있으면 머리 위로 지나가고, 그 순간 점프하면 공중 충돌.
  // 체공 시간은 속도와 상관없이 ROLL_TIME초로 고정해 우리 차처럼 느긋하게 돎
  const ROLL_AFTER = 50;
  const ROLL_CHANCE = 0.2;
  const ROLL_TIME = 1.1;  // 체공 시간(초) — 우리 차 탭 점프 0.9초, 길게 누르기 1.26초
  // 뛰어넘기 최고 높이: 우리 차 위를 지날 때 라이벌 바닥이 약 317 이상 → 길게 누른 점프(정점 약 333)로도 위로 넘을 수 없고 충돌
  const OVER_HOP = 380;
  const OVER_SPAN = 700;  // 뛰어넘는 동안 이동 거리 (정점이 우리 차 바로 위)
  const PLAYER_H = 64;    // 공중 충돌 판정용 우리 차 높이 (루프 표시등 포함)
  // 하이퍼루프 피버타임: FEVER_SCORE점 이상이면 달이 한 주기를 돌 때마다(삭) 터널이 등장.
  // 터널 안에서 연타하면 천장에 거꾸로 매달려 달리고 그 아래로 차량이 지나감.
  // 연타가 GRIP_TIME초 넘게 끊기면 추락해 게임 오버, 터널을 빠져나가면 배럴롤로 자동 착지
  const FEVER_SCORE = 200;
  const TUNNEL_TIME = 7;    // 터널 길이 (등장 시 속도로 달리는 시간, 초)
  const TUNNEL_CEIL = 230;  // 천장 높이(px)
  const TUNNEL_TOP = 272;   // 튜브 바깥 높이(px)
  const CEIL_Y = TUNNEL_CEIL - 66; // 매달렸을 때 player.y (뒤집힌 바퀴 윗면이 천장에 닿는 높이)
  const GRIP_TIME = 0.4;    // 마지막 탭 후 이 시간 안에 다시 눌러야 매달려 있음
  const CLIMB_TIME = 0.35;  // 천장까지 뒤집으며 올라가는 시간
  const EXIT_TIME = 0.9;    // 출구 배럴롤 착지 시간
  const FEVER_BONUS = 10;   // 터널 통과 보너스
  // 난이도 단계: LEVEL_SCORE점부터 LEVEL_STEP점마다 1단계씩 (최대 MAX_LEVEL)
  // 단계가 오를수록 연속 차량·라이벌 확률이 늘고 간격 랜덤 폭이 줄며, 박자를 깨는 러시 패턴이 자주 나옴
  const LEVEL_SCORE = 500;
  const LEVEL_STEP = 150;
  const MAX_LEVEL = 5;
  const BURST_GAP = 0.1;    // 러시 중 차량 간격 = 최소 간격 + 이 값 (랜덤 없이 일정한 박자). 봇 테스트상 0.05까지는 정확히 맞추면 모두 넘을 수 있음
  const SPREAD_CUT = 0.12;  // 단계마다 간격 랜덤 폭을 이 비율씩 줄임
  const BURST_REST = 1.0;   // 러시가 끝난 뒤 쉬는 시간 (박자 깨기)
  const BURST_PAIR = 0.35;  // 러시 중 2대 연속(길게 누르기) 섞일 확률 — 탭·길게 누르기 번갈아 요구

  // 장애물 차량: 테슬라 차종 이미지 (모두 왼쪽을 향하도록 배경 제거·반전한 PNG)
  // w: 화면 표시 폭(px), hitTop: 이미지 위쪽에서 판정 제외 비율, points: 넘었을 때 점수
  const OBSTACLE_TYPES = [
    { name: 'model3',     src: 'assets/cars/model3.png',     w: 150, hitTop: 0.15, points: 1 },
    { name: 'modely',     src: 'assets/cars/modely.png',     w: 140, hitTop: 0.15, points: 1 },
    { name: 'models',     src: 'assets/cars/models.png',     w: 150, hitTop: 0.15, points: 1 },
    { name: 'cybercab',   src: 'assets/cars/cybercab.png',   w: 120, hitTop: 0.2,  points: 1 },
    { name: 'modelx',     src: 'assets/cars/modelx.png',     w: 150, hitTop: 0.35, points: 2 }, // 팔콘윙 도어
    { name: 'cybertruck', src: 'assets/cars/cybertruck.png', w: 165, hitTop: 0.1,  points: 2 },
  ];
  for (const t of OBSTACLE_TYPES) {
    t.img = new Image();
    t.img.onload = () => { t.h = Math.round(t.w * t.img.naturalHeight / t.img.naturalWidth); };
    t.img.src = t.src;
    t.h = Math.round(t.w * 0.33); // 로드 전 임시 높이
  }

  // 세로 화면(좁은 폭)에서도 다가오는 차량이 충분히 보이도록
  // 게임 월드를 최소 VIEW_MIN_W 논리 폭으로 잡고 화면에 맞게 축소해서 그림
  const VIEW_MIN_W = 820;
  // 가로로 낮은 화면(모바일 가로 모드)에서도 길게 누른 점프(최고 약 333px)와 라이벌 뛰어넘기(최고 380px)가 화면 안에 들어오도록 최소 논리 높이도 보장
  const VIEW_MIN_H = 660;
  let W = 0, H = 0, groundY = 0;  // 게임 월드(논리) 크기
  let SW = 0, SH = 0, viewScale = 1, dpr = 1; // 실제 화면 크기와 축소 배율
  let state = 'ready'; // ready | playing | over
  let speed, distance, score, best, obstacles, spawnTimer, particles, flips, popups, combo, carsPassed, level, burst;
  let holding = false; // 점프 버튼을 누르고 있는지
  let clock = 0;       // 배경 애니메이션용 경과 시간
  let player;
  let tunnel = null;   // 하이퍼루프 터널 { x: 입구 위치, len: 길이 }
  let moonCycle = 0;   // 지금까지 지난 달 주기 수 (피버타임 등장 판정)

  try { best = Number(localStorage.getItem('roadster-best')) || 0; } catch { best = 0; }

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.6, r: Math.random() * 1.2 + 0.3 }));

  function resize() {
    dpr = window.devicePixelRatio || 1;
    SW = window.innerWidth;
    SH = window.innerHeight;
    canvas.width = SW * dpr;
    canvas.height = SH * dpr;
    viewScale = Math.min(1, SW / VIEW_MIN_W, SH / VIEW_MIN_H);
    W = SW / viewScale;
    H = SH / viewScale;
    // 세로 화면은 하늘이 지나치게 넓어지지 않게 도로를 화면 중간쯤에 둠
    groundY = Math.round(H * (SH > SW ? 0.6 : 0.72));
    if (player) player.x = Math.max(100, W * 0.2);
  }

  function reset() {
    speed = START_SPEED;
    distance = 0;
    score = 0;
    flips = 0;
    combo = 0;
    carsPassed = 0;
    level = 0;
    burst = 0; // 남은 러시 차량 수
    popups = [];
    obstacles = [];
    particles = [];
    spawnTimer = 1.2;
    player = {
      x: Math.max(100, W * 0.2), y: 0, vy: 0, roll: 0, airTime: 0,
      wheel: 0, onGround: true, smokeTimer: 0, jumpClears: 0, jumpNear: 0,
      mode: null, modeT: 0, y0: 0, r0: 0, lastTap: 0, // 피버 모드: toCeiling | ceiling | falling | exitRoll
    };
    tunnel = null;
    moonCycle = Math.floor(clock / MOON_CYCLE + 0.1);
  }

  function airDuration() {
    return (2 * JUMP_VELOCITY) / GRAVITY;
  }

  function jump() {
    if (!player.onGround) return;
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    player.airTime = 0;
    player.jumpClears = 0;
    player.jumpNear = 0;
    smoke(player.x - 40 * CAR_SCALE, groundY - 6, 8, 40);
  }

  // 게임 오버 화면은 실수로 닫히지 않게 RESTART_HOLD초 동안 길게 눌러야 다시 시작
  const RESTART_HOLD = 0.6;
  let restartHold = null; // 길게 누르기 시작 시각 (clock 기준)

  function handleInput() {
    if (paused) return setPaused(false); // 일시정지 중 입력은 재개만 (점프로 이어지지 않음)
    if (state === 'playing') return feverTap() || jump();
    if (state === 'over') {
      restartHold = clock;
      return;
    }
    startGame();
  }

  function startGame() {
    if (pendingVersion && applyUpdate()) return;
    hideRanking();
    reset();
    state = 'playing';
    pauseBtn.hidden = false;
    jump();
  }

  // ---------- 일시정지 ----------
  // 게임 중 버튼 / Esc·P 키로 멈춤, 화면 탭·Enter·Space·버튼으로 재개. 앱 전환·탭 숨김 시 자동 일시정지
  const pauseBtn = document.getElementById('pause-btn');
  let paused = false;

  function setPaused(on) {
    if (on && state !== 'playing') return;
    paused = on;
    holding = false;
    pauseBtn.textContent = on ? '▶' : '❚❚';
    pauseBtn.setAttribute('aria-label', on ? '계속하기' : '일시정지');
    if (!on && player && player.mode === 'ceiling') player.lastTap = clock; // 재개 직후 바로 떨어지지 않게
  }

  pauseBtn.addEventListener('pointerdown', (e) => e.stopPropagation()); // 버튼 탭이 점프로 전달되지 않게
  pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); setPaused(!paused); pauseBtn.blur(); });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') setPaused(!paused);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return; // 랭킹 이름 입력 중에는 점프/재시작 안 함
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (e.repeat) return;
    holding = true;
    handleInput();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' || e.key === ' ') holding = false;
  });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); holding = true; handleInput(); });
  window.addEventListener('pointerup', () => { holding = false; });
  window.addEventListener('pointercancel', () => { holding = false; });
  window.addEventListener('blur', () => { holding = false; setPaused(true); });

  const isTouch = window.matchMedia('(pointer: coarse)').matches; // 조작 안내 문구용 (탭 / 키보드)

  // ---------- 파티클 (불꽃 / 연기) ----------

  function sparks(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      particles.push({
        kind: 'spark', x, y,
        vx: -Math.random() * 160 - 40,
        vy: -Math.random() * 160,
        life: 0.5 + Math.random() * 0.3,
        color,
      });
    }
  }

  // 착지·번아웃 연기: 테일램프 빛을 받은 붉은 기와 투광등의 푸른 기를 섞음
  function smoke(x, y, n, spread) {
    for (let i = 0; i < n; i++) {
      particles.push({
        kind: 'smoke',
        x: x + (Math.random() - 0.5) * spread,
        y: y - Math.random() * 10,
        vx: (Math.random() - 0.5) * 50,
        vy: -Math.random() * 40 - 10,
        r: 8 + Math.random() * 10,
        life: 1 + Math.random() * 0.8,
        maxLife: 1.8,
        color: Math.random() < 0.35 ? '249,168,212' : '203,213,225',
      });
    }
  }

  function randomType() {
    return OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  }

  function addCar(type, x) {
    obstacles.push({ type, w: type.w, h: type.h, x, passed: false, minClear: Infinity });
  }

  // 라이벌: 차체 중심이 우리 차 위를 정점으로 지나가도록 이륙·착지 지점을 잡음 (터널 안에서는 이륙하지 않음)
  function addRival(x) {
    const o = {
      type: RIVAL, w: RIVAL.w, h: RIVAL.h, x, passed: false, minClear: Infinity,
      rival: true, jumpAt: player.x + OVER_SPAN / 2 - RIVAL.w / 2, land: player.x - OVER_SPAN / 2 - RIVAL.w / 2, peak: OVER_HOP,
      t: -1, p: 0, hop: 0, roll: 0, pitch: 0, landed: false, wheel: 0,
    };
    obstacles.push(o);
    return o;
  }

  // 장애물 패턴: 단일 차량 / 2~3대 연속(길게 누르기)
  // 연속 차량은 길게 누른 점프로 넘을 수 있는 속도 구간에서만 등장. 반환값은 다음 생성까지 추가 대기 시간
  function spawnObstacle(inBurst) {
    const x0 = W + 40;
    const r = Math.random();
    let count = 1;
    if (inBurst) {
      if (speed >= 450 && r < BURST_PAIR) count = 2;
    } else if (speed >= 650 && r < 0.15 + 0.04 * level) count = 3;
    else if (speed >= 450 && r < 0.4 + 0.06 * level) count = 2;
    if (!inBurst && count === 1 && carsPassed >= ROLL_AFTER && Math.random() < ROLL_CHANCE + 0.03 * level) {
      // 앞 차량과 겹치지 않게 조금 더 뒤에서 등장
      const x = x0 + speed * 0.3;
      const o = addRival(x);
      // 우리 차 위를 지나갈 때까지 다음 차량이 오지 않게 함 (점프해야 하는 상황과 겹치지 않도록)
      return (x - o.jumpAt) / speed + ROLL_TIME + 0.3;
    }
    let x = x0;
    for (let i = 0; i < count; i++) {
      const type = randomType();
      addCar(type, x);
      x += type.w + 30;
    }
    return count > 1 ? (x - 30 - x0) / speed + 0.45 : 0;
  }

  // 다음 생성까지 대기 시간. 단계가 있으면 가끔 러시(짧은 간격으로 몰아서 등장 → 긴 휴식) 패턴
  function nextSpawn() {
    const minGap = 0.85 + 120 / speed;
    if (!burst && level && Math.random() < 0.1 + 0.05 * level) burst = 3 + Math.floor(Math.random() * (1 + level / 2));
    if (burst) {
      burst--;
      const extra = spawnObstacle(true);
      if (!burst) return minGap + extra + BURST_REST + Math.random() * 0.5;
      return minGap + extra + BURST_GAP;
    }
    const extra = spawnObstacle();
    return minGap + extra + Math.random() * 1.1 * (1 - SPREAD_CUT * level);
  }

  function popup(text, color) {
    popups.push({ text, color, x: player.x, y: groundY - player.y - 70 - popups.length * 22, life: 1.1 });
  }

  // 착지 시 보너스 정산: 아슬아슬 콤보 + 한 번에 여러 대 넘기
  function settleJump() {
    if (!player.jumpClears) return;
    if (player.jumpNear) {
      combo++;
      const bonus = Math.min(combo, MAX_COMBO_BONUS);
      score += bonus;
      popup(combo > 1 ? `아슬아슬! x${combo} +${bonus}` : `아슬아슬! +${bonus}`, '#38bdf8');
    } else {
      combo = 0;
    }
    if (player.jumpClears >= 2) {
      const bonus = player.jumpClears - 1;
      score += bonus;
      popup(`${player.jumpClears === 2 ? 'DOUBLE' : 'TRIPLE'} +${bonus}`, '#fbbf24');
    }
  }

  // ---------- 하이퍼루프 피버타임 ----------

  function inTunnel() {
    return tunnel && player.x >= tunnel.x && player.x < tunnel.x + tunnel.len;
  }

  function startFever() {
    // 이미 화면에 나온 차량을 넘고 나서 진입하도록 화면 밖 멀리서 등장
    tunnel = { x: W + 40 + speed * 1.5, len: speed * TUNNEL_TIME };
    burst = 0;
    popup('FEVER TIME!', '#f472b6');
  }

  // 터널 구간의 차량 생성: 입구 직후·출구 착지 구간은 비우고, 안쪽에만 단일 차량(점수 2배)
  // 반환값은 다음 확인까지 대기 시간, 0 이면 터널을 지나 평소대로 생성
  function feverSpawn() {
    const x0 = W + 40;
    const end = tunnel.x + tunnel.len;
    if (x0 < tunnel.x + speed * 0.9) return 0.15;
    if (x0 + 170 < end - 700) {
      // 라이벌도 가끔 등장하지만 터널 안이라 뛰지 않고 바닥에 붙어 아래로 지나감 (updateRival)
      if (carsPassed >= ROLL_AFTER && Math.random() < ROLL_CHANCE) addRival(x0);
      else addCar(randomType(), x0);
      obstacles[obstacles.length - 1].fever = true;
      return 0.55 + Math.random() * 0.7;
    }
    if (x0 < end + speed * (EXIT_TIME + 0.6)) return 0.15;
    return 0;
  }

  // 피버 중 입력: 매달려 있으면 그립 유지, 터널 안이면 천장으로 점프. 처리했으면 true
  function feverTap() {
    const m = player.mode;
    if (m === 'ceiling' || m === 'toCeiling') {
      player.lastTap = clock;
      if (m === 'ceiling') sparks(player.x + (Math.random() - 0.5) * 100, groundY - TUNNEL_CEIL + 4, 5, '#f8fafc');
      return true;
    }
    if (m) return true; // 추락·착지 중에는 입력 무시
    if (!inTunnel()) return false;
    startClimb();
    return true;
  }

  function startClimb() {
    if (player.onGround) smoke(player.x - 40 * CAR_SCALE, groundY - 6, 8, 40);
    player.mode = 'toCeiling';
    player.modeT = 0;
    player.y0 = player.y;
    player.r0 = player.roll % (Math.PI * 2);
    player.onGround = false;
    player.vy = 0;
    player.lastTap = clock;
    player.jumpClears = 0;
    player.jumpNear = 0;
  }

  function updateFeverPlayer(dt) {
    player.modeT += dt;
    if ((player.mode === 'ceiling' || player.mode === 'toCeiling') && player.x >= tunnel.x + tunnel.len) {
      // 출구: 배럴롤로 자동 착지
      player.mode = 'exitRoll';
      player.modeT = 0;
      player.y0 = player.y;
    }
    const ease = (p) => p - Math.sin(2 * Math.PI * p) / (2 * Math.PI);
    if (player.mode === 'toCeiling') {
      const p = Math.min(1, player.modeT / CLIMB_TIME);
      const e = p * p * (3 - 2 * p);
      player.y = player.y0 + (CEIL_Y - player.y0) * e;
      player.roll = player.r0 + (Math.PI - player.r0) * e;
      if (p >= 1) {
        player.mode = 'ceiling';
        player.lastTap = clock;
        sparks(player.x, groundY - TUNNEL_CEIL + 4, 12, '#f8fafc');
      }
    } else if (player.mode === 'ceiling') {
      player.y = CEIL_Y;
      player.roll = Math.PI;
      if (clock - player.lastTap > GRIP_TIME) {
        player.mode = 'falling';
        player.vy = 0;
        popup('연타 실패!', '#ef4444');
      }
    } else if (player.mode === 'falling') {
      player.vy -= GRAVITY * dt;
      player.y += player.vy * dt;
      if (player.y <= 0) {
        player.y = 0;
        gameOver(); // 뒤집힌 채로 도로에 추락
      }
    } else if (player.mode === 'exitRoll') {
      // 뒤집힌 상태(π)에서 1.5바퀴 돌며 작은 포물선으로 내려와 바로 선 채 착지
      const p = Math.min(1, player.modeT / EXIT_TIME);
      player.y = player.y0 * (1 - p) + 160 * p * (1 - p);
      player.roll = Math.PI + Math.PI * 3 * ease(p);
      if (p >= 1) {
        player.mode = null;
        player.y = 0;
        player.vy = 0;
        player.roll = 0;
        player.onGround = true;
        player.smokeTimer = 0.45;
        flips++;
        score += FEVER_BONUS;
        popup(`하이퍼루프 클리어! +${FEVER_BONUS}`, '#f472b6');
        smoke(player.x, groundY - 4, 26, 100 * CAR_SCALE);
      }
    }
  }

  function update(dt) {
    clock += dt;
    if (state === 'over' && restartHold !== null) {
      if (!holding) restartHold = null;
      else if (clock - restartHold >= RESTART_HOLD) {
        restartHold = null;
        startGame();
      }
    }
    // 바퀴는 항상 시계 방향으로 보이게: 스포크 5개(72° 간격)라 한 프레임에 36° 이상 돌면
    // 눈에는 거꾸로 도는 것처럼 보이므로(마차 바퀴 효과) 프레임당 회전량을 0.45rad(약 26°)로 제한
    player.wheel += Math.min(speed * dt / 14, 0.45);
    updateParticles(dt);
    for (const p of popups) { p.life -= dt; p.y -= 40 * dt; }
    popups = popups.filter((p) => p.life > 0);
    // 달이 한 주기를 돌 때마다(삭) 피버타임 판정
    const cycle = Math.floor(clock / MOON_CYCLE + 0.1);
    const newMoon = cycle !== moonCycle;
    moonCycle = cycle;
    if (state !== 'playing') return;
    if (newMoon && score >= FEVER_SCORE && !tunnel) startFever();
    const lv = score < LEVEL_SCORE ? 0 : Math.min(MAX_LEVEL, 1 + Math.floor((score - LEVEL_SCORE) / LEVEL_STEP));
    if (lv > level) {
      level = lv;
      popup(`LEVEL ${level}!`, '#f87171');
    }
    if (tunnel) {
      tunnel.x -= speed * dt;
      if (tunnel.x + tunnel.len < -100) tunnel = null;
    }

    speed = Math.min(MAX_SPEED, speed + SPEED_GAIN * dt);
    distance += speed * dt;

    // 일반 점프 중 터널에 들어가면 자동으로 천장에 매달림 (이후 연타 필요)
    if (!player.mode && !player.onGround && inTunnel()) startClimb();
    if (player.mode) {
      updateFeverPlayer(dt);
      if (state !== 'playing') return;
    } else if (!player.onGround) {
      player.airTime += dt;
      const boost = holding && player.vy > 0 && player.airTime < HOLD_MAX;
      player.vy -= GRAVITY * (boost ? HOLD_GRAVITY : 1) * dt;
      player.y += player.vy * dt;
      // 배럴롤: 이륙 직후 천천히 → 정점 부근에서 빠르게 → 착지 전 다시 천천히 정렬
      const p = Math.min(1, player.airTime / airDuration());
      const eased = p - Math.sin(2 * Math.PI * p) / (2 * Math.PI);
      player.roll = Math.PI * 2 * ROLLS_PER_JUMP * eased;
      if (player.y <= 0) {
        player.y = 0;
        player.vy = 0;
        player.roll = 0;
        player.onGround = true;
        player.smokeTimer = 0.45;
        flips++;
        settleJump();
        smoke(player.x, groundY - 4, 26, 100 * CAR_SCALE);
      }
    } else if (player.smokeTimer > 0) {
      // 착지 직후 잠깐 이어지는 타이어 연기
      player.smokeTimer -= dt;
      smoke(player.x - 32 * CAR_SCALE, groundY - 4, 2, 20);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const wait = tunnel ? feverSpawn() : 0;
      spawnTimer = wait || nextSpawn();
    }

    for (const o of obstacles) {
      o.x -= speed * dt;
      if (o.rival) updateRival(o, dt);
      // 라이벌은 판정 범위가 우리 차 뒤로 완전히 벗어난 뒤에 통과 처리 (보너스 표시 후 충돌하는 일이 없도록)
      const behind = o.rival ? o.x + o.w * 0.92 < player.x - 44 * CAR_SCALE : o.x + o.w < player.x - 45;
      if (!o.passed && behind) {
        o.passed = true;
        carsPassed++;
        const pts = o.type.points * (o.fever ? 2 : 1);
        score += pts;
        if (o.rival) popup(`안전운전 +${pts}점`, o.fever ? '#f472b6' : '#facc15');
        else if (o.fever) popup(`FEVER +${pts}`, '#f472b6');
        if (!player.onGround && !o.rival) {
          player.jumpClears++;
          if (o.minClear < NEAR_MISS) player.jumpNear++;
        }
      }
    }
    obstacles = obstacles.filter((o) => o.x + o.w > -50);

    // 충돌 판정 (회전 중인 차체를 감안해 박스를 조금 줄임)
    const half = 44 * CAR_SCALE;
    const px1 = player.x - half, px2 = player.x + half;
    const pBottom = groundY - player.y;
    for (const o of obstacles) {
      if (o.rival && o.hop > 0) {
        // 공중의 라이벌: 높이 구간 [hop, hop + 차 높이]와 우리 차 [y, y + PLAYER_H]가 겹치면 공중 충돌
        if (px2 > o.x + o.w * 0.08 && px1 < o.x + o.w * 0.92
          && player.y + PLAYER_H > o.hop && player.y < o.hop + o.h * (1 - o.type.hitTop)) {
          gameOver();
          break;
        }
        continue;
      }
      // 이미지 여백을 감안해 좌우 8%, 위쪽 hitTop 비율만큼 판정 제외
      const oTop = groundY - o.h * (1 - o.type.hitTop);
      if (px2 > o.x + o.w * 0.08 && px1 < o.x + o.w * 0.92) {
        o.minClear = Math.min(o.minClear, oTop - pBottom); // 차량 위 여유 높이 (아슬아슬 판정)
        if (pBottom > oTop) {
          gameOver();
          break;
        }
      }
    }
  }

  function updateParticles(dt) {
    const scroll = state === 'playing' ? speed : 0;
    for (const p of particles) {
      if (p.kind === 'smoke') {
        p.x += (p.vx - scroll * 0.75) * dt;
        p.y += p.vy * dt;
        p.vy *= 0.98;
        p.r += 34 * dt;
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
      }
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  function gameOver() {
    state = 'over';
    pauseBtn.hidden = true;
    restartHold = null; // 충돌 순간 누르고 있던 입력은 다시 시작으로 이어지지 않게
    sparks(player.x + 30, groundY - player.y, 30, '#ef4444');
    smoke(player.x + 30, groundY - player.y, 14, 60);
    if (score > best) {
      best = score;
      try { localStorage.setItem('roadster-best', String(best)); } catch {}
    }
    showRanking();
  }

  // ---------- 새 버전 자동 갱신 ----------
  // GitHub Pages 캐시 때문에 예전 index.html 이 열려 있으면, 서버의 최신 파일 버전과 비교해
  // 게임 중이 아닐 때 ?v=새버전 주소로 다시 열어 캐시를 우회함
  let pendingVersion = null;

  function applyUpdate() {
    try {
      // 같은 버전으로 반복 새로고침되는 것 방지 (배포 직후 서버 반영이 늦는 경우)
      if (sessionStorage.getItem('roadster-reload') === pendingVersion) return false;
      sessionStorage.setItem('roadster-reload', pendingVersion);
    } catch {}
    location.replace(`${location.pathname}?v=${encodeURIComponent(pendingVersion)}`);
    return true;
  }

  async function checkUpdate() {
    try {
      const html = await (await fetch(location.pathname, { cache: 'no-store' })).text();
      const latest = (html.match(/const VERSION = '([^']+)'/) || [])[1];
      if (!latest || latest === VERSION) return;
      pendingVersion = latest;
      if (state === 'ready') applyUpdate();
    } catch {}
  }

  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

  // ---------- 온라인 랭킹 (Supabase) ----------
  // publishable 키는 공개용 키라 코드에 포함해도 됨. 쓰기 권한은 DB의 RLS 정책(supabase/scores.sql)으로 제한
  const SUPABASE_URL = 'https://auwkyehgnxejxacoklqt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_I-9YEVmXr6EnOGLPzjL-qg_OZlnHI5d';
  // 랭킹 등록 가능한 최대 점수 (만점). DB check 제약(supabase/scores.sql)과 같은 값이어야 함
  const MAX_SCORE = 9999;
  const canSubmit = (v) => Number.isInteger(v) && v > 0 && v <= MAX_SCORE;
  const rankEl = document.getElementById('rank');
  const rankForm = document.getElementById('rank-form');
  const rankSide = document.getElementById('rank-side');
  const rankName = document.getElementById('rank-name');
  const rankMsg = document.getElementById('rank-msg');
  const rankList = document.getElementById('rank-list');
  let submittedScore = false;

  function api(path, options = {}) {
    return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers },
    }).then(async (r) => {
      const text = await r.text(); // 본문이 비어 있는 응답(void 함수 등)도 처리
      if (!r.ok) { console.error('Supabase', r.status, text); throw new Error(r.status); }
      return text ? JSON.parse(text) : null;
    });
  }

  async function loadRanking() {
    rankMsg.textContent = '랭킹 불러오는 중…';
    try {
      const rows = await api('scores?select=name,score&order=score.desc,created_at.asc&limit=10');
      let myName = '';
      try { myName = (localStorage.getItem('roadster-name') || '').toLowerCase(); } catch {}
      rankList.replaceChildren(...rows.map((r, i) => {
        const li = document.createElement('li');
        if (i < 3) li.classList.add('top', `g${i + 1}`);
        if (myName && r.name.toLowerCase() === myName) li.classList.add('me');
        const no = document.createElement('span'); no.className = 'no'; no.textContent = ['🥇', '🥈', '🥉'][i] || i + 1;
        const n = document.createElement('span'); n.className = 'name'; n.textContent = r.name;
        const v = document.createElement('span'); v.className = 'score'; v.textContent = r.score;
        li.append(no, n, v);
        return li;
      }));
      rankMsg.textContent = rows.length ? 'TOP 10' : '아직 기록이 없어요';
    } catch {
      rankMsg.textContent = '랭킹을 불러오지 못했어요';
    }
  }

  function showRanking() {
    submittedScore = false;
    rankForm.hidden = !canSubmit(score);
    rankForm.querySelector('button').disabled = false;
    try { rankName.value = localStorage.getItem('roadster-name') || ''; } catch {}
    rankEl.hidden = false;
    loadRanking();
  }

  function hideRanking() {
    rankEl.hidden = true;
    rankSide.hidden = true;
    overLayoutKey = ''; // 다음 게임 오버 때 배치를 다시 적용 (같은 화면 크기여도 rankSide 를 다시 보이게)
    rankName.blur();
  }

  rankForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    // 이름은 12자까지지만, 랭킹 초기화 문구(DB 에서만 판별)를 위해 입력은 20자까지 받아 그대로 전달
    const name = rankName.value.trim().slice(0, 20);
    if (!name || submittedScore || !canSubmit(score)) return;
    submittedScore = true;
    rankForm.querySelector('button').disabled = true;
    try {
      // 같은 이름은 한 줄만 유지하고 최고 점수만 갱신 (DB 함수 submit_score). 'reset' 이면 랭킹 초기화됨
      const result = await api('rpc/submit_score', { method: 'POST', body: JSON.stringify({ p_name: name, p_score: score }) });
      rankForm.hidden = true;
      rankName.blur();
      if (result === 'reset') {
        rankName.value = '';
        try { localStorage.removeItem('roadster-name'); } catch {}
        await loadRanking();
        rankMsg.textContent = '랭킹이 초기화됐어요. 새로운 영웅을 기다려요!';
        return;
      }
      try { localStorage.setItem('roadster-name', name); } catch {}
      await loadRanking();
    } catch {
      submittedScore = false;
      rankForm.querySelector('button').disabled = false;
      rankMsg.textContent = name.length > 12 ? '이름은 12자까지 쓸 수 있어요' : '등록에 실패했어요. 다시 시도해 주세요';
    }
  });

  // ---------- 배경: 영상 속 야간 시연장 ----------

  function repeatX(spacing, parallax, offset) {
    const xs = [];
    const shift = (distance * parallax + offset) % spacing;
    for (let x = -shift - spacing; x < W + spacing; x += spacing) xs.push(x);
    return xs;
  }

  function glow(x, y, r, rgb, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // 달: 초승달 → 상현 → 보름달 → 하현 → 그믐달 순으로 천천히 변하고,
  // 삭(새달) 부근에서는 부드럽게 사라졌다가 다시 나타남
  const MOON_CYCLE = 60; // 한 주기(초)
  const craters = [[-0.3, -0.25, 0.18], [0.25, 0.1, 0.22], [-0.1, 0.4, 0.13], [0.35, -0.35, 0.1], [-0.45, 0.15, 0.09]];

  function drawMoon() {
    const phase = (clock / MOON_CYCLE + 0.1) % 1;          // 0 = 삭, 0.5 = 보름
    const lit = (1 - Math.cos(phase * Math.PI * 2)) / 2;     // 밝은 면적 비율
    const fade = Math.min(1, Math.min(phase, 1 - phase) / 0.06); // 삭 부근 페이드
    const alpha = fade * fade * (3 - 2 * fade);
    if (alpha <= 0) return;
    const r = 34;
    const x = W * 0.66, y = groundY * 0.24 + Math.sin(clock * 0.3) * 4;

    ctx.save();
    ctx.globalAlpha = alpha;
    glow(x, y, r * (2.2 + lit * 1.8), '226,232,240', 0.08 + lit * 0.14);
    ctx.translate(x, y);
    // 어두운 면 (지구조)
    ctx.fillStyle = 'rgba(148,163,184,0.10)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // 밝은 면: 반원 + 명암 경계(타원)로 위상 표현. 차는 달은 오른쪽, 기우는 달은 왼쪽이 밝음
    if (phase > 0.5) ctx.scale(-1, 1);
    const k = Math.cos(phase * Math.PI * 2);
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.ellipse(0, 0, r * Math.abs(k), r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
    ctx.closePath();
    const surface = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
    surface.addColorStop(0, '#fffbeb');
    surface.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = surface;
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = 'rgba(148,163,184,0.28)';
    for (const [cx, cy, cr] of craters) {
      ctx.beginPath(); ctx.arc(cx * r * (phase > 0.5 ? -1 : 1), cy * r, cr * r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 빌딩 높이는 도로 높이(groundY) 대비 비율. 시작 화면 문구를 가리지 않는 범위로 제한
  function makeSkyline(seed, minW, maxW, minH, maxH) {
    let v = seed;
    const r = () => (v = (v * 16807) % 2147483647) / 2147483647;
    const list = [];
    let x = 0;
    while (x < 3000) {
      const w = minW + r() * (maxW - minW);
      list.push({ x, w, h: minH + r() * (maxH - minH), step: r() < 0.3 ? 0.3 + r() * 0.3 : 0 });
      x += w + r() * 10;
    }
    return { list, total: x };
  }
  const cityFar = makeSkyline(11, 50, 110, 0.08, 0.2);
  const cityNear = makeSkyline(23, 60, 130, 0.1, 0.28);

  function drawSkyline(row, parallax, color) {
    ctx.fillStyle = color;
    const shift = (distance * parallax) % row.total;
    for (let base = -shift; base < W; base += row.total) {
      for (const b of row.list) {
        const x = base + b.x;
        if (x > W || x + b.w < 0) continue;
        const h = groundY * b.h;
        ctx.fillRect(x, groundY - h, b.w, h);
        // 일부 빌딩은 계단식 옥상
        if (b.step) ctx.fillRect(x + b.w * 0.25, groundY - h - groundY * 0.03, b.w * b.step, groundY * 0.03);
      }
    }
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, '#01030a');
    sky.addColorStop(1, '#0b1324');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, groundY);

    ctx.fillStyle = 'rgba(226,232,240,0.6)';
    for (const s of stars) ctx.fillRect(s.x * W, s.y * groundY, s.r, s.r);

    drawMoon();

    // 검정 빌딩 실루엣 (창문·조명 없음, 하늘보다 살짝 어두운 2단)
    drawSkyline(cityFar, 0.1, '#070b16');
    drawSkyline(cityNear, 0.25, '#03050b');

    // 원경 가로등: 눈부시지 않게 작고 희미한 주황 전구만 (빛기둥·노면 빛 없음)
    for (const x of repeatX(560, 0.15, 0)) {
      const top = groundY - 120;
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 1.5, top, 3, 120);
      glow(x, top, 18, '253,186,116', 0.08);
      ctx.fillStyle = 'rgba(253,230,138,0.3)';
      ctx.beginPath(); ctx.arc(x, top, 2, 0, Math.PI * 2); ctx.fill();
    }

    // 전신주 + 전선
    const poles = repeatX(320, 0.6, 100);
    ctx.strokeStyle = 'rgba(100,116,139,0.35)';
    ctx.lineWidth = 1;
    for (let i = 0; i < poles.length - 1; i++) {
      const a = poles[i], b = poles[i + 1];
      for (const dy of [0, 8]) {
        ctx.beginPath();
        ctx.moveTo(a, groundY - 150 + dy);
        ctx.quadraticCurveTo((a + b) / 2, groundY - 130 + dy, b, groundY - 150 + dy);
        ctx.stroke();
      }
    }
    for (const x of poles) {
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(x - 2, groundY - 155, 4, 155);
      ctx.fillRect(x - 14, groundY - 150, 28, 3);
    }

    // 지면 안개
    const haze = ctx.createLinearGradient(0, groundY - 40, 0, groundY);
    haze.addColorStop(0, 'rgba(148,163,184,0)');
    haze.addColorStop(1, 'rgba(148,163,184,0.12)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, groundY - 40, W, 40);

    // 도로
    ctx.fillStyle = '#0c0f16';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#334155';
    const dash = distance % 60;
    for (let x = -dash; x < W; x += 60) ctx.fillRect(x, groundY + 22, 30, 3);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, groundY, W, 2);
  }

  // ---------- 로드스터 의사 3D 모델 ----------
  // 사각면(quad) 메시를 진행 축(x) 기준으로 회전 → 뒷면 제거 + 깊이 정렬 + 조명
  // → 회전 각도별 프레임 이미지로 미리 렌더링해서 공중에서는 이미지만 교체

  // 2세대 로드스터 지붕선: 덕테일 → 패스트백 루프 → 윈드실드 → 긴 보닛
  const PROFILE = [
    [-51, 19], [-49, 23.5], [-45, 25], [-38, 25.6], [-32, 27], [-26, 30], [-20, 33],
    [-12, 34.6], [-4, 35], [4, 34.6], [10, 33.2], [15, 31], [19, 28], [22, 25],
    [28, 24], [34, 23], [40, 22], [46, 20], [50, 16.5], [52.5, 13], [53, 10],
  ];
  const BODY_BOTTOM = 8;
  const SHOULDER = 23.5; // 이 높이 위는 폭이 좁은 캐빈
  const HALF_WIDTH = 17;  // 하부 차체 반폭
  const CABIN_WIDTH = 13; // 캐빈 하단 반폭
  const ROOF_WIDTH = 10;  // 지붕 반폭
  const AXIS_Y = 20;      // 회전축 높이
  const ROLL_FRAMES = 48;
  const SPRITE_W = 150, SPRITE_H = 120; // 차량 단위 기준 스프라이트 크기
  const YELLOW = '#fbbf24', GLASS = '#1e293b', DARK = '#111827', BODY = '#f1f5f9';

  // 카카오 T 택시 랩핑: 흰 차체 + 뒤쪽 사선 노란 스트라이프 2줄
  // 스트라이프는 위로 갈수록 차 뒤쪽으로 기울어짐 (u = x + 1.1 * (y - 8))
  function wrapColor(x, y) {
    const u = x + 1.1 * (y - BODY_BOTTOM);
    return (u > -24 && u < -16) || (u > -10 && u < -2) ? YELLOW : BODY;
  }
  const TAXI = { color: wrapColor, taxi: true };
  // 라이벌: 같은 차체에 민트 단색 랩핑 (택시 스트라이프·도어 데칼·루프 표시등 없음)
  const RIVAL_MINT = { color: () => '#6ee7b7', taxi: false };

  function topAt(x) {
    for (let i = 1; i < PROFILE.length; i++) {
      const [x1, y1] = PROFILE[i];
      if (x <= x1) {
        const [x0, y0] = PROFILE[i - 1];
        return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
      }
    }
    return PROFILE[PROFILE.length - 1][1];
  }

  // hint: 바깥 방향 힌트 [y, z] → 법선 방향 보정용
  function quad(list, pts, color, hint, extra) {
    const [a, b, , d] = pts;
    const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
    const v = [d[0] - a[0], d[1] - a[1], d[2] - a[2]];
    let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const len = Math.hypot(...n) || 1;
    n = n.map((k) => k / len);
    if (n[1] * hint[0] + n[2] * hint[1] < 0) n = n.map((k) => -k);
    list.push({ pts, color, n, ...extra });
  }

  function buildMesh(livery) {
    const wrapColor = livery.color;
    const q = [];
    const xs = [];
    for (let x = -51; x < 53; x += 3) xs.push(x);
    xs.push(53);

    for (let i = 0; i < xs.length - 1; i++) {
      const x0 = xs[i], x1 = xs[i + 1];
      const xm = (x0 + x1) / 2;
      const t0 = topAt(x0), t1 = topAt(x1);
      const l0 = Math.min(t0, SHOULDER), l1 = Math.min(t1, SHOULDER);
      const cabin = t0 > SHOULDER || t1 > SHOULDER;
      const hasWindow = x0 >= -31 && x1 <= 21;

      for (const side of [1, -1]) {
        const z = HALF_WIDTH * side;
        // 하부 옆면: 로커 패널 + 랩핑 색을 2단위 높이 칸으로 나눠 사선 스트라이프 표현
        quad(q, [[x0, BODY_BOTTOM, z], [x1, BODY_BOTTOM, z], [x1, 9.5, z], [x0, 9.5, z]], '#334155', [0, side]);
        for (let ya = 9.5; ya < Math.max(l0, l1); ya += 2) {
          const yb0 = Math.min(ya + 2, l0), yb1 = Math.min(ya + 2, l1);
          if (yb0 <= ya && yb1 <= ya) continue;
          quad(q, [[x0, ya, z], [x1, ya, z], [x1, Math.max(ya, yb1), z], [x0, Math.max(ya, yb0), z]],
            wrapColor(xm, ya + 1), [0, side]);
        }
        if (cabin) {
          // 어깨선 → 안쪽으로 좁아지는 캐빈 옆면(유리)
          quad(q, [[x0, l0, z], [x1, l1, z], [x1, l1, CABIN_WIDTH * side], [x0, l0, CABIN_WIDTH * side]],
            wrapColor(xm, SHOULDER), [1, 0]);
          quad(q, [[x0, l0, CABIN_WIDTH * side], [x1, l1, CABIN_WIDTH * side], [x1, t1, ROOF_WIDTH * side], [x0, t0, ROOF_WIDTH * side]],
            hasWindow ? GLASS : wrapColor(xm, (l0 + t0) / 2), [0.3, side]);
        }
      }

      if (cabin) {
        // 지붕: 앞유리·뒷유리는 유리색, 가운데는 차체색
        const glassTop = x0 >= 7 || x1 <= -23;
        quad(q, [[x0, t0, ROOF_WIDTH], [x1, t1, ROOF_WIDTH], [x1, t1, -ROOF_WIDTH], [x0, t0, -ROOF_WIDTH]],
          glassTop && hasWindow ? GLASS : wrapColor(xm, t0), [1, 0]);
      } else {
        // 보닛
        quad(q, [[x0, t0, HALF_WIDTH], [x1, t1, HALF_WIDTH], [x1, t1, -HALF_WIDTH], [x0, t0, -HALF_WIDTH]], wrapColor(xm, t0), [1, 0]);
      }
      // 바닥
      quad(q, [[x0, BODY_BOTTOM, HALF_WIDTH], [x1, BODY_BOTTOM, HALF_WIDTH], [x1, BODY_BOTTOM, -HALF_WIDTH], [x0, BODY_BOTTOM, -HALF_WIDTH]], '#0b0f19', [-1, 0]);
    }

    for (const side of [1, -1]) {
      const z = (HALF_WIDTH + 0.3) * side;
      // 슬림 헤드램프 / 일자 테일램프 (옆면보다 살짝 바깥)
      quad(q, [[43, 18, z], [50, 16.5, z], [50, 18, z], [43, 19.5, z]], '#e0f2fe', [0, side], { emissive: true });
      quad(q, [[-51, 19.5, z], [-47, 19.5, z], [-47, 22, z], [-51, 21.5, z]], '#ef4444', [0, side], { emissive: true });
      if (!livery.taxi) continue;
      // 도어 데칼: 캐릭터 얼굴 + '카카오 T' 로고 (면보다 살짝 바깥, 그리기 전용)
      const dz = (HALF_WIDTH + 0.4) * side;
      quad(q, [[-16, 12, dz], [-8, 12, dz], [-8, 20, dz], [-16, 20, dz]], BODY, [0, side], { decal: 'face', side });
      quad(q, [[2, 13, dz], [22, 13, dz], [22, 19, dz], [2, 19, dz]], BODY, [0, side], { decal: 'logo', side });
      // 루프 kakao T 표시등 옆면
      quad(q, [[-10, 35, 5 * side], [6, 35, 5 * side], [6, 40, 5 * side], [-10, 40, 5 * side]], YELLOW, [0, side], { decal: 'sign', side, emissive: true });
    }
    if (livery.taxi) quad(q, [[-10, 40, 5], [6, 40, 5], [6, 40, -5], [-10, 40, -5]], YELLOW, [1, 0], { emissive: true });
    return q;
  }

  const MESH = buildMesh(TAXI);
  const RIVAL_MESH = buildMesh(RIVAL_MINT);
  const WHEELS = [];
  for (const x of [-32, 33]) for (const side of [1, -1]) WHEELS.push({ x, z: (HALF_WIDTH + 0.6) * side });

  function rotY(y, z, c, s) { return (y - AXIS_Y) * c - z * s; }
  function rotZ(y, z, c, s) { return (y - AXIS_Y) * s + z * c; }

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }

  function drawWheel3D(g, w, c, s, rot) {
    const cx = w.x, cy = -rotY(9, w.z, c, s);
    const ac = Math.abs(c), as = Math.abs(s);
    const R = 10;
    // 바퀴 옆면은 cos 만큼 납작, 타이어 트레드 폭은 sin 만큼 보임
    g.fillStyle = '#05070c';
    g.beginPath();
    g.ellipse(cx, cy, R, R * ac + 4 * as, 0, 0, Math.PI * 2);
    g.fill();
    if (ac > 0.25) {
      g.fillStyle = '#9ca3af';
      g.beginPath();
      g.ellipse(cx, cy, R * 0.6, R * 0.6 * ac, 0, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = '#374151';
      g.lineWidth = 1.4;
      for (let k = 0; k < 5; k++) {
        const a = rot + k * Math.PI * 0.4;
        g.beginPath();
        g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(a) * R * 0.6, cy + Math.sin(a) * R * 0.6 * ac);
        g.stroke();
      }
    }
  }

  // 옆면 데칼을 면의 기울기대로 투영 (side: 가까운 면 1 / 먼 면 -1 → 글자 좌우 방향)
  function drawDecal(g, face, pts, c, k) {
    const cx = (pts[0][0] + pts[2][0]) / 2, cy = (pts[0][1] + pts[2][1]) / 2;
    g.save();
    g.transform(face.side, 0, 0, c, cx, cy);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (face.decal === 'sign') {
      g.fillStyle = DARK;
      g.font = 'bold 3.4px system-ui, sans-serif';
      g.fillText('kakao T', 0, 0.2);
    } else if (face.decal === 'logo') {
      g.fillStyle = shade(DARK, 1);
      g.font = 'bold 4.6px system-ui, sans-serif';
      g.fillText('카카오 T', 0, 0.3);
    } else {
      // 동그란 곰 캐릭터 얼굴 (귀 + 눈 + 주둥이)
      const fur = shade('#f59e0b', k), dark = '#3f2a14';
      g.fillStyle = fur;
      for (const ex of [-2.6, 2.6]) { g.beginPath(); g.arc(ex, -2.8, 1.4, 0, Math.PI * 2); g.fill(); }
      g.beginPath(); g.arc(0, 0, 3.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = dark;
      for (const ex of [-1.3, 1.3]) { g.beginPath(); g.arc(ex, -0.6, 0.45, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = shade('#fde68a', k);
      g.beginPath(); g.ellipse(0, 1.2, 1.5, 1, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = dark;
      g.beginPath(); g.arc(0, 0.8, 0.45, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  // roll 각도의 로드스터를 원점(회전축) 기준으로 그림
  function renderRoadster(g, roll, wheelRot, mesh = MESH) {
    const c = Math.cos(roll), s = Math.sin(roll);
    const items = [];
    for (const f of mesh) {
      const nz = f.n[1] * s + f.n[2] * c;
      if (nz <= 0.01) continue; // 뒷면 제거
      const ny = f.n[1] * c - f.n[2] * s;
      let depth = 0;
      const pts = f.pts.map(([x, y, z]) => {
        depth += rotZ(y, z, c, s);
        return [x, -rotY(y, z, c, s)];
      });
      items.push({ depth: depth / 4, face: f, pts, ny, nz });
    }
    for (const w of WHEELS) items.push({ depth: rotZ(9, w.z, c, s), wheel: w });
    items.sort((a, b) => a.depth - b.depth);

    for (const it of items) {
      if (it.wheel) { drawWheel3D(g, it.wheel, c, s, wheelRot); continue; }
      const { face, pts, ny, nz } = it;
      // 위쪽 투광등 + 정면 반사광 조명
      const k = face.emissive ? 1 : Math.min(1.15, 0.42 + 0.38 * Math.max(0, ny) + 0.32 * nz);
      // 도어 데칼은 바탕 없이 그림만 얹음 (아래 스트라이프가 비치도록)
      if (face.decal && face.decal !== 'sign') {
        if (nz > 0.3) drawDecal(g, face, pts, c, k);
        continue;
      }
      g.fillStyle = shade(face.color, k);
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < 4; i++) g.lineTo(pts[i][0], pts[i][1]);
      g.closePath();
      g.fill();
      g.strokeStyle = g.fillStyle; // 면 사이 틈 제거
      g.lineWidth = 0.6;
      g.stroke();
      if (face.decal && nz > 0.3) drawDecal(g, face, pts, c, k);
    }
  }

  // 회전 프레임 스프라이트 미리 생성
  let rollSprites = [];
  function buildSprites() {
    const dpr = window.devicePixelRatio || 1;
    const k = CAR_SCALE * dpr;
    rollSprites = [];
    for (let i = 0; i < ROLL_FRAMES; i++) {
      const cv = document.createElement('canvas');
      cv.width = SPRITE_W * k;
      cv.height = SPRITE_H * k;
      const g = cv.getContext('2d');
      g.setTransform(k, 0, 0, k, cv.width / 2, cv.height / 2);
      renderRoadster(g, (i / ROLL_FRAMES) * Math.PI * 2, 0);
      rollSprites.push(cv);
    }
  }

  // 차체 모서리의 추진 분사구: 영상처럼 X자로 뻗어 회전을 일으키는 파란 분사
  const THRUSTERS = [
    { x: -44, y: BODY_BOTTOM + 1, z: HALF_WIDTH, dy: -0.7, dz: 0.7 },
    { x: -44, y: SHOULDER, z: -HALF_WIDTH, dy: 0.7, dz: -0.7 },
    { x: 40, y: BODY_BOTTOM + 1, z: -HALF_WIDTH, dy: -0.7, dz: -0.7 },
    { x: 40, y: SHOULDER - 1, z: HALF_WIDTH, dy: 0.7, dz: 0.7 },
  ];

  function drawJet(x0, y0, dx, dy, len, width) {
    const x1 = x0 + dx * len, y1 = y0 + dy * len;
    const nx = -dy, ny = dx;
    const grad = ctx.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, 'rgba(240,249,255,0.95)');
    grad.addColorStop(0.25, 'rgba(125,211,252,0.8)');
    grad.addColorStop(1, 'rgba(59,130,246,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x0 + nx * width * 0.5, y0 + ny * width * 0.5);
    ctx.quadraticCurveTo(x0 + dx * len * 0.5 + nx * width, y0 + dy * len * 0.5 + ny * width, x1, y1);
    ctx.quadraticCurveTo(x0 + dx * len * 0.5 - nx * width, y0 + dy * len * 0.5 - ny * width, x0 - nx * width * 0.5, y0 - ny * width * 0.5);
    ctx.fill();
  }

  // 현재 roll 기준 분사 화염을 그림 (front=true면 차체 앞쪽에 있는 분사만)
  function drawThrusters(roll, intensity, front) {
    const c = Math.cos(roll), s = Math.sin(roll);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const t of THRUSTERS) {
      const depth = rotZ(t.y, t.z, c, s);
      if ((depth > 0) !== front) continue;
      const px = t.x, py = -rotY(t.y, t.z, c, s);
      // 분사 방향(화면): 회전된 방향의 세로 성분 + 진행 반대쪽으로 흩날림
      const sy = -(t.dy * c - t.dz * s);
      let dx = -0.55, dy = sy;
      const m = Math.hypot(dx, dy);
      dx /= m; dy /= m;
      const len = (22 + Math.random() * 10) * (0.45 + 0.55 * Math.abs(sy)) * intensity;
      drawJet(px, py, dx, dy, len, 3.2);
      glow(px, py, 6, '186,230,253', 0.6 * intensity);
    }
    if (front) {
      // 후방 메인 분사
      drawJet(-51, -rotY(16, 0, c, s), -1, 0, (16 + Math.random() * 8) * intensity, 3);
    }
    ctx.restore();
  }

  // 천장 매달리기 특수효과 (그립이 줄면 빨갛게 깜빡여 경고)
  // back: 차 뒤 — 뒤로 흐르는 속도선 + 차체 아래 네온 언더글로우
  // front: 차 앞 — 바퀴와 천장 사이 자석 빛·전기 아크 + 연타 순간 퍼지는 빛
  function drawCeilingFx(x, grip, front) {
    const ceil = groundY - TUNNEL_CEIL;
    const warn = grip < 0.4;
    const rgb = warn ? '248,113,113' : '125,211,252';
    const flick = warn ? 0.55 + 0.45 * Math.sin(clock * 40) : 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (!front) {
      for (let i = 0; i < 5; i++) {
        const y = ceil + 12 + i * 11;
        const len = 110 + ((clock * 700 + i * 53) % 90);
        const end = x - 70 * CAR_SCALE + i * 6;
        const tail = ctx.createLinearGradient(end - len, 0, end, 0);
        tail.addColorStop(0, `rgba(${rgb},0)`);
        tail.addColorStop(1, `rgba(${rgb},0.6)`);
        ctx.fillStyle = tail;
        ctx.fillRect(end - len, y, len, 2);
      }
      ctx.save();
      ctx.translate(x, groundY - CEIL_Y + 4);
      ctx.scale(1, 0.25);
      glow(0, 0, 60 * CAR_SCALE, warn ? '248,113,113' : '244,114,182', 0.35 * flick);
      ctx.restore();
    } else {
      const tap = Math.max(0, 1 - (clock - player.lastTap) / 0.15);
      ctx.strokeStyle = `rgba(${rgb},${0.9 * flick})`;
      ctx.lineWidth = 1.5;
      for (const wx of [-32, 33]) {
        const px = x + wx * CAR_SCALE;
        glow(px, ceil + 2, 28 + 18 * tap, rgb, (0.35 + 0.4 * grip) * flick);
        for (let k = 0; k < 2; k++) {
          ctx.beginPath();
          ctx.moveTo(px + (Math.random() - 0.5) * 30, ceil);
          for (let seg = 1; seg <= 4; seg++) ctx.lineTo(px + (Math.random() - 0.5) * 26, ceil + seg * 6);
          ctx.stroke();
        }
      }
      if (tap > 0) glow(x, ceil + 20, 90 * tap + 20, '255,255,255', 0.3 * tap);
    }
    ctx.restore();
  }

  function drawRoadster() {
    const { x, y, roll, wheel: rot } = player;
    const cy = groundY - y - AXIS_Y * CAR_SCALE;

    if (y < 70) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.ellipse(x, groundY + 1, 52 * CAR_SCALE * (1 - y / 90), 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (player.mode) {
      // 피버: 뒤집힌 채 매달리기·배럴롤 착지 (바퀴 회전을 위해 실시간 렌더)
      const hanging = player.mode === 'ceiling';
      const grip = Math.max(0, 1 - (clock - player.lastTap) / GRIP_TIME);
      if (hanging) drawCeilingFx(x, grip, false);
      const jets = hanging ? 0.55 + 0.25 * Math.random() : player.mode === 'toCeiling' || player.mode === 'exitRoll' ? 1 : 0;
      ctx.save();
      ctx.translate(x, cy);
      ctx.scale(CAR_SCALE, CAR_SCALE);
      if (jets) drawThrusters(roll, jets, false);
      renderRoadster(ctx, roll, rot);
      if (jets) drawThrusters(roll, jets, true);
      ctx.restore();
      if (hanging) drawCeilingFx(x, grip, true);
      return;
    }

    if (player.onGround) {
      // 바닥에 번지는 붉은 테일램프 빛
      const tail = x - 51 * CAR_SCALE;
      const trail = ctx.createLinearGradient(tail - 120, 0, tail, 0);
      trail.addColorStop(0, 'rgba(239,68,68,0)');
      trail.addColorStop(1, 'rgba(239,68,68,0.45)');
      ctx.fillStyle = trail;
      ctx.fillRect(tail - 120, groundY - 4, 120, 8);
      glow(tail, groundY - 20 * CAR_SCALE, 22, '239,68,68', 0.5);

      // 지면 주행: 바퀴 회전을 위해 실시간 렌더
      ctx.save();
      ctx.translate(x, cy);
      ctx.scale(CAR_SCALE, CAR_SCALE);
      renderRoadster(ctx, 0, rot);
      ctx.restore();
      return;
    }

    // 공중: 회전 각도에 맞는 프레임 이미지로 교체 + 분사 화염
    const p = Math.min(1, player.airTime / airDuration());
    const intensity = p > 0.85 ? (1 - p) / 0.15 : Math.min(1, p / 0.08 + 0.3);
    const pitch = -Math.atan2(player.vy, speed) * 0.35;
    const frame = Math.round((roll / (Math.PI * 2)) * ROLL_FRAMES) % ROLL_FRAMES;

    ctx.save();
    ctx.translate(x, cy);
    ctx.rotate(pitch);
    ctx.scale(CAR_SCALE, CAR_SCALE);
    drawThrusters(roll, intensity, false);
    ctx.drawImage(rollSprites[frame], -SPRITE_W / 2, -SPRITE_H / 2, SPRITE_W, SPRITE_H);
    drawThrusters(roll, intensity, true);
    ctx.restore();
  }

  // ---------- 라이벌 차량 (우리 차와 같은 모델, 왼쪽을 향해 달려옴) ----------
  // 판정용 크기: 차체 길이 약 106, 바퀴 아래~지붕 약 36 (모델 단위) × CAR_SCALE
  const RIVAL = { name: 'rival', w: Math.round(106 * CAR_SCALE), h: Math.round(36 * CAR_SCALE), hitTop: 0.25, points: 3 }; // 통과 시 '안전운전' 보너스 3점

  function updateRival(o, dt) {
    o.wheel += speed * dt / 14;
    if (o.landed) return;
    if (o.t < 0) {
      if (o.x > o.jumpAt) return;
      // 터널 안에서는 천장 때문에 뛰지 않고 바닥에 붙어 그대로 지나감
      if (tunnel && o.x < tunnel.x + tunnel.len && o.x + o.w > tunnel.x) {
        o.landed = true;
        return;
      }
      o.t = 0; // 이륙
      smoke(o.x + o.w / 2, groundY - 4, 10, o.w * 0.6);
    }
    o.t += dt;
    const p = Math.min(1, o.t / ROLL_TIME);
    o.p = p;
    o.x = o.jumpAt + (o.land - o.jumpAt) * p;
    // 포물선 궤적 + 플레이어 배럴롤과 같은 이징(천천히 → 정점 부근 빠르게 → 착지 전 천천히) + 기수 들림
    o.hop = 4 * o.peak * p * (1 - p);
    o.roll = Math.PI * 2 * (p - Math.sin(2 * Math.PI * p) / (2 * Math.PI));
    o.pitch = Math.atan2(4 * o.peak * (1 - 2 * p) / ROLL_TIME, speed) * 0.35;
    if (p >= 1) {
      o.landed = true;
      o.hop = 0;
      o.roll = 0;
      o.pitch = 0;
      smoke(o.x + o.w / 2, groundY - 4, 18, o.w);
    }
  }

  function drawRival(o) {
    const cx = o.x + o.w / 2;
    const cy = groundY - o.hop - AXIS_Y * CAR_SCALE;
    const k = 1 - o.hop / (o.peak * 2);
    ctx.fillStyle = `rgba(0,0,0,${0.45 * k})`;
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 1, o.w * 0.48 * k, 5 * k, 0, 0, Math.PI * 2);
    ctx.fill();
    const flying = o.t >= 0 && !o.landed;
    const intensity = flying ? (o.p > 0.85 ? (1 - o.p) / 0.15 : Math.min(1, o.p / 0.08 + 0.3)) : 0;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(o.pitch); // 왼쪽을 향하므로 시계 방향 회전이 기수 들림
    ctx.scale(-CAR_SCALE, CAR_SCALE); // 좌우 반전: 플레이어 쪽(왼쪽)을 향함
    if (flying) drawThrusters(o.roll, intensity, false);
    renderRoadster(ctx, o.roll, o.wheel, RIVAL_MESH);
    if (flying) drawThrusters(o.roll, intensity, true);
    ctx.restore();
    if (!flying) glow(o.x + o.w * 0.03, groundY - o.h * 0.45, 16, '224,242,254', 0.55);
  }

  // ---------- 하이퍼루프 터널 ----------
  // 뒤(실내)는 차량보다 먼저, 천장·입출구 기둥은 차량 뒤에 그려 천장에 매달린 모습이 되게 함

  function tunnelSpan() {
    if (!tunnel) return null;
    const x1 = Math.max(-20, tunnel.x), x2 = Math.min(W + 20, tunnel.x + tunnel.len);
    return x2 > x1 ? [x1, x2] : null;
  }

  // 플레드 터널: 테슬라 Model S Plaid 발표 영상처럼 검정 바탕에
  // 세로줄은 흰색 → 검정 → 빨강 → 흰색 순서로 같은 두께로 반복, 가로줄은 얇은 흰 선 4개
  // 흰색 다음 반복의 흰색이 바로 붙는 곳에만 두께의 1/4 검정 틈을 넣어 구분
  const STRIPE_W = 24; // 세로줄 두께 (흰·검정·빨강 모두 동일)
  const PLAID = STRIPE_W * 4 + STRIPE_W / 4; // 세로줄 반복 폭
  const V_STRIPES = [ // [시작 위치, 색] — 검정 줄과 틈은 검정 바탕
    [0, 'rgba(255,255,255,0.72)'],
    [STRIPE_W * 2, 'rgba(225,18,40,0.7)'],
    [STRIPE_W * 3, 'rgba(255,255,255,0.72)'],
  ];
  // 가로 흰 선 4개: 바닥에서 터널 높이의 1/3 지점에 7px 간격으로 모아 배치 (값은 천장에서부터의 위치)
  const H_LINES = [-10.5, -3.5, 3.5, 10.5].map((d) => TUNNEL_CEIL * 2 / 3 + d);
  // 확대·축소한 패턴으로 채우면 매 프레임 다시 샘플링해 느리므로,
  // 화면 픽셀 크기에 맞춘 타일을 배율별로 한 번만 만들어 둠 (화면 크기가 바뀌면 비움)
  let plaidCache = {};

  // wall=true: 터널 안쪽 벽 전용 타일 (높이 = 터널 내부 전체). 가로 빛줄 번짐과 아래쪽 어둡게 처리를
  // 타일에 미리 넣어 두어 매 프레임 화면 전체를 덧칠하지 않게 함
  function plaid(scale, wall) {
    const px = Math.max(8, Math.round(PLAID * scale * viewScale * dpr));
    const key = wall ? `w${px}` : px;
    if (plaidCache[key]) return plaidCache[key];
    const h = wall ? TUNNEL_CEIL : PLAID;
    const cv = document.createElement('canvas');
    cv.width = px;
    cv.height = Math.round(h * px / PLAID);
    const g = cv.getContext('2d');
    g.scale(px / PLAID, px / PLAID);
    g.fillStyle = '#060608';
    g.fillRect(0, 0, PLAID, h);
    g.globalCompositeOperation = 'lighter'; // 줄이 겹치는 곳이 더 밝게 빛남
    for (const [p, c] of V_STRIPES) {
      g.fillStyle = c;
      g.fillRect(p, 0, STRIPE_W, h);
    }
    if (wall) {
      // 얇은 가로 흰 선 + 은은한 번짐
      for (const y of H_LINES) {
        g.fillStyle = 'rgba(255,255,255,0.08)';
        g.fillRect(0, y - 5, PLAID, 10);
        g.fillStyle = 'rgba(255,255,255,0.85)';
        g.fillRect(0, y - 1, PLAID, 2);
      }
      // 차량이 묻히지 않게 전체를 살짝, 아래쪽은 더 어둡게
      g.globalCompositeOperation = 'source-over';
      const shade = g.createLinearGradient(0, 0, 0, h);
      shade.addColorStop(0, 'rgba(6,6,8,0.3)');
      shade.addColorStop(0.4, 'rgba(6,6,8,0.3)');
      shade.addColorStop(1, 'rgba(6,6,8,0.55)');
      g.fillStyle = shade;
      g.fillRect(0, 0, PLAID, h);
    }
    plaidCache[key] = ctx.createPattern(cv, wall ? 'repeat-x' : 'repeat');
    return plaidCache[key];
  }

  // (ox, oy) 를 무늬 원점으로, scale 배율로 채움 → 터널과 함께 흘러감
  // 화면 픽셀 좌표(정수 위치)에서 그려 패턴이 다시 샘플링되지 않게 함
  function fillPlaid(x, y, w, h, ox, oy, scale, wall) {
    const f = viewScale * dpr;
    const dx = Math.round(ox * f), dy = Math.round(oy * f);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, dx, dy);
    ctx.fillStyle = plaid(scale, wall);
    ctx.fillRect(x * f - dx, y * f - dy, w * f, h * f);
    ctx.restore();
  }

  // 옆에서 본 플레드 터널: 정면에서 소실점으로 모이던 길이 방향 줄은 가로줄로, 사각 틀은 세로줄로 보임.
  // 가로줄을 따라 빛이 진행 방향으로 흐르고, 출구 쪽에서 빛이 쏟아져 들어오며, 광택 바닥에 터널이 비침
  const PULSES = 3;   // 가로줄을 따라 흐르는 빛 개수

  function drawTunnelBack() {
    const span = tunnelSpan();
    if (!span) return;
    const [x1, x2] = span;
    const ceil = groundY - TUNNEL_CEIL, w = x2 - x1;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x1, ceil, w, TUNNEL_CEIL);
    ctx.clip();
    // 안쪽 벽 체크 무늬 (터널과 함께 흘러감)
    fillPlaid(x1, ceil, w, TUNNEL_CEIL, tunnel.x, ceil, 1, true);
    ctx.globalCompositeOperation = 'lighter';
    const lanes = [];
    for (const y of H_LINES) lanes.push(ceil + y);
    // 가로줄을 따라 진행 방향으로 흐르는 빛 (머리가 밝은 꼬리)
    for (let i = 0; i < PULSES; i++) {
      const y = lanes[i % lanes.length];
      const head = tunnel.x + ((clock * 900 + i * 1597) % tunnel.len);
      if (head < x1 - 10 || head - 180 > x2) continue;
      const tail = ctx.createLinearGradient(head - 180, 0, head, 0);
      tail.addColorStop(0, 'rgba(255,40,70,0)');
      tail.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.fillStyle = tail;
      ctx.fillRect(head - 180, y - 2, 180, 4);
      glow(head, y, 14, '255,255,255', 0.8);
    }
    // 출구에서 쏟아지는 빛
    const exit = tunnel.x + tunnel.len;
    if (exit < x2 + 300) {
      glow(exit, ceil + TUNNEL_CEIL / 2, 260, '255,235,240', 0.35);
      glow(exit, ceil + TUNNEL_CEIL / 2, 70, '255,255,255', 0.7);
    }
    ctx.restore();

    drawTunnelReflection(x1, w);
    // 바닥 라인 (가로 흰 선 4개와 헷갈리지 않게 어둡게)
    ctx.fillStyle = 'rgba(100,116,139,0.6)';
    ctx.fillRect(x1, groundY - 2, w, 2);
  }

  // 광택 바닥: 터널 벽을 도로 위로 뒤집어 비추고 아래로 갈수록 사라지게 함
  function drawTunnelReflection(x1, w) {
    const R = Math.min(H - groundY, 90);
    if (R <= 0) return;
    const f = viewScale * dpr;
    const dx = Math.round(tunnel.x * f);
    ctx.save();
    ctx.globalAlpha = 0.35;
    // y = groundY 기준 상하 반전: 무늬 원점(천장)이 거울 위치(2 * groundY - 천장)로 감
    ctx.setTransform(1, 0, 0, -1, dx, Math.round((groundY + TUNNEL_CEIL) * f));
    ctx.fillStyle = plaid(1, true);
    ctx.fillRect(x1 * f - dx, (TUNNEL_CEIL - R) * f, w * f, R * f);
    ctx.restore();
    const fade = ctx.createLinearGradient(0, groundY, 0, groundY + R);
    fade.addColorStop(0, 'rgba(12,15,22,0.1)');
    fade.addColorStop(1, 'rgba(12,15,22,1)');
    ctx.fillStyle = fade;
    ctx.fillRect(x1, groundY, w, R);
  }

  function drawTunnelFront() {
    const span = tunnelSpan();
    if (!span) return;
    const [x1, x2] = span;
    const top = groundY - TUNNEL_TOP, ceil = groundY - TUNNEL_CEIL;
    // 천장 레일 (바깥 튜브)
    fillPlaid(x1, top, x2 - x1, TUNNEL_TOP - TUNNEL_CEIL, tunnel.x, top, 1);
    const shell = ctx.createLinearGradient(0, top, 0, ceil);
    shell.addColorStop(0, 'rgba(6,6,8,0.45)');
    shell.addColorStop(1, 'rgba(6,6,8,0.75)');
    ctx.fillStyle = shell;
    ctx.fillRect(x1, top, x2 - x1, TUNNEL_TOP - TUNNEL_CEIL);
    ctx.fillStyle = 'rgba(100,116,139,0.8)'; // 천장 레일 (가로 흰 선과 구분되게 회색)
    ctx.fillRect(x1, ceil - 3, x2 - x1, 3);
    // 입구·출구 기둥 + 이름
    for (const [px, label] of [[tunnel.x, 'HYPERLOOP'], [tunnel.x + tunnel.len, 'EXIT']]) {
      if (px < -60 || px > W + 60) continue;
      ctx.fillStyle = '#111114';
      ctx.fillRect(px - 14, top - 14, 28, TUNNEL_TOP + 14);
      ctx.fillStyle = '#e11d48';
      ctx.fillRect(px - 14, top - 14, 28, 4);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(px - 2, top - 10, 4, TUNNEL_TOP + 10);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 16px system-ui, sans-serif';
      ctx.textAlign = label === 'EXIT' ? 'right' : 'left';
      ctx.fillText(label, px + (label === 'EXIT' ? -22 : 22), top + 26);
    }
  }

  // ---------- 장애물 차량 ----------

  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px system-ui, sans-serif';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life / 0.4);
      // 밝은 피버 터널 위에서도 읽히도록 어두운 외곽선
      ctx.strokeStyle = 'rgba(2,6,23,0.85)';
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    if (o.rival) return drawRival(o);
    const top = groundY - o.h;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w / 2, groundY + 1, o.w * 0.48, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    if (o.type.img.complete && o.type.img.naturalWidth) {
      // 야간 장면에 맞게 살짝 어둡게
      ctx.filter = 'brightness(0.78)';
      ctx.drawImage(o.type.img, o.x, top + 2, o.w, o.h);
      ctx.filter = 'none';
    }
    glow(o.x + o.w * 0.03, top + o.h * 0.5, 16, '224,242,254', 0.55);
    glow(o.x + o.w * 0.97, top + o.h * 0.4, 10, '239,68,68', 0.45);
  }

  function drawParticles(kind) {
    for (const p of particles) {
      if (p.kind !== kind) continue;
      if (kind === 'smoke') {
        const a = Math.max(0, p.life / p.maxLife) * 0.35;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, `rgba(${p.color},${a})`);
        g.addColorStop(1, `rgba(${p.color},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      } else {
        ctx.globalAlpha = Math.max(0, p.life * 1.5);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }
    }
  }

  // 시작 화면: ① 제목·슬로건(브랜드) ② 시작 유도 한 줄 ③ 도로 아래 조작 안내 카드(낮은 대비)
  function drawStartScreen(W, H) {
    const y = H * 0.3;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
    ctx.font = '800 34px system-ui, sans-serif';
    ctx.fillText('Kakao Taxi Jump', W / 2, y);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText('테슬라를 뛰어 넘어라 !', W / 2, y + 34);

    ctx.globalAlpha = 0.6 + 0.3 * Math.cos(clock * Math.PI * 2 / 1.6); // 천천히 깜빡임
    ctx.fillStyle = '#f8fafc';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(isTouch ? '화면을 탭해서 시작' : 'Enter / Space로 시작', W / 2, y + 84);
    ctx.globalAlpha = 1;

    const rows = [
      [isTouch ? '탭' : 'Enter / Space', '점프'],
      ['길게 누르기', '더 높이, 더 멀리'],
      ['아슬아슬', '보너스 점수'],
      [isTouch ? '탭 연타' : '연타', `${FEVER_SCORE}점 이후 피버 터널 매달리기`],
      ['LEVEL', `${LEVEL_SCORE}점부터 난이도 상승`],
    ];
    const ground = groundY * viewScale; // 화면 좌표 기준 도로 위치
    const rowH = 30, padX = 16, padY = 12, gap = 12;
    ctx.font = '600 12px system-ui, sans-serif';
    const keyW = Math.max(...rows.map((r) => ctx.measureText(r[0]).width)) + 16;
    ctx.font = '13px system-ui, sans-serif';
    const descW = Math.max(...rows.map((r) => ctx.measureText(r[1]).width));
    const cardW = padX * 2 + keyW + gap + descW;
    const cardH = padY * 2 + rowH * rows.length - 8;
    const space = H - ground;
    if (space < cardH + 24) return; // 가로로 낮은 화면에서는 생략
    const cx = (W - cardW) / 2, cy = ground + Math.min(space * 0.3, space - cardH - 12);

    roundRect(cx, cy, cardW, cardH, 14);
    ctx.fillStyle = 'rgba(15,23,42,0.6)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    rows.forEach(([key, desc], i) => {
      const ry = cy + padY + i * rowH;
      ctx.font = '600 12px system-ui, sans-serif';
      const kw = ctx.measureText(key).width + 16;
      const kx = cx + padX + keyW - kw;
      roundRect(kx, ry, kw, 22, 6);
      ctx.fillStyle = 'rgba(148,163,184,0.14)';
      ctx.fill();
      ctx.fillStyle = '#cbd5e1';
      ctx.textAlign = 'center';
      ctx.fillText(key, kx + kw / 2, ry + 15);
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'left';
      ctx.fillText(desc, cx + padX + keyW + gap, ry + 15.5);
    });
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // HUD는 축소 없이 실제 화면 크기 기준으로 그림 (세로 화면에서도 글자 크기 유지)
  function drawHUD() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = SW, H = SH;
    // 2단 게임 오버 화면에서는 오른쪽 위를 랭킹 패널이 쓰므로 점수는 왼쪽 문구 위에 표시
    const splitOver = state === 'over' && isSplit(W, H);
    ctx.fillStyle = '#f8fafc';
    if (!splitOver) {
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`SCORE ${score}`, W - 16, 32);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText(`BEST ${best} · ROLLS ${flips || 0}${state === 'playing' && level ? ` · LV ${level}` : ''}`, W - 16, 54);
    }
    if (paused) {
      // 일시정지 화면: 반투명 어둡게 + 안내
      ctx.fillStyle = 'rgba(2,6,23,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.font = 'bold 32px system-ui, sans-serif';
      ctx.fillText('일시정지', W / 2, H * 0.4);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(isTouch ? '화면을 탭해서 계속' : 'Enter / Space / Esc로 계속', W / 2, H * 0.4 + 34);
      return;
    }
    if (state === 'playing' && combo > 1) {
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`COMBO x${combo}`, W - 16, 74);
      ctx.fillStyle = '#f8fafc';
    }
    if (state === 'playing' && tunnel && player.mode !== 'exitRoll' && player.x < tunnel.x + tunnel.len) drawFeverHUD(W);

    ctx.textAlign = 'center';
    if (state === 'ready') {
      // 시작 화면 좌측 상단 버전 표기
      ctx.textAlign = 'left';
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(148,163,184,0.8)';
      ctx.fillText(`v${VERSION}`, 16, 24);
      drawStartScreen(W, H);
    } else if (state === 'over') {
      const { x, y } = layoutOver(W, H);
      if (splitOver) {
        ctx.font = '14px system-ui, sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(`SCORE ${score} · BEST ${best}`, x, y - 40);
        ctx.fillStyle = '#f8fafc';
      }
      ctx.font = 'bold 32px system-ui, sans-serif';
      ctx.fillText('CRASH!', x, y);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText(isTouch ? '길게 눌러서 다시 시작' : 'Enter / Space 길게 눌러 다시 시작', x, y + 32);
      // 길게 누르는 동안 진행 막대
      if (restartHold !== null) {
        const t = Math.min(1, (clock - restartHold) / RESTART_HOLD);
        ctx.fillStyle = 'rgba(148,163,184,0.3)';
        ctx.fillRect(x - 80, y + 42, 160, 4);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x - 80, y + 42, 160 * t, 4);
      }
    }
  }

  // 피버 안내: 상단 점수 표시와 겹치지 않게 그 아래 가운데에 표시
  function drawFeverHUD(W) {
    const y = 108;
    const mash = isTouch ? '탭 연타' : 'Enter / Space 연타';
    ctx.textAlign = 'center';
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.fillStyle = `rgba(244,114,182,${0.75 + 0.25 * Math.sin(clock * 10)})`;
    ctx.fillText('FEVER TIME', W / 2, y);
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    const m = player.mode;
    if (m === 'ceiling' || m === 'toCeiling') {
      ctx.fillText(`${mash}! 멈추면 추락`, W / 2, y + 24);
      const grip = Math.max(0, 1 - (clock - player.lastTap) / GRIP_TIME);
      ctx.fillStyle = 'rgba(148,163,184,0.3)';
      ctx.fillRect(W / 2 - 80, y + 34, 160, 6);
      ctx.fillStyle = grip > 0.4 ? '#67e8f9' : '#ef4444';
      ctx.fillRect(W / 2 - 80, y + 34, 160 * grip, 6);
    } else if (m === 'falling') {
      ctx.fillStyle = '#ef4444';
      ctx.fillText('추락!', W / 2, y + 24);
    } else if (player.x >= tunnel.x) {
      ctx.fillText(`${mash}해서 천장에 매달리기!`, W / 2, y + 24);
    } else {
      ctx.fillText(`하이퍼루프 진입! 터널에서 ${mash}`, W / 2, y + 24);
    }
  }

  // 게임 오버 문구(캔버스)와 랭킹 패널(HTML)이 겹치지 않게 배치하고 문구 위치 {x, y} 를 돌려줌
  // - 기본: 문구 아래(y + 58)에 패널. 화면이 낮으면 문구를 올리고 패널은 스크롤
  // - 낮은 가로 화면: 2단. 왼쪽에 문구 + 이름 입력, 오른쪽에 랭킹 목록
  let overLayoutKey = '';
  function isSplit(W, H) {
    return W > H && H < 560;
  }

  function layoutOver(W, H) {
    const split = isSplit(W, H);
    let x = W / 2, y;
    let key;
    if (split) {
      x = Math.round(W * 0.27);
      y = Math.round(Math.max(72, H * 0.3));
      key = `s${x},${y},${H},${rankEl.hidden}`;
      if (key !== overLayoutKey) {
        rankEl.classList.add('split');
        if (rankForm.parentNode !== rankSide) rankSide.append(rankForm);
        rankEl.style.top = '12px';
        rankEl.style.maxHeight = `${H - 24}px`;
        rankSide.style.left = `${x}px`;
        rankSide.style.top = `${y + 58}px`;
        rankSide.hidden = rankEl.hidden;
      }
    } else {
      const panelH = rankEl.hidden ? 0 : rankEl.scrollHeight;
      y = Math.round(Math.max(48, Math.min(H * 0.3, H - panelH - 70)));
      key = `n${y},${H},${rankEl.hidden}`;
      if (key !== overLayoutKey) {
        rankEl.classList.remove('split');
        if (rankForm.parentNode !== rankEl) rankEl.prepend(rankForm);
        rankSide.hidden = true;
        rankEl.style.top = `${y + 58}px`;
        rankEl.style.maxHeight = `${Math.max(120, H - y - 70)}px`;
      }
    }
    overLayoutKey = key;
    return { x, y };
  }

  function draw() {
    ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
    drawBackground();
    drawTunnelBack();
    for (const o of obstacles) drawObstacle(o);
    drawParticles('smoke');
    drawRoadster();
    drawTunnelFront();
    drawParticles('spark');
    drawPopups();
    drawHUD();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); buildSprites(); plaidCache = {}; });
  resize();
  buildSprites();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

        time: 0, last: performance.now(), d: 0, s: START_SPEED, y: 0, vy: 0, air: 0, ground: true, roll: 0, hold: 0,
        score: 0, obs: [], spawn: 1.2, items: [], nextItem: ITEM_EVERY, itemAt: 0, white: 0, fog: 0, shield: 0,
      };
      b.status = 'playing';
      b.sentAt = 0;
    }
  }

  // 방장 화면에서 매 프레임 호출
  function botsTick(now) {
    if (!room || room.host !== myId || !room.bots.size) return;
    const humansRunning = [...room.players.values()].some((p) => !p.bot && running(p));
    for (const b of room.bots.values()) {
      if (b.status !== 'playing' || !b.sim) continue;
      const m = b.sim;
      let left = Math.min(0.5, (now - m.last) / 1000); // 탭이 잠깐 멈춰도 따라잡음
      m.last = now;
      while (left > 0 && b.status === 'playing') { const dt = Math.min(1 / 60, left); left -= dt; botStep(b, dt, !humansRunning); }
      if (b.status !== 'playing') { botSend(b); trackMe(); continue; }
      if (now - b.sentAt >= FRAME_SEND * 1000) botSend(b);
    }
  }

  function botSend(b) {
    b.sentAt = performance.now();
    const m = b.sim;
    const r1 = (v) => Math.round(v), r2 = (v) => Math.round(v * 100) / 100;
    const payload = {
      id: b.id, score: m.score, status: b.status, t: ++b.t,
      f: {
        d: r1(m.d), s: r1(m.s), p: [r1(m.y), r1(m.vy), r2(m.roll), r2(m.air), m.ground ? 1 : 0, ''],
        o: m.obs.filter((o) => o.x < 1800).map((o) => o.rival ? [o.sky ? -2 : -1, r1(o.x), r1(o.jump), r1(o.land), r2(o.t), o.landed ? 1 : 0] : [o.ti, r1(o.x)]),
        tn: 0, fx: (m.time < m.white ? 1 : 0) | (m.time < m.fog ? 2 : 0) | (m.time < m.shield ? 4 : 0),
      },
    };
    room.ch.send({ type: 'broadcast', event: 'frame', payload });
    mergePlayer(payload);
    renderRoom();
  }

  function botStep(b, dt, endgame) {
    const m = b.sim;
    const lvl = BOT_LEVELS[b.level] || BOT_LEVELS.normal;
    m.time += dt;
    m.s = Math.min(MAX_SPEED, m.s + SPEED_GAIN * dt);
    m.d += m.s * dt;
    // 차량 이동 (민트 라이벌은 컴퓨터 차 위를 배럴롤로 넘어감)
    for (const o of m.obs) {
      if (o.rival && !o.sky && !o.landed && o.t >= 0) {
        o.t += dt;
        const p = Math.min(1, o.t / ROLL_TIME);
        o.x = o.jump + (o.land - o.jump) * p;
        o.hop = 4 * OVER_HOP * p * (1 - p);
        o.roll = Math.PI * 2 * (p - Math.sin(2 * Math.PI * p) / (2 * Math.PI));
        if (p >= 1) { o.landed = true; o.hop = 0; }
      } else {
        o.x -= m.s * dt;
        if (o.rival && !o.sky && !o.landed && o.t < 0 && o.x <= o.jump) o.t = 0;
      }
      const behind = o.rival ? o.x + o.w * 0.92 < -44 * CAR_SCALE : o.x + o.w < -45;
      if (!o.passed && behind) { o.passed = true; m.score += o.pts; }
    }
    m.obs = m.obs.filter((o) => o.x + o.w > -600);
    // 차량 생성 (게임과 같은 간격 규칙의 단순한 버전, 2~3대 묶음 포함)
    m.spawn -= dt;
    if (m.spawn <= 0) {
      const r = Math.random();
      const count = m.s >= 650 && r < 0.15 ? 3 : m.s >= 450 && r < 0.4 ? 2 : 1;
      let x = BOT_SPAWN_X;
      for (let i = 0; i < count; i++) {
        const ti = Math.floor(Math.random() * OBSTACLE_TYPES.length), t = OBSTACLE_TYPES[ti];
        m.obs.push({ ti, x, w: t.w, h: t.h, hitTop: t.hitTop, pts: t.points });
        x += t.w + 30;
      }
      const extra = count === 1 ? 0 : m.s >= MAX_SPEED ? GROUP_PAD : (x - 30 - BOT_SPAWN_X) / m.s + 0.45;
      m.spawn = 0.85 + 120 / m.s + extra + Math.random() * 1.1;
    }
    // 점프 판단: 다음 차량마다 한 번, 난이도 확률로 실수
    if (m.ground) {
      const ahead = m.obs.filter((o) => !o.passed && o.x + o.w > -44 * CAR_SCALE);
      const mintNear = ahead.some((o) => o.rival && !o.sky && !o.landed && (o.t >= 0 || o.x - o.jump < m.s * 0.9));
      const cars = ahead.filter((o) => !o.rival || o.sky || o.landed).sort((a, c) => a.x - c.x);
      const next = cars[0];
      if (next && !next.decided && next.x - 44 * CAR_SCALE < m.s * BOT_LEAD) {
        next.decided = true;
        const fail = lvl.fail * (m.time < m.white || m.time < m.fog ? 4 : 1) * (endgame ? 10 : 1);
        if (Math.random() >= fail && !mintNear) {
          m.hold = cars.filter((o) => o.x < next.x + 520).length > 1 ? m.time + HOLD_MAX : 0;
          m.vy = JUMP_VELOCITY;
          m.ground = false;
          m.air = 0;
        }
      }
    }
    if (!m.ground) {
      m.air += dt;
      const boost = m.time < m.hold && m.vy > 0 && m.air < HOLD_MAX;
      m.vy -= GRAVITY * (boost ? HOLD_GRAVITY : 1) * dt;
      m.y += m.vy * dt;
      const p = Math.min(1, m.air / airDuration());
      m.roll = Math.PI * 2 * ROLLS_PER_JUMP * (p - Math.sin(2 * Math.PI * p) / (2 * Math.PI));
      if (m.y <= 0) { m.y = 0; m.vy = 0; m.roll = 0; m.ground = true; }
    }
    // 충돌 (게임과 같은 판정 상자)
    const half = 44 * CAR_SCALE;
    for (const o of m.obs) {
      if (half <= o.x + o.w * 0.08 || -half >= o.x + o.w * 0.92) continue;
      const crash = o.rival && !o.sky && o.hop > 0
        ? m.y + PLAYER_H > o.hop && m.y < o.hop + o.h * (1 - o.hitTop)
        : m.y < o.h * (1 - o.hitTop);
      if (crash) { b.status = 'over'; return; }
    }
    // 아이템전: 50점마다 아이템, 몇 초 뒤 사용
    if (itemMode()) {
      while (m.score >= m.nextItem) {
        m.nextItem += ITEM_EVERY;
        if (m.items.length < ITEM_MAX) { m.items.push(ITEM_KINDS[Math.floor(Math.random() * ITEM_KINDS.length)]); m.itemAt = m.time + 2 + Math.random() * 4; }
      }
      if (m.items.length && m.time >= m.itemAt) { botUseItem(b, m.items.shift()); m.itemAt = m.time + 2 + Math.random() * 4; }
    }
  }

  function botUseItem(b, k) {
    const m = b.sim;
    if (k === 'shield') {
      m.white = m.fog = 0;
      m.obs = m.obs.filter((o) => !o.attack || o.passed || (o.rival && o.t >= 0) || o.x < 60 * CAR_SCALE);
      m.shield = Math.max(m.shield, m.time) + SHIELD_TIME;
      return;
    }
    const targets = [...room.players.values()].filter((p) => p.id !== b.id && running(p));
    if (!targets.length) { m.items.unshift(k); return; }
    const payload = { room: room.code, from: b.id, to: targets.map((p) => p.id), kind: k };
    room.ch.send({ type: 'broadcast', event: 'attack', payload });
    receiveAttack(payload); // 방장 자신
    botsReceive(payload);   // 방장이 돌리는 다른 컴퓨터
  }

  // 방장이 돌리는 컴퓨터가 공격을 받음
  function botsReceive({ room: code, from, to, kind }) {
    if (!room || room.host !== myId || code !== room.code || !Array.isArray(to) || !ITEM_INFO[kind] || kind === 'shield') return;
    for (const b of room.bots.values()) {
      if (b.id === from || !to.includes(b.id) || b.status !== 'playing' || !b.sim) continue;
      const m = b.sim;
      if (m.time < m.shield) continue;
      if (kind === 'white') m.white = Math.max(m.white, m.time) + ATTACK_TIME;
      else if (kind === 'fog') m.fog = Math.max(m.fog, m.time) + ATTACK_TIME;
      else botForceRival(m, kind === 'sky');
    }
  }

  // forceRival 과 같은 규칙: 이미 오는 차량을 다 지난 뒤에 배치하고 다음 차량도 늦춤
  function botForceRival(m, sky) {
    const GAP = 0.9;
    const jump = OVER_SPAN / 2 - RIVAL.w / 2, land = -OVER_SPAN / 2 - RIVAL.w / 2;
    const done = (o) => o.rival && !o.sky ? (o.x - o.jump) / m.s + ROLL_TIME + 0.3 : (o.x + o.w) / m.s;
    let t = 0;
    for (const o of m.obs) if (!o.passed && !(o.rival && o.t >= 0)) t = Math.max(t, done(o));
    const o = {
      rival: true, sky, attack: true, x: Math.max(BOT_SPAWN_X, m.s * (t + GAP)), w: RIVAL.w, h: RIVAL.h, hitTop: RIVAL.hitTop,
      pts: sky ? SKY_RIVAL.points : RIVAL.points, jump, land, t: -1, landed: sky, hop: 0, roll: 0,
    };
    m.obs.push(o);
    m.spawn = Math.max(m.spawn, done(o) + GAP - BOT_SPAWN_X / m.s);
  }

  document.getElementById('room-bot-add').addEventListener('click', (e) => { e.currentTarget.blur(); addBot(); });

  function modeLabel(mode) {
    return mode === 'item' ? '🎁 아이템전' : mode === 'normal' ? '🚕 노템전' : '';
  }

  // ---------- 배경: 영상 속 야간 시연장 ----------

  function repeatX(spacing, parallax, offset) {
    const xs = [];
    const shift = (distance * parallax + offset) % spacing;
    for (let x = -shift - spacing; x < W + spacing; x += spacing) xs.push(x);
    return xs;
  }

  // 원형 빛 번짐 스프라이트 (색별로 한 번만 만들고 크기·투명도만 바꿔 그림)
  const glowSprites = {};
  function glowSprite(rgb) {
    if (glowSprites[rgb]) return glowSprites[rgb];
    const cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    const g = cv.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, `rgba(${rgb},1)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return (glowSprites[rgb] = cv);
  }

  function glow(x, y, r, rgb, a) {
    const prev = ctx.globalAlpha; // 달 페이드처럼 바깥에서 정한 투명도는 유지
    ctx.globalAlpha = prev * a;
    ctx.drawImage(glowSprite(rgb), x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = prev;
  }

  // 달: 초승달 → 상현 → 보름달 → 하현 → 그믐달 순으로 천천히 변하고,
  // 삭(새달) 부근에서는 부드럽게 사라졌다가 다시 나타남
  const MOON_CYCLE = 60; // 한 주기(초)
  const craters = [[-0.3, -0.25, 0.18], [0.25, 0.1, 0.22], [-0.1, 0.4, 0.13], [0.35, -0.35, 0.1], [-0.45, 0.15, 0.09]];

  function drawMoon() {
    const phase = (clock / MOON_CYCLE + 0.1) % 1;          // 0 = 삭, 0.5 = 보름
    const lit = (1 - Math.cos(phase * Math.PI * 2)) / 2;     // 밝은 면적 비율
    const fade = Math.min(1, Math.min(phase, 1 - phase) / 0.06); // 삭 부근 페이드
    const alpha = fade * fade * (3 - 2 * fade);
    if (alpha <= 0) return;
    const r = 34;
    const x = W * 0.66, y = groundY * 0.24 + Math.sin(clock * 0.3) * 4;

    ctx.save();
    ctx.globalAlpha = alpha;
    glow(x, y, r * (2.2 + lit * 1.8), '226,232,240', 0.08 + lit * 0.14);
    ctx.translate(x, y);
    // 어두운 면 (지구조)
    ctx.fillStyle = 'rgba(148,163,184,0.10)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // 밝은 면: 반원 + 명암 경계(타원)로 위상 표현. 차는 달은 오른쪽, 기우는 달은 왼쪽이 밝음
    if (phase > 0.5) ctx.scale(-1, 1);
    const k = Math.cos(phase * Math.PI * 2);
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.ellipse(0, 0, r * Math.abs(k), r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
    ctx.closePath();
    const surface = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
    surface.addColorStop(0, '#fffbeb');
    surface.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = surface;
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = 'rgba(148,163,184,0.28)';
    for (const [cx, cy, cr] of craters) {
      ctx.beginPath(); ctx.arc(cx * r * (phase > 0.5 ? -1 : 1), cy * r, cr * r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 빌딩 높이는 도로 높이(groundY) 대비 비율. 시작 화면 문구를 가리지 않는 범위로 제한
  function makeSkyline(seed, minW, maxW, minH, maxH) {
    let v = seed;
    const r = () => (v = (v * 16807) % 2147483647) / 2147483647;
    const list = [];
    let x = 0;
    while (x < 3000) {
      const w = minW + r() * (maxW - minW);
      list.push({ x, w, h: minH + r() * (maxH - minH), step: r() < 0.3 ? 0.3 + r() * 0.3 : 0 });
      x += w + r() * 10;
    }
    return { list, total: x };
  }
  const cityFar = makeSkyline(11, 50, 110, 0.08, 0.2);
  const cityNear = makeSkyline(23, 60, 130, 0.1, 0.28);

  function drawSkyline(row, parallax, color) {
    ctx.fillStyle = color;
    const shift = (distance * parallax) % row.total;
    for (let base = -shift; base < W; base += row.total) {
      for (const b of row.list) {
        const x = base + b.x;
        if (x > W || x + b.w < 0) continue;
        const h = groundY * b.h;
        ctx.fillRect(x, groundY - h, b.w, h);
        // 일부 빌딩은 계단식 옥상
        if (b.step) ctx.fillRect(x + b.w * 0.25, groundY - h - groundY * 0.03, b.w * b.step, groundY * 0.03);
      }
    }
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, '#01030a');
    sky.addColorStop(1, '#0b1324');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, groundY);

    ctx.fillStyle = 'rgba(226,232,240,0.6)';
    for (const s of stars) ctx.fillRect(s.x * W, s.y * groundY, s.r, s.r);

    drawMoon();

    // 검정 빌딩 실루엣 (창문·조명 없음, 하늘보다 살짝 어두운 2단)
    drawSkyline(cityFar, 0.1, '#070b16');
    drawSkyline(cityNear, 0.25, '#03050b');

    // 원경 가로등: 눈부시지 않게 작고 희미한 주황 전구만 (빛기둥·노면 빛 없음)
    for (const x of repeatX(560, 0.15, 0)) {
      const top = groundY - 120;
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 1.5, top, 3, 120);
      glow(x, top, 18, '253,186,116', 0.08);
      ctx.fillStyle = 'rgba(253,230,138,0.3)';
      ctx.beginPath(); ctx.arc(x, top, 2, 0, Math.PI * 2); ctx.fill();
    }

    // 전신주 + 전선
    const poles = repeatX(320, 0.6, 100);
    ctx.strokeStyle = 'rgba(100,116,139,0.35)';
    ctx.lineWidth = 1;
    for (let i = 0; i < poles.length - 1; i++) {
      const a = poles[i], b = poles[i + 1];
      for (const dy of [0, 8]) {
        ctx.beginPath();
        ctx.moveTo(a, groundY - 150 + dy);
        ctx.quadraticCurveTo((a + b) / 2, groundY - 130 + dy, b, groundY - 150 + dy);
        ctx.stroke();
      }
    }
    for (const x of poles) {
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(x - 2, groundY - 155, 4, 155);
      ctx.fillRect(x - 14, groundY - 150, 28, 3);
    }

    // 지면 안개
    const haze = ctx.createLinearGradient(0, groundY - 40, 0, groundY);
    haze.addColorStop(0, 'rgba(148,163,184,0)');
    haze.addColorStop(1, 'rgba(148,163,184,0.12)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, groundY - 40, W, 40);

    // 도로
    ctx.fillStyle = '#0c0f16';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#334155';
    const dash = distance % 60;
    for (let x = -dash; x < W; x += 60) ctx.fillRect(x, groundY + 22, 30, 3);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, groundY, W, 2);
  }

  // ---------- 로드스터 의사 3D 모델 ----------
  // 사각면(quad) 메시를 진행 축(x) 기준으로 회전 → 뒷면 제거 + 깊이 정렬 + 조명
  // → 회전 각도별 프레임 이미지로 미리 렌더링해서 공중에서는 이미지만 교체

  // 2세대 로드스터 지붕선: 덕테일 → 패스트백 루프 → 윈드실드 → 긴 보닛
  const PROFILE = [
    [-51, 19], [-49, 23.5], [-45, 25], [-38, 25.6], [-32, 27], [-26, 30], [-20, 33],
    [-12, 34.6], [-4, 35], [4, 34.6], [10, 33.2], [15, 31], [19, 28], [22, 25],
    [28, 24], [34, 23], [40, 22], [46, 20], [50, 16.5], [52.5, 13], [53, 10],
  ];
  const BODY_BOTTOM = 8;
  const SHOULDER = 23.5; // 이 높이 위는 폭이 좁은 캐빈
  const HALF_WIDTH = 17;  // 하부 차체 반폭
  const CABIN_WIDTH = 13; // 캐빈 하단 반폭
  const ROOF_WIDTH = 10;  // 지붕 반폭
  const AXIS_Y = 20;      // 회전축 높이
  const ROLL_FRAMES = 48;
  const SPRITE_W = 150, SPRITE_H = 120; // 차량 단위 기준 스프라이트 크기
  const YELLOW = '#fbbf24', GLASS = '#1e293b', DARK = '#111827', BODY = '#f1f5f9';

  // 카카오 T 택시 랩핑: 흰 차체 + 뒤쪽 사선 노란 스트라이프 2줄
  // 스트라이프는 위로 갈수록 차 뒤쪽으로 기울어짐 (u = x + 1.1 * (y - 8))
  function wrapColor(x, y) {
    const u = x + 1.1 * (y - BODY_BOTTOM);
    return (u > -24 && u < -16) || (u > -10 && u < -2) ? YELLOW : BODY;
  }
  const TAXI = { color: wrapColor, taxi: true };
  // 라이벌: 같은 차체에 민트 단색 랩핑 (택시 스트라이프·도어 데칼·루프 표시등 없음)
  const RIVAL_MINT = { color: () => '#6ee7b7', taxi: false };
  // 아이템전 하늘색 라이벌: 뛰지 않고 도로로 달려오는 차 (일반 차량처럼 뛰어넘어야 함)
  const RIVAL_SKY = { color: () => '#7dd3fc', taxi: false };

  function topAt(x) {
    for (let i = 1; i < PROFILE.length; i++) {
      const [x1, y1] = PROFILE[i];
      if (x <= x1) {
        const [x0, y0] = PROFILE[i - 1];
        return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
      }
    }
    return PROFILE[PROFILE.length - 1][1];
  }

  // hint: 바깥 방향 힌트 [y, z] → 법선 방향 보정용
  function quad(list, pts, color, hint, extra) {
    const [a, b, , d] = pts;
    const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
    const v = [d[0] - a[0], d[1] - a[1], d[2] - a[2]];
    let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const len = Math.hypot(...n) || 1;
    n = n.map((k) => k / len);
    if (n[1] * hint[0] + n[2] * hint[1] < 0) n = n.map((k) => -k);
    list.push({ pts, color, n, ...extra });
  }

  function buildMesh(livery) {
    const wrapColor = livery.color;
    const q = [];
    const xs = [];
    for (let x = -51; x < 53; x += 3) xs.push(x);
    xs.push(53);

    for (let i = 0; i < xs.length - 1; i++) {
      const x0 = xs[i], x1 = xs[i + 1];
      const xm = (x0 + x1) / 2;
      const t0 = topAt(x0), t1 = topAt(x1);
      const l0 = Math.min(t0, SHOULDER), l1 = Math.min(t1, SHOULDER);
      const cabin = t0 > SHOULDER || t1 > SHOULDER;
      const hasWindow = x0 >= -31 && x1 <= 21;

      for (const side of [1, -1]) {
        const z = HALF_WIDTH * side;
        // 하부 옆면: 로커 패널 + 랩핑 색을 2단위 높이 칸으로 나눠 사선 스트라이프 표현
        quad(q, [[x0, BODY_BOTTOM, z], [x1, BODY_BOTTOM, z], [x1, 9.5, z], [x0, 9.5, z]], '#334155', [0, side]);
        for (let ya = 9.5; ya < Math.max(l0, l1); ya += 2) {
          const yb0 = Math.min(ya + 2, l0), yb1 = Math.min(ya + 2, l1);
          if (yb0 <= ya && yb1 <= ya) continue;
          quad(q, [[x0, ya, z], [x1, ya, z], [x1, Math.max(ya, yb1), z], [x0, Math.max(ya, yb0), z]],
            wrapColor(xm, ya + 1), [0, side]);
        }
        if (cabin) {
          // 어깨선 → 안쪽으로 좁아지는 캐빈 옆면(유리)
          quad(q, [[x0, l0, z], [x1, l1, z], [x1, l1, CABIN_WIDTH * side], [x0, l0, CABIN_WIDTH * side]],
            wrapColor(xm, SHOULDER), [1, 0]);
          quad(q, [[x0, l0, CABIN_WIDTH * side], [x1, l1, CABIN_WIDTH * side], [x1, t1, ROOF_WIDTH * side], [x0, t0, ROOF_WIDTH * side]],
            hasWindow ? GLASS : wrapColor(xm, (l0 + t0) / 2), [0.3, side]);
        }
      }

      if (cabin) {
        // 지붕: 앞유리·뒷유리는 유리색, 가운데는 차체색
        const glassTop = x0 >= 7 || x1 <= -23;
        quad(q, [[x0, t0, ROOF_WIDTH], [x1, t1, ROOF_WIDTH], [x1, t1, -ROOF_WIDTH], [x0, t0, -ROOF_WIDTH]],
          glassTop && hasWindow ? GLASS : wrapColor(xm, t0), [1, 0]);
      } else {
        // 보닛
        quad(q, [[x0, t0, HALF_WIDTH], [x1, t1, HALF_WIDTH], [x1, t1, -HALF_WIDTH], [x0, t0, -HALF_WIDTH]], wrapColor(xm, t0), [1, 0]);
      }
      // 바닥
      quad(q, [[x0, BODY_BOTTOM, HALF_WIDTH], [x1, BODY_BOTTOM, HALF_WIDTH], [x1, BODY_BOTTOM, -HALF_WIDTH], [x0, BODY_BOTTOM, -HALF_WIDTH]], '#0b0f19', [-1, 0]);
    }

    for (const side of [1, -1]) {
      const z = (HALF_WIDTH + 0.3) * side;
      // 슬림 헤드램프 / 일자 테일램프 (옆면보다 살짝 바깥)
      quad(q, [[43, 18, z], [50, 16.5, z], [50, 18, z], [43, 19.5, z]], '#e0f2fe', [0, side], { emissive: true });
      quad(q, [[-51, 19.5, z], [-47, 19.5, z], [-47, 22, z], [-51, 21.5, z]], '#ef4444', [0, side], { emissive: true });
      if (!livery.taxi) continue;
      // 도어 데칼: 캐릭터 얼굴 + '카카오 T' 로고 (면보다 살짝 바깥, 그리기 전용)
      const dz = (HALF_WIDTH + 0.4) * side;
      quad(q, [[-16, 12, dz], [-8, 12, dz], [-8, 20, dz], [-16, 20, dz]], BODY, [0, side], { decal: 'face', side });
      quad(q, [[2, 13, dz], [22, 13, dz], [22, 19, dz], [2, 19, dz]], BODY, [0, side], { decal: 'logo', side });
      // 루프 kakao T 표시등 옆면
      quad(q, [[-10, 35, 5 * side], [6, 35, 5 * side], [6, 40, 5 * side], [-10, 40, 5 * side]], YELLOW, [0, side], { decal: 'sign', side, emissive: true });
    }
    if (livery.taxi) quad(q, [[-10, 40, 5], [6, 40, 5], [6, 40, -5], [-10, 40, -5]], YELLOW, [1, 0], { emissive: true });
    return q;
  }

  const MESH = buildMesh(TAXI);
  const RIVAL_MESH = buildMesh(RIVAL_MINT);
  const SKY_MESH = buildMesh(RIVAL_SKY);
  const WHEELS = [];
  for (const x of [-32, 33]) for (const side of [1, -1]) WHEELS.push({ x, z: (HALF_WIDTH + 0.6) * side });

  function rotY(y, z, c, s) { return (y - AXIS_Y) * c - z * s; }
  function rotZ(y, z, c, s) { return (y - AXIS_Y) * s + z * c; }

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }

  function drawWheel3D(g, w, c, s, rot) {
    const cx = w.x, cy = -rotY(9, w.z, c, s);
    const ac = Math.abs(c), as = Math.abs(s);
    const R = 10;
    // 바퀴 옆면은 cos 만큼 납작, 타이어 트레드 폭은 sin 만큼 보임
    g.fillStyle = '#05070c';
    g.beginPath();
    g.ellipse(cx, cy, R, R * ac + 4 * as, 0, 0, Math.PI * 2);
    g.fill();
    if (ac > 0.25) {
      g.fillStyle = '#9ca3af';
      g.beginPath();
      g.ellipse(cx, cy, R * 0.6, R * 0.6 * ac, 0, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = '#374151';
      g.lineWidth = 1.4;
      for (let k = 0; k < 5; k++) {
        const a = rot + k * Math.PI * 0.4;
        g.beginPath();
        g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(a) * R * 0.6, cy + Math.sin(a) * R * 0.6 * ac);
        g.stroke();
      }
    }
  }

  // 옆면 데칼을 면의 기울기대로 투영 (side: 가까운 면 1 / 먼 면 -1 → 글자 좌우 방향)
  function drawDecal(g, face, pts, c, k) {
    const cx = (pts[0][0] + pts[2][0]) / 2, cy = (pts[0][1] + pts[2][1]) / 2;
    g.save();
    g.transform(face.side, 0, 0, c, cx, cy);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (face.decal === 'sign') {
      g.fillStyle = DARK;
      g.font = 'bold 3.4px system-ui, sans-serif';
      g.fillText('kakao T', 0, 0.2);
    } else if (face.decal === 'logo') {
      g.fillStyle = shade(DARK, 1);
      g.font = 'bold 4.6px system-ui, sans-serif';
      g.fillText('카카오 T', 0, 0.3);
    } else {
      // 동그란 곰 캐릭터 얼굴 (귀 + 눈 + 주둥이)
      const fur = shade('#f59e0b', k), dark = '#3f2a14';
      g.fillStyle = fur;
      for (const ex of [-2.6, 2.6]) { g.beginPath(); g.arc(ex, -2.8, 1.4, 0, Math.PI * 2); g.fill(); }
      g.beginPath(); g.arc(0, 0, 3.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = dark;
      for (const ex of [-1.3, 1.3]) { g.beginPath(); g.arc(ex, -0.6, 0.45, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = shade('#fde68a', k);
      g.beginPath(); g.ellipse(0, 1.2, 1.5, 1, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = dark;
      g.beginPath(); g.arc(0, 0.8, 0.45, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  // roll 각도의 로드스터를 원점(회전축) 기준으로 그림
  function renderRoadster(g, roll, wheelRot, mesh = MESH) {
    const c = Math.cos(roll), s = Math.sin(roll);
    const items = [];
    for (const f of mesh) {
      const nz = f.n[1] * s + f.n[2] * c;
      if (nz <= 0.01) continue; // 뒷면 제거
      const ny = f.n[1] * c - f.n[2] * s;
      let depth = 0;
      const pts = f.pts.map(([x, y, z]) => {
        depth += rotZ(y, z, c, s);
        return [x, -rotY(y, z, c, s)];
      });
      items.push({ depth: depth / 4, face: f, pts, ny, nz });
    }
    for (const w of WHEELS) items.push({ depth: rotZ(9, w.z, c, s), wheel: w });
    items.sort((a, b) => a.depth - b.depth);

    for (const it of items) {
      if (it.wheel) { drawWheel3D(g, it.wheel, c, s, wheelRot); continue; }
      const { face, pts, ny, nz } = it;
      // 위쪽 투광등 + 정면 반사광 조명
      const k = face.emissive ? 1 : Math.min(1.15, 0.42 + 0.38 * Math.max(0, ny) + 0.32 * nz);
      // 도어 데칼은 바탕 없이 그림만 얹음 (아래 스트라이프가 비치도록)
      if (face.decal && face.decal !== 'sign') {
        if (nz > 0.3) drawDecal(g, face, pts, c, k);
        continue;
      }
      g.fillStyle = shade(face.color, k);
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < 4; i++) g.lineTo(pts[i][0], pts[i][1]);
      g.closePath();
      g.fill();
      g.strokeStyle = g.fillStyle; // 면 사이 틈 제거
      g.lineWidth = 0.6;
      g.stroke();
      if (face.decal && nz > 0.3) drawDecal(g, face, pts, c, k);
    }
  }

  // 회전 프레임 스프라이트 미리 생성 (공중 배럴롤) + 지면 주행용 바퀴 회전 프레임
  // 바퀴 스포크가 5개라 72°마다 같은 모양 → 한 주기를 GROUND_FRAMES장으로 나눠 둠 (6° 간격)
  const GROUND_FRAMES = 12;
  const SPOKE_PERIOD = Math.PI * 0.4;
  let rollSprites = [], groundSprites = [];
  function buildSprites() {
    const dpr = window.devicePixelRatio || 1;
    const k = CAR_SCALE * dpr;
    const sprite = (roll, wheel) => {
      const cv = document.createElement('canvas');
      cv.width = SPRITE_W * k;
      cv.height = SPRITE_H * k;
      const g = cv.getContext('2d');
      g.setTransform(k, 0, 0, k, cv.width / 2, cv.height / 2);
      renderRoadster(g, roll, wheel);
      return cv;
    };
    rollSprites = [];
    for (let i = 0; i < ROLL_FRAMES; i++) rollSprites.push(sprite((i / ROLL_FRAMES) * Math.PI * 2, 0));
    groundSprites = [];
    for (let i = 0; i < GROUND_FRAMES; i++) groundSprites.push(sprite(0, (i / GROUND_FRAMES) * SPOKE_PERIOD));
  }

  // 차체 모서리의 추진 분사구: 영상처럼 X자로 뻗어 회전을 일으키는 파란 분사
  const THRUSTERS = [
    { x: -44, y: BODY_BOTTOM + 1, z: HALF_WIDTH, dy: -0.7, dz: 0.7 },
    { x: -44, y: SHOULDER, z: -HALF_WIDTH, dy: 0.7, dz: -0.7 },
    { x: 40, y: BODY_BOTTOM + 1, z: -HALF_WIDTH, dy: -0.7, dz: -0.7 },
    { x: 40, y: SHOULDER - 1, z: HALF_WIDTH, dy: 0.7, dz: 0.7 },
  ];

  function drawJet(x0, y0, dx, dy, len, width) {
    const x1 = x0 + dx * len, y1 = y0 + dy * len;
    const nx = -dy, ny = dx;
    const grad = ctx.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, 'rgba(240,249,255,0.95)');
    grad.addColorStop(0.25, 'rgba(125,211,252,0.8)');
    grad.addColorStop(1, 'rgba(59,130,246,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x0 + nx * width * 0.5, y0 + ny * width * 0.5);
    ctx.quadraticCurveTo(x0 + dx * len * 0.5 + nx * width, y0 + dy * len * 0.5 + ny * width, x1, y1);
    ctx.quadraticCurveTo(x0 + dx * len * 0.5 - nx * width, y0 + dy * len * 0.5 - ny * width, x0 - nx * width * 0.5, y0 - ny * width * 0.5);
    ctx.fill();
  }

  // 현재 roll 기준 분사 화염을 그림 (front=true면 차체 앞쪽에 있는 분사만)
  function drawThrusters(roll, intensity, front) {
    const c = Math.cos(roll), s = Math.sin(roll);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const t of THRUSTERS) {
      const depth = rotZ(t.y, t.z, c, s);
      if ((depth > 0) !== front) continue;
      const px = t.x, py = -rotY(t.y, t.z, c, s);
      // 분사 방향(화면): 회전된 방향의 세로 성분 + 진행 반대쪽으로 흩날림
      const sy = -(t.dy * c - t.dz * s);
      let dx = -0.55, dy = sy;
      const m = Math.hypot(dx, dy);
      dx /= m; dy /= m;
      const len = (22 + Math.random() * 10) * (0.45 + 0.55 * Math.abs(sy)) * intensity;
      drawJet(px, py, dx, dy, len, 3.2);
      glow(px, py, 6, '186,230,253', 0.6 * intensity);
    }
    if (front) {
      // 후방 메인 분사
      drawJet(-51, -rotY(16, 0, c, s), -1, 0, (16 + Math.random() * 8) * intensity, 3);
    }
    ctx.restore();
  }

  // 천장 매달리기 특수효과 (그립이 줄면 빨갛게 깜빡여 경고)
  // back: 차 뒤 — 뒤로 흐르는 속도선 + 차체 아래 네온 언더글로우
  // front: 차 앞 — 바퀴와 천장 사이 자석 빛·전기 아크 + 연타 순간 퍼지는 빛
  function drawCeilingFx(x, grip, front) {
    const ceil = groundY - TUNNEL_CEIL;
    const warn = grip < 0.4;
    const rgb = warn ? '248,113,113' : '125,211,252';
    const flick = warn ? 0.55 + 0.45 * Math.sin(clock * 40) : 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (!front) {
      for (let i = 0; i < 5; i++) {
        const y = ceil + 12 + i * 11;
        const len = 110 + ((clock * 700 + i * 53) % 90);
        const end = x - 70 * CAR_SCALE + i * 6;
        const tail = ctx.createLinearGradient(end - len, 0, end, 0);
        tail.addColorStop(0, `rgba(${rgb},0)`);
        tail.addColorStop(1, `rgba(${rgb},0.6)`);
        ctx.fillStyle = tail;
        ctx.fillRect(end - len, y, len, 2);
      }
      ctx.save();
      ctx.translate(x, groundY - CEIL_Y + 4);
      ctx.scale(1, 0.25);
      glow(0, 0, 60 * CAR_SCALE, warn ? '248,113,113' : '244,114,182', 0.35 * flick);
      ctx.restore();
    } else {
      const tap = Math.max(0, 1 - (clock - player.lastTap) / 0.15);
      ctx.strokeStyle = `rgba(${rgb},${0.9 * flick})`;
      ctx.lineWidth = 1.5;
      for (const wx of [-32, 33]) {
        const px = x + wx * CAR_SCALE;
        glow(px, ceil + 2, 28 + 18 * tap, rgb, (0.35 + 0.4 * grip) * flick);
        for (let k = 0; k < 2; k++) {
          ctx.beginPath();
          ctx.moveTo(px + (Math.random() - 0.5) * 30, ceil);
          for (let seg = 1; seg <= 4; seg++) ctx.lineTo(px + (Math.random() - 0.5) * 26, ceil + seg * 6);
          ctx.stroke();
        }
      }
      if (tap > 0) glow(x, ceil + 20, 90 * tap + 20, '255,255,255', 0.3 * tap);
    }
    ctx.restore();
  }

  function drawRoadster() {
    const { x, y, roll, wheel: rot } = player;
    const cy = groundY - y - AXIS_Y * CAR_SCALE;

    if (y < 70) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.ellipse(x, groundY + 1, 52 * CAR_SCALE * (1 - y / 90), 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (player.mode) {
      // 피버: 뒤집힌 채 매달리기·배럴롤 착지 (바퀴 회전을 위해 실시간 렌더)
      const hanging = player.mode === 'ceiling';
      const grip = Math.max(0, 1 - (clock - player.lastTap) / GRIP_TIME);
      if (hanging) drawCeilingFx(x, grip, false);
      const jets = hanging ? 0.55 + 0.25 * Math.random() : player.mode === 'toCeiling' || player.mode === 'exitRoll' ? 1 : 0;
      ctx.save();
      ctx.translate(x, cy);
      ctx.scale(CAR_SCALE, CAR_SCALE);
      if (jets) drawThrusters(roll, jets, false);
      renderRoadster(ctx, roll, rot);
      if (jets) drawThrusters(roll, jets, true);
      ctx.restore();
      if (hanging) drawCeilingFx(x, grip, true);
      return;
    }

    if (player.onGround) {
      // 바닥에 번지는 붉은 테일램프 빛
      const tail = x - 51 * CAR_SCALE;
      const trail = ctx.createLinearGradient(tail - 120, 0, tail, 0);
      trail.addColorStop(0, 'rgba(239,68,68,0)');
      trail.addColorStop(1, 'rgba(239,68,68,0.45)');
      ctx.fillStyle = trail;
      ctx.fillRect(tail - 120, groundY - 4, 120, 8);
      glow(tail, groundY - 20 * CAR_SCALE, 22, '239,68,68', 0.5);

      // 지면 주행: 바퀴 회전 각도에 맞는 미리 그린 프레임
      const phase = ((rot % SPOKE_PERIOD) + SPOKE_PERIOD) % SPOKE_PERIOD;
      const frame = Math.round((phase / SPOKE_PERIOD) * GROUND_FRAMES) % GROUND_FRAMES;
      ctx.drawImage(groundSprites[frame], x - (SPRITE_W / 2) * CAR_SCALE, cy - (SPRITE_H / 2) * CAR_SCALE, SPRITE_W * CAR_SCALE, SPRITE_H * CAR_SCALE);
      return;
    }

    // 공중: 회전 각도에 맞는 프레임 이미지로 교체 + 분사 화염
    const p = Math.min(1, player.airTime / airDuration());
    const intensity = p > 0.85 ? (1 - p) / 0.15 : Math.min(1, p / 0.08 + 0.3);
    const pitch = -Math.atan2(player.vy, speed) * 0.35;
    const frame = Math.round((roll / (Math.PI * 2)) * ROLL_FRAMES) % ROLL_FRAMES;

    ctx.save();
    ctx.translate(x, cy);
    ctx.rotate(pitch);
    ctx.scale(CAR_SCALE, CAR_SCALE);
    drawThrusters(roll, intensity, false);
    ctx.drawImage(rollSprites[frame], -SPRITE_W / 2, -SPRITE_H / 2, SPRITE_W, SPRITE_H);
    drawThrusters(roll, intensity, true);
    ctx.restore();
  }

  // ---------- 라이벌 차량 (우리 차와 같은 모델, 왼쪽을 향해 달려옴) ----------
  // 판정용 크기: 차체 길이 약 106, 바퀴 아래~지붕 약 36 (모델 단위) × CAR_SCALE
  const RIVAL = { name: 'rival', w: Math.round(106 * CAR_SCALE), h: Math.round(36 * CAR_SCALE), hitTop: 0.25, points: 3 }; // 통과 시 '안전운전' 보너스 3점
  const SKY_RIVAL = { ...RIVAL, name: 'sky', points: 1 };

  function updateRival(o, dt) {
    o.wheel += speed * dt / 14;
    if (o.landed) return;
    if (o.t < 0) {
      if (o.x > o.jumpAt) return;
      // 터널 안에서는 천장 때문에 뛰지 않고 바닥에 붙어 그대로 지나감
      if (tunnel && o.x < tunnel.x + tunnel.len && o.x + o.w > tunnel.x) {
        o.landed = true;
        return;
      }
      o.t = 0; // 이륙
      smoke(o.x + o.w / 2, groundY - 4, 10, o.w * 0.6);
    }
    o.t += dt;
    const p = Math.min(1, o.t / ROLL_TIME);
    o.p = p;
    o.x = o.jumpAt + (o.land - o.jumpAt) * p;
    // 포물선 궤적 + 플레이어 배럴롤과 같은 이징(천천히 → 정점 부근 빠르게 → 착지 전 천천히) + 기수 들림
    o.hop = 4 * o.peak * p * (1 - p);
    o.roll = Math.PI * 2 * (p - Math.sin(2 * Math.PI * p) / (2 * Math.PI));
    o.pitch = Math.atan2(4 * o.peak * (1 - 2 * p) / ROLL_TIME, speed) * 0.35;
    if (p >= 1) {
      o.landed = true;
      o.hop = 0;
      o.roll = 0;
      o.pitch = 0;
      smoke(o.x + o.w / 2, groundY - 4, 18, o.w);
    }
  }

  function drawRival(o) {
    const cx = o.x + o.w / 2;
    const cy = groundY - o.hop - AXIS_Y * CAR_SCALE;
    const k = 1 - o.hop / (o.peak * 2);
    ctx.fillStyle = `rgba(0,0,0,${0.45 * k})`;
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 1, o.w * 0.48 * k, 5 * k, 0, 0, Math.PI * 2);
    ctx.fill();
    const flying = o.t >= 0 && !o.landed;
    const intensity = flying ? (o.p > 0.85 ? (1 - o.p) / 0.15 : Math.min(1, o.p / 0.08 + 0.3)) : 0;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(o.pitch); // 왼쪽을 향하므로 시계 방향 회전이 기수 들림
    ctx.scale(-CAR_SCALE, CAR_SCALE); // 좌우 반전: 플레이어 쪽(왼쪽)을 향함
    if (flying) drawThrusters(o.roll, intensity, false);
    renderRoadster(ctx, o.roll, o.wheel, o.sky ? SKY_MESH : RIVAL_MESH);
    if (flying) drawThrusters(o.roll, intensity, true);
    ctx.restore();
    if (!flying) glow(o.x + o.w * 0.03, groundY - o.h * 0.45, 16, '224,242,254', 0.55);
  }

  // ---------- 하이퍼루프 터널 ----------
  // 뒤(실내)는 차량보다 먼저, 천장·입출구 기둥은 차량 뒤에 그려 천장에 매달린 모습이 되게 함

  function tunnelSpan() {
    if (!tunnel) return null;
    const x1 = Math.max(-20, tunnel.x), x2 = Math.min(W + 20, tunnel.x + tunnel.len);
    return x2 > x1 ? [x1, x2] : null;
  }

  // 플레드 터널: 테슬라 Model S Plaid 발표 영상처럼 검정 바탕에
  // 세로줄은 흰색 → 검정 → 빨강 → 흰색 순서로 같은 두께로 반복, 가로줄은 얇은 흰 선 4개
  // 흰색 다음 반복의 흰색이 바로 붙는 곳에만 두께의 1/4 검정 틈을 넣어 구분
  const STRIPE_W = 24; // 세로줄 두께 (흰·검정·빨강 모두 동일)
  const PLAID = STRIPE_W * 4 + STRIPE_W / 4; // 세로줄 반복 폭
  const V_STRIPES = [ // [시작 위치, 색] — 검정 줄과 틈은 검정 바탕
    [0, 'rgba(255,255,255,0.72)'],
    [STRIPE_W * 2, 'rgba(225,18,40,0.7)'],
    [STRIPE_W * 3, 'rgba(255,255,255,0.72)'],
  ];
  // 가로 흰 선 4개: 바닥에서 터널 높이의 1/3 지점에 7px 간격으로 모아 배치 (값은 천장에서부터의 위치)
  const H_LINES = [-10.5, -3.5, 3.5, 10.5].map((d) => TUNNEL_CEIL * 2 / 3 + d);
  // 확대·축소한 패턴으로 채우면 매 프레임 다시 샘플링해 느리므로,
  // 화면 픽셀 크기에 맞춘 타일을 배율별로 한 번만 만들어 둠 (화면 크기가 바뀌면 비움)
  let plaidCache = {};

  // wall=true: 터널 안쪽 벽 전용 타일 (높이 = 터널 내부 전체). 가로 빛줄 번짐과 아래쪽 어둡게 처리를
  // 타일에 미리 넣어 두어 매 프레임 화면 전체를 덧칠하지 않게 함
  function plaid(scale, wall) {
    const px = Math.max(8, Math.round(PLAID * scale * viewScale * dpr));
    const key = wall ? `w${px}` : px;
    if (plaidCache[key]) return plaidCache[key];
    const h = wall ? TUNNEL_CEIL : PLAID;
    const cv = document.createElement('canvas');
    cv.width = px;
    cv.height = Math.round(h * px / PLAID);
    const g = cv.getContext('2d');
    g.scale(px / PLAID, px / PLAID);
    g.fillStyle = '#060608';
    g.fillRect(0, 0, PLAID, h);
    g.globalCompositeOperation = 'lighter'; // 줄이 겹치는 곳이 더 밝게 빛남
    for (const [p, c] of V_STRIPES) {
      g.fillStyle = c;
      g.fillRect(p, 0, STRIPE_W, h);
    }
    if (wall) {
      // 얇은 가로 흰 선 + 은은한 번짐
      for (const y of H_LINES) {
        g.fillStyle = 'rgba(255,255,255,0.08)';
        g.fillRect(0, y - 5, PLAID, 10);
        g.fillStyle = 'rgba(255,255,255,0.85)';
        g.fillRect(0, y - 1, PLAID, 2);
      }
      // 차량이 묻히지 않게 전체를 살짝, 아래쪽은 더 어둡게
      g.globalCompositeOperation = 'source-over';
      const shade = g.createLinearGradient(0, 0, 0, h);
      shade.addColorStop(0, 'rgba(6,6,8,0.3)');
      shade.addColorStop(0.4, 'rgba(6,6,8,0.3)');
      shade.addColorStop(1, 'rgba(6,6,8,0.55)');
      g.fillStyle = shade;
      g.fillRect(0, 0, PLAID, h);
    }
    plaidCache[key] = ctx.createPattern(cv, wall ? 'repeat-x' : 'repeat');
    return plaidCache[key];
  }

  // (ox, oy) 를 무늬 원점으로, scale 배율로 채움 → 터널과 함께 흘러감
  // 화면 픽셀 좌표(정수 위치)에서 그려 패턴이 다시 샘플링되지 않게 함
  function fillPlaid(x, y, w, h, ox, oy, scale, wall) {
    const f = viewScale * dpr;
    const dx = Math.round(ox * f), dy = Math.round(oy * f);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, dx, dy + topInset * dpr);
    ctx.fillStyle = plaid(scale, wall);
    ctx.fillRect(x * f - dx, y * f - dy, w * f, h * f);
    ctx.restore();
  }

  // 옆에서 본 플레드 터널: 정면에서 소실점으로 모이던 길이 방향 줄은 가로줄로, 사각 틀은 세로줄로 보임.
  // 가로줄을 따라 빛이 진행 방향으로 흐르고, 출구 쪽에서 빛이 쏟아져 들어오며, 광택 바닥에 터널이 비침
  const PULSES = 3;   // 가로줄을 따라 흐르는 빛 개수

  function drawTunnelBack() {
    const span = tunnelSpan();
    if (!span) return;
    const [x1, x2] = span;
    const ceil = groundY - TUNNEL_CEIL, w = x2 - x1;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x1, ceil, w, TUNNEL_CEIL);
    ctx.clip();
    // 안쪽 벽 체크 무늬 (터널과 함께 흘러감)
    fillPlaid(x1, ceil, w, TUNNEL_CEIL, tunnel.x, ceil, 1, true);
    ctx.globalCompositeOperation = 'lighter';
    const lanes = [];
    for (const y of H_LINES) lanes.push(ceil + y);
    // 가로줄을 따라 진행 방향으로 흐르는 빛 (머리가 밝은 꼬리)
    for (let i = 0; i < PULSES; i++) {
      const y = lanes[i % lanes.length];
      const head = tunnel.x + ((clock * 900 + i * 1597) % tunnel.len);
      if (head < x1 - 10 || head - 180 > x2) continue;
      const tail = ctx.createLinearGradient(head - 180, 0, head, 0);
      tail.addColorStop(0, 'rgba(255,40,70,0)');
      tail.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.fillStyle = tail;
      ctx.fillRect(head - 180, y - 2, 180, 4);
      glow(head, y, 14, '255,255,255', 0.8);
    }
    // 출구에서 쏟아지는 빛
    const exit = tunnel.x + tunnel.len;
    if (exit < x2 + 300) {
      glow(exit, ceil + TUNNEL_CEIL / 2, 260, '255,235,240', 0.35);
      glow(exit, ceil + TUNNEL_CEIL / 2, 70, '255,255,255', 0.7);
    }
    ctx.restore();

    drawTunnelReflection(x1, w);
    // 바닥 라인 (가로 흰 선 4개와 헷갈리지 않게 어둡게)
    ctx.fillStyle = 'rgba(100,116,139,0.6)';
    ctx.fillRect(x1, groundY - 2, w, 2);
  }

  // 광택 바닥: 터널 벽을 도로 위로 뒤집어 비추고 아래로 갈수록 사라지게 함
  function drawTunnelReflection(x1, w) {
    const R = Math.min(H - groundY, 90);
    if (R <= 0) return;
    const f = viewScale * dpr;
    const dx = Math.round(tunnel.x * f);
    ctx.save();
    ctx.globalAlpha = 0.35;
    // y = groundY 기준 상하 반전: 무늬 원점(천장)이 거울 위치(2 * groundY - 천장)로 감
    ctx.setTransform(1, 0, 0, -1, dx, Math.round((groundY + TUNNEL_CEIL) * f) + topInset * dpr);
    ctx.fillStyle = plaid(1, true);
    ctx.fillRect(x1 * f - dx, (TUNNEL_CEIL - R) * f, w * f, R * f);
    ctx.restore();
    const fade = ctx.createLinearGradient(0, groundY, 0, groundY + R);
    fade.addColorStop(0, 'rgba(12,15,22,0.1)');
    fade.addColorStop(1, 'rgba(12,15,22,1)');
    ctx.fillStyle = fade;
    ctx.fillRect(x1, groundY, w, R);
  }

  function drawTunnelFront() {
    const span = tunnelSpan();
    if (!span) return;
    const [x1, x2] = span;
    const top = groundY - TUNNEL_TOP, ceil = groundY - TUNNEL_CEIL;
    // 천장 레일 (바깥 튜브)
    fillPlaid(x1, top, x2 - x1, TUNNEL_TOP - TUNNEL_CEIL, tunnel.x, top, 1);
    const shell = ctx.createLinearGradient(0, top, 0, ceil);
    shell.addColorStop(0, 'rgba(6,6,8,0.45)');
    shell.addColorStop(1, 'rgba(6,6,8,0.75)');
    ctx.fillStyle = shell;
    ctx.fillRect(x1, top, x2 - x1, TUNNEL_TOP - TUNNEL_CEIL);
    ctx.fillStyle = 'rgba(100,116,139,0.8)'; // 천장 레일 (가로 흰 선과 구분되게 회색)
    ctx.fillRect(x1, ceil - 3, x2 - x1, 3);
    // 입구·출구 기둥 + 이름
    for (const [px, label] of [[tunnel.x, 'HYPERLOOP'], [tunnel.x + tunnel.len, 'EXIT']]) {
      if (px < -60 || px > W + 60) continue;
      ctx.fillStyle = '#111114';
      ctx.fillRect(px - 14, top - 14, 28, TUNNEL_TOP + 14);
      ctx.fillStyle = '#e11d48';
      ctx.fillRect(px - 14, top - 14, 28, 4);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(px - 2, top - 10, 4, TUNNEL_TOP + 10);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 16px system-ui, sans-serif';
      ctx.textAlign = label === 'EXIT' ? 'right' : 'left';
      ctx.fillText(label, px + (label === 'EXIT' ? -22 : 22), top + 26);
    }
  }

  // ---------- 장애물 차량 ----------

  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px system-ui, sans-serif';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life / 0.4);
      // 밝은 피버 터널 위에서도 읽히도록 어두운 외곽선
      ctx.strokeStyle = 'rgba(2,6,23,0.85)';
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    if (o.rival) return drawRival(o);
    const top = groundY - o.h;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w / 2, groundY + 1, o.w * 0.48, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    if (o.type.sprite) ctx.drawImage(o.type.sprite, o.x, top + 2, o.w, o.h);
    glow(o.x + o.w * 0.03, top + o.h * 0.5, 16, '224,242,254', 0.55);
    glow(o.x + o.w * 0.97, top + o.h * 0.4, 10, '239,68,68', 0.45);
  }

  function drawParticles(kind) {
    for (const p of particles) {
      if (p.kind !== kind) continue;
      if (kind === 'smoke') {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.35;
        ctx.drawImage(glowSprite(p.color), p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = Math.max(0, p.life * 1.5);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }
    }
  }

  // 시작 화면: ① 제목·슬로건(브랜드) ② 시작 유도 한 줄 ③ 도로 아래 조작 안내 카드(낮은 대비)
  function drawStartScreen(W, H) {
    const y = H * 0.3;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
    ctx.font = '800 34px system-ui, sans-serif';
    ctx.fillText('Kakao Taxi Jump', W / 2, y);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText('테슬라를 뛰어 넘어라 !', W / 2, y + 34);

    ctx.globalAlpha = 0.6 + 0.3 * Math.cos(clock * Math.PI * 2 / 1.6); // 천천히 깜빡임
    ctx.fillStyle = '#f8fafc';
    ctx.font = '15px system-ui, sans-serif';
    if (room) ctx.fillText(roomHint(), W / 2, y + 84); // 방 밖에서는 이 자리에 혼자 하기 / 같이 하기 버튼
    ctx.globalAlpha = 1;

    const rows = [
      [isTouch ? '탭' : 'Enter / Space', '점프'],
      ['길게 누르기', '더 높이, 더 멀리'],
      ['아슬아슬', '보너스 점수'],
      [isTouch ? '탭 연타' : '연타', `${FEVER_SCORE}점 이후 피버 터널 매달리기`],
    ];
    const ground = groundY * viewScale; // 화면 좌표 기준 도로 위치
    const rowH = 30, padX = 16, padY = 12, gap = 12;
    ctx.font = '600 12px system-ui, sans-serif';
    const keyW = Math.max(...rows.map((r) => ctx.measureText(r[0]).width)) + 16;
    ctx.font = '13px system-ui, sans-serif';
    const descW = Math.max(...rows.map((r) => ctx.measureText(r[1]).width));
    const cardW = padX * 2 + keyW + gap + descW;
    const cardH = padY * 2 + rowH * rows.length - 8;
    const space = H - ground;
    if (space < cardH + 24) return; // 가로로 낮은 화면에서는 생략
    const cx = (W - cardW) / 2, cy = ground + Math.min(space * 0.3, space - cardH - 12);

    roundRect(cx, cy, cardW, cardH, 14);
    ctx.fillStyle = 'rgba(15,23,42,0.6)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    rows.forEach(([key, desc], i) => {
      const ry = cy + padY + i * rowH;
      ctx.font = '600 12px system-ui, sans-serif';
      const kw = ctx.measureText(key).width + 16;
      const kx = cx + padX + keyW - kw;
      roundRect(kx, ry, kw, 22, 6);
      ctx.fillStyle = 'rgba(148,163,184,0.14)';
      ctx.fill();
      ctx.fillStyle = '#cbd5e1';
      ctx.textAlign = 'center';
      ctx.fillText(key, kx + kw / 2, ry + 15);
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'left';
      ctx.fillText(desc, cx + padX + keyW + gap, ry + 15.5);
    });
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // HUD는 축소 없이 실제 화면 크기 기준으로 그림 (세로 화면에서도 글자 크기 유지)
  function drawHUD() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, topInset * dpr);
    const W = SW, H = SH;
    // 2단 게임 오버 화면에서는 오른쪽 위를 랭킹 패널이 쓰므로 점수는 왼쪽 문구 위에 표시
    const splitOver = state === 'over' && isSplit(W, H);
    ctx.fillStyle = '#f8fafc';
    if (!splitOver) {
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`SCORE ${score}`, W - 16, 32);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText(`BEST ${best} · ROLLS ${flips || 0}`, W - 16, 54);
    }
    if (paused) {
      // 일시정지 화면: 반투명 어둡게 + 안내
      ctx.fillStyle = 'rgba(2,6,23,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.font = 'bold 32px system-ui, sans-serif';
      ctx.fillText('일시정지', W / 2, H * 0.4);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(isTouch ? '화면을 탭해서 계속' : 'Enter / Space / Esc로 계속', W / 2, H * 0.4 + 34);
      return;
    }
    if (state === 'playing' && combo > 1) {
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`COMBO x${combo}`, W - 16, 74);
      ctx.fillStyle = '#f8fafc';
    }
    if (state === 'playing' && tunnel && player.mode !== 'exitRoll' && player.x < tunnel.x + tunnel.len) drawFeverHUD(W);

    ctx.textAlign = 'center';
    if (countdownAt) return; // 카운트다운 화면은 draw() 에서 따로 그림
    if (state === 'ready') {
      // 시작 화면 좌측 상단 버전 표기
      ctx.textAlign = 'left';
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(148,163,184,0.8)';
      ctx.fillText(`v${VERSION}`, 16, 24);
      drawStartScreen(W, H);
    } else if (state === 'over') {
      const { x, y } = layoutOver(W, H);
      if (splitOver) {
        ctx.font = '14px system-ui, sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(`SCORE ${score} · BEST ${best}`, x, y - 40);
        ctx.fillStyle = '#f8fafc';
      }
      let ry = y + 32; // 다시 시작 안내 위치
      if (cleared) {
        ctx.font = 'bold 28px system-ui, sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`축하합니다! ${MAX_SCORE}점 달성!`, x, y);
        ctx.font = '16px system-ui, sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText('끝까지 플레이해 주셔서 감사합니다', x, y + 28);
        ctx.font = '14px system-ui, sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ry = y + 60;
      } else {
        ctx.font = 'bold 32px system-ui, sans-serif';
        ctx.fillText('CRASH!', x, y);
        ctx.font = '16px system-ui, sans-serif';
      }
      const rr = roomRank();
      if (rr) {
        // 같이 하기 순위: 아직 달리는 사람이 있으면 현재 순위, 모두 끝나면 최종 순위
        const font = ctx.font, color = ctx.fillStyle;
        ctx.font = 'bold 22px system-ui, sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(rr.alive
          ? `현재 ${rr.rank}등 / ${rr.n}명 · ${rr.alive}명 달리는 중`
          : `${rr.rank === 1 ? '🏆 ' : ''}최종 ${rr.rank}등 / ${rr.n}명`, x, ry);
        ctx.font = font;
        ctx.fillStyle = color;
        ry += 30;
      }
      // 같이 하기 방에서는 같은 안내가 방 패널에 있으므로 생략
      if (!room) ctx.fillText(isTouch ? '길게 눌러서 다시 시작' : 'Enter / Space 길게 눌러 다시 시작', x, ry);
      // 길게 누르는 동안 진행 막대
      if (restartHold !== null) {
        const t = Math.min(1, (clock - restartHold) / RESTART_HOLD);
        ctx.fillStyle = 'rgba(148,163,184,0.3)';
        ctx.fillRect(x - 80, ry + 10, 160, 4);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x - 80, ry + 10, 160 * t, 4);
      }
    }
  }

  // 이번 판 방 안 순위 (같이 출발한 사람 중 점수 순, 같은 점수는 같은 등수)
  function roomRank() {
    if (!room) return null;
    // 대기 중인 사람과, 달리는 중으로 남아 있지만 멈춘 사람(창을 닫은 유령 등)은 순위에서 뺌
    const ps = [...room.players.values()].filter((p) => p.status === 'over' || running(p));
    if (!ps.some((p) => p.id === myId)) return null;
    return {
      rank: 1 + ps.filter((p) => p.id !== myId && p.score > score).length,
      n: ps.length,
      alive: ps.filter(running).length,
    };
  }

  function roomHint() {
    return room.host === myId ? "왼쪽 위 '시작'을 누르면 다 같이 출발" : '방장이 시작하면 다 같이 출발';
  }

  // 같이 하기 카운트다운: 화면 가운데 큰 숫자
  function drawCountdown(W, H) {
    const left = Math.max(0, countdownAt - performance.now()) / 1000;
    ctx.fillStyle = 'rgba(2,6,23,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fbbf24';
    ctx.font = '800 72px system-ui, sans-serif';
    ctx.fillText(String(Math.ceil(left) || 1), W / 2, H * 0.45);
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText('다 같이 출발 준비!', W / 2, H * 0.45 + 36);
  }

  // 피버 안내: 상단 점수 표시와 겹치지 않게 그 아래 가운데에 표시
  function drawFeverHUD(W) {
    const y = 108;
    const mash = isTouch ? '탭 연타' : 'Enter / Space 연타';
    ctx.textAlign = 'center';
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.fillStyle = `rgba(244,114,182,${0.75 + 0.25 * Math.sin(clock * 10)})`;
    ctx.fillText('FEVER TIME', W / 2, y);
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    const m = player.mode;
    if (m === 'ceiling' || m === 'toCeiling') {
      ctx.fillText(`${mash}! 멈추면 추락`, W / 2, y + 24);
      const grip = Math.max(0, 1 - (clock - player.lastTap) / GRIP_TIME);
      ctx.fillStyle = 'rgba(148,163,184,0.3)';
      ctx.fillRect(W / 2 - 80, y + 34, 160, 6);
      ctx.fillStyle = grip > 0.4 ? '#67e8f9' : '#ef4444';
      ctx.fillRect(W / 2 - 80, y + 34, 160 * grip, 6);
    } else if (m === 'falling') {
      ctx.fillStyle = '#ef4444';
      ctx.fillText('추락!', W / 2, y + 24);
    } else if (player.x >= tunnel.x) {
      ctx.fillText(`${mash}해서 천장에 매달리기!`, W / 2, y + 24);
    } else {
      ctx.fillText(`하이퍼루프 진입! 터널에서 ${mash}`, W / 2, y + 24);
    }
  }

  // 게임 오버 문구(캔버스)와 랭킹 패널(HTML)이 겹치지 않게 배치하고 문구 위치 {x, y} 를 돌려줌
  // - 기본: 문구 아래(y + 58)에 패널. 화면이 낮으면 문구를 올리고 패널은 스크롤
  // - 낮은 가로 화면: 2단. 왼쪽에 문구 + 이름 입력, 오른쪽에 랭킹 목록
  // - 같이 하기 방 패널(왼쪽 위)이 있으면 그 아래(기본) 또는 그 오른쪽(2단)에 배치
  let overLayoutKey = '';
  function isSplit(W, H) {
    return W > H && H < 560;
  }

  function layoutOver(W, H) {
    const split = isSplit(W, H);
    const extra = (cleared ? 28 : 0) + (room ? 30 : 0); // 만점 축하 문구·같이 하기 순위로 늘어난 높이
    let x = W / 2, y;
    let key;
    const roomBox = roomEl.hidden ? null : roomEl.getBoundingClientRect();
    let sideW = ''; // 비우면 CSS 기본 폭
    if (split) {
      x = Math.round(W * 0.27);
      y = Math.round(Math.max(72, H * 0.3));
      let rankMaxH = H - 24, squeezed = false;
      if (roomBox) {
        const left = roomBox.right + 12, right = W - 16 - Math.min(320, W * 0.46);
        if (right - left >= 320) {
          x = Math.round(Math.max(x, (left + right) / 2));
          sideW = `${Math.round(Math.min(300, right - left - 8))}px`;
        } else if (roomBox.bottom - topInset + 40 + extra + 30 <= H) {
          // 방 패널과 랭킹 패널 사이가 좁으면 문구를 두 패널 아래 가운데에 두고 랭킹 패널 높이를 그 위로 제한
          x = Math.round(W / 2);
          y = Math.round(roomBox.bottom - topInset + 40);
          rankMaxH = Math.max(60, y - 52 - 12);
        } else {
          // 아래에도 자리가 없는 아주 작은 가로 화면: 전체 랭킹 패널은 숨기고 문구를 방 패널 오른쪽 가운데에
          squeezed = true;
          x = Math.round((left + W - 16) / 2);
        }
      }
      key = `s${x},${y},${H},${rankEl.hidden},${extra},${sideW},${topInset},${rankMaxH},${squeezed}`;
      if (key !== overLayoutKey) {
        rankEl.classList.add('split');
        rankEl.classList.toggle('squeezed', squeezed);
        if (rankForm.parentNode !== rankSide) rankSide.append(rankForm);
        rankEl.style.top = `${topInset + 12}px`;
        rankEl.style.maxHeight = `${rankMaxH}px`;
        rankSide.style.left = `${x}px`;
        rankSide.style.width = sideW;
        rankSide.style.top = `${topInset + y + 58 + extra}px`;
        rankSide.hidden = rankEl.hidden;
      }
    } else {
      const panelH = rankEl.hidden ? 0 : rankEl.scrollHeight;
      y = Math.round(Math.max(roomBox ? roomBox.bottom - topInset + 40 : 48, Math.min(H * 0.3, H - panelH - 70 - extra)));
      key = `n${y},${H},${rankEl.hidden},${extra},${topInset}`;
      if (key !== overLayoutKey) {
        rankEl.classList.remove('split', 'squeezed');
        if (rankForm.parentNode !== rankEl) rankEl.prepend(rankForm);
        rankSide.hidden = true;
        rankEl.style.top = `${topInset + y + 58 + extra}px`;
        rankEl.style.maxHeight = `${Math.max(120, H - y - 70 - extra)}px`;
      }
    }
    overLayoutKey = key;
    return { x, y };
  }

  function draw() {
    if (topInset) drawRivalViews();
    ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, topInset * dpr);
    drawBackground();
    drawTunnelBack();
    drawWhiteout();
    for (const o of obstacles) drawObstacle(o);
    drawParticles('smoke');
    drawRoadster();
    drawShield();
    drawTunnelFront();
    drawFog();
    drawParticles('spark');
    drawPopups();
    drawHUD();
    if (countdownAt) drawCountdown(SW, SH);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    roomTick(now);
    botsTick(now);
    syncMpButton();
    renderItems();
    renderFeed();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); buildSprites(); plaidCache = {}; overLayoutKey = ''; });
  resize();
  buildSprites();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kakao Taxi Jump</title>
<meta name="description" content="엔터 한 번으로 테슬라를 뛰어넘어라! 원버튼 점프 게임">
<meta name="theme-color" content="#020617">
<!-- 링크 공유 미리보기 (카카오톡·슬랙·페이스북 등: Open Graph / X: Twitter Card) -->
<!-- og:image·og:url 은 배포 주소 기준 절대 경로여야 썸네일이 표시됨 -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kakao Taxi Jump">
<meta property="og:description" content="엔터 한 번으로 테슬라를 뛰어넘어라! 원버튼 점프 게임">
<meta property="og:image" content="https://lapin-world.github.io/car-jump/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://lapin-world.github.io/car-jump/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kakao Taxi Jump">
<meta name="twitter:description" content="엔터 한 번으로 테슬라를 뛰어넘어라!">
<meta name="twitter:image" content="https://lapin-world.github.io/car-jump/assets/og-image.png">
<style>
  html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; } /* 실제 크기는 resize() 에서 보이는 화면(innerWidth/innerHeight)에 맞춤 */
  /* 게임 오버 시 랭킹 패널 */
  #rank {
    position: fixed; left: 50%; top: 40%; transform: translateX(-50%); overflow-y: auto; /* top·max-height 는 JS(layoutOver)에서 문구 아래로 맞춤 */
    width: min(320px, calc(100vw - 32px)); box-sizing: border-box; padding: 14px 16px;
    border: 1px solid rgba(148,197,255,0.4); border-radius: 14px;
    background: rgba(15,23,42,0.9); color: #f8fafc; font: 14px system-ui, sans-serif;
  }
  #rank[hidden], #rank.squeezed { display: none; }
  #rank-form { display: flex; gap: 8px; margin-bottom: 10px; }
  #rank-form[hidden] { display: none; } /* display:flex 가 hidden 속성을 덮어쓰지 않게 */
  #rank-form input {
    flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #475569; border-radius: 8px;
    background: #0f172a; color: #f8fafc; font: inherit; user-select: text; -webkit-user-select: text;
    font-size: 16px; /* iOS Safari는 16px 미만 입력칸에 포커스하면 화면을 자동 확대함 */
  }
  #rank-form button {
    padding: 8px 12px; border: 0; border-radius: 8px; background: #fbbf24; color: #111827; font: 600 14px system-ui, sans-serif;
  }
  #rank-form button:disabled { opacity: 0.5; }
  #rank ol { list-style: none; margin: 0; padding: 0; }
  #rank li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; }
  #rank li .no { width: 24px; text-align: center; color: #94a3b8; }
  #rank li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rank li .score { font-variant-numeric: tabular-nums; }
  /* 1~3등 강조 (금·은·동) */
  #rank li.top { margin-bottom: 4px; font-weight: 700; }
  #rank li.top .no { font-size: 18px; }
  #rank li.g1 { background: linear-gradient(90deg, rgba(251,191,36,0.35), rgba(251,191,36,0.05)); border: 1px solid rgba(251,191,36,0.7); font-size: 17px; padding: 8px; box-shadow: 0 0 12px rgba(251,191,36,0.35); }
  #rank li.g1 .score { color: #fbbf24; }
  #rank li.g2 { background: linear-gradient(90deg, rgba(203,213,225,0.28), rgba(203,213,225,0.04)); border: 1px solid rgba(203,213,225,0.6); font-size: 15px; }
  #rank li.g2 .score { color: #e2e8f0; }
  #rank li.g3 { background: linear-gradient(90deg, rgba(217,119,6,0.3), rgba(217,119,6,0.04)); border: 1px solid rgba(217,119,6,0.65); font-size: 15px; }
  #rank li.g3 .score { color: #f59e0b; }
  /* 내 기록 강조 */
  #rank li.me { outline: 2px solid #38bdf8; }
  #rank .msg { color: #94a3b8; margin: 4px 0; }
  /* 낮은 가로 화면: 2단 배치. 왼쪽(#rank-side)에 이름 입력, 오른쪽 패널에 랭킹을 촘촘하게 */
  #rank-side { position: fixed; transform: translateX(-50%); width: min(300px, 42vw); }
  #rank-side[hidden] { display: none; }
  /* 일시정지 버튼: 게임 중에만 왼쪽 위에 표시 */
  #pause-btn {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: calc(var(--top, 0px) + max(12px, env(safe-area-inset-top)));
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(148,163,184,0.4);
    background: rgba(15,23,42,0.6); color: #f8fafc; font: 600 16px system-ui, sans-serif; padding: 0;
  }
  #pause-btn[hidden] { display: none; }
  #rank.split { left: auto; right: 16px; transform: none; width: min(320px, 46vw); padding: 8px 12px; }
  #rank.split .msg { margin: 0 0 4px; font-size: 12px; }
  #rank.split li { padding: 2px 8px; font-size: 13px; }
  #rank.split li.top { margin-bottom: 3px; }
  #rank.split li.top .no { font-size: 15px; }
  #rank.split li.g1 { padding: 4px 8px; font-size: 15px; }
  #rank.split li.g2, #rank.split li.g3 { font-size: 14px; }
  /* 멀티플레이: 시작 버튼, 방 만들기·참여 창, 방 현황(실시간 점수) 패널 */
  /* 혼자 한 판이 끝난 게임 오버 화면: 왼쪽 위에 다시 혼자 하기 / 같이 하기 */
  #mp-open {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top));
    display: flex; gap: 8px;
  }
  #mp-open button {
    padding: 8px 12px; border: 1px solid rgba(251,191,36,0.6); border-radius: 10px;
    background: rgba(15,23,42,0.75); color: #fbbf24; font: 600 14px system-ui, sans-serif;
  }
  #mp-open button.solo { background: #fbbf24; color: #111827; }
  #mp-open[hidden], #mp[hidden], #room[hidden], #mode[hidden], #mp [hidden] { display: none; }
  /* 시작 화면 모드 선택: 제목 아래 (시작 화면 문구 y = 화면 높이 30% + 84 자리) */
  #mode {
    position: fixed; left: 50%; top: calc(30% + 58px); transform: translateX(-50%);
    display: flex; gap: 10px; width: min(320px, calc(100vw - 32px));
  }
  #mode button {
    flex: 1; padding: 12px 8px; border-radius: 12px; font: 700 16px system-ui, sans-serif;
    border: 1px solid rgba(251,191,36,0.7); background: rgba(15,23,42,0.8); color: #fbbf24;
  }
  #mode button.solo { background: #fbbf24; color: #111827; }
  /* 아이템전: 화면 왼쪽 아래 아이템 칸 (탭 또는 숫자키 1·2·3 으로 사용) */
  #items {
    position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center;
  }
  #items[hidden] { display: none; }
  #items button {
    position: relative; width: 56px; height: 56px; padding: 0; border-radius: 14px;
    border: 1px solid rgba(167,139,250,0.75); background: rgba(15,23,42,0.8); color: #f8fafc;
    font: 600 11px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #items button .ic { font-size: 22px; line-height: 1; }
  #items button .key { position: absolute; top: 2px; left: 5px; font-size: 10px; color: #94a3b8; }
  #items button.empty { opacity: 0.3; }
  #items .info { color: #cbd5e1; font: 600 12px system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
  #items .info .shield { display: block; color: #67e8f9; }
  #mp .mode-row button { flex: 1; }
  /* 아이템전 알림창: 채팅처럼 아래로 쌓이고 몇 초 뒤 사라짐. 가로 화면은 왼쪽 위(일시정지 버튼 아래), 세로 화면은 아이템 칸 위 */
  #feed {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: calc(var(--top, 0px) + max(64px, calc(env(safe-area-inset-top) + 52px)));
    width: min(280px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    font: 600 13px system-ui, sans-serif;
  }
  @media (orientation: portrait) {
    #feed { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 66px); }
  }
  #feed[hidden] { display: none; }
  #feed div {
    align-self: flex-start; max-width: 100%; box-sizing: border-box; padding: 4px 8px; border-radius: 8px;
    background: rgba(2,6,23,0.65); color: #f8fafc; border-left: 3px solid var(--c, #94a3b8);
    animation: feedfade 6s forwards;
  }
  @keyframes feedfade {
    0% { opacity: 0; transform: translateY(6px); }
    5%, 80% { opacity: 1; transform: none; }
    100% { opacity: 0; }
  }
  /* 열린 방 목록 */
  #mp .rooms-title { margin: 4px 0 6px; color: #cbd5e1; font-weight: 600; }
  #mp-rooms { list-style: none; margin: 0 0 10px; padding: 0; max-height: min(240px, 40vh); overflow-y: auto; }
  #mp-rooms li + li { margin-top: 6px; }
  #mp-rooms button.room {
    display: flex; width: 100%; align-items: center; gap: 8px; text-align: left;
    background: #1e293b; color: #f8fafc; border: 1px solid #334155; font-weight: 400;
  }
  #mp-rooms .info { flex: 1; min-width: 0; }
  #mp-rooms .title, #mp-rooms .host { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mp-rooms .title { font-weight: 700; }
  #mp-rooms .host { color: #94a3b8; font-size: 12px; }
  #mp-rooms .count { font-variant-numeric: tabular-nums; font-weight: 700; color: #fbbf24; }
  #mp-rooms .state { font-size: 12px; color: #94a3b8; }
  #mp-rooms .empty { color: #94a3b8; padding: 8px 0; }
  #room .code { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
  #mp .who { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; color: #cbd5e1; }
  #room [hidden] { display: none !important; } /* .btns 의 display:flex 보다 우선 */
  #mp {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(2,6,23,0.6); font: 14px system-ui, sans-serif; color: #f8fafc;
  }
  #mp .box {
    width: min(320px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px;
    border: 1px solid rgba(148,197,255,0.4); border-radius: 14px; background: rgba(15,23,42,0.95);
  }
  #mp h2 { margin: 0 0 12px; font-size: 18px; }
  #mp .row { display: flex; gap: 8px; margin-bottom: 10px; }
  #mp input {
    flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #475569; border-radius: 8px;
    background: #0f172a; color: #f8fafc; font: inherit; font-size: 16px; user-select: text; -webkit-user-select: text;
  }
  #mp button, #room button {
    padding: 8px 12px; border: 0; border-radius: 8px; background: #fbbf24; color: #111827; font: 600 14px system-ui, sans-serif;
  }
  #mp button:disabled, #room button:disabled { opacity: 0.5; }
  #mp button.sub, #room button.sub { background: #334155; color: #f8fafc; }
  #mp .msg { min-height: 18px; margin: 4px 0 10px; color: #94a3b8; }
  #room {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: calc(var(--top, 0px) + max(60px, calc(env(safe-area-inset-top) + 48px)));
    width: 200px; box-sizing: border-box; padding: 8px 10px;
    max-height: calc(100dvh - var(--top, 0px) - 72px); overflow-y: auto; /* 아주 낮은 가로 화면에서는 스크롤 */ border: 1px solid rgba(148,197,255,0.3); border-radius: 12px;
    background: rgba(15,23,42,0.75); color: #f8fafc; font: 13px system-ui, sans-serif;
  }
  #room.playing { pointer-events: none; background: rgba(15,23,42,0.45); } /* 게임 중에는 탭이 점프로 전달되게 */
  #room .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 700; }
  #room .head .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #room ol { list-style: none; margin: 0; padding: 0; }
  #room li { display: flex; gap: 6px; padding: 2px 0; }
  #room li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #room li .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  #room li.me .name { color: #38bdf8; }
  #room li.over { opacity: 0.55; }
  #room .btns { display: flex; gap: 6px; margin-top: 8px; }
  /* 컴퓨터 추가 (방장만) */
  #room .botrow { display: flex; gap: 6px; margin-top: 6px; }
  #room .botrow select {
    flex: 0 0 auto; padding: 4px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #f8fafc; font: 13px system-ui, sans-serif;
  }
  #room .botrow button { flex: 1; padding: 6px 4px; font-size: 13px; white-space: nowrap; }
  #room li .kick { padding: 0 6px; border: 0; background: transparent; color: #94a3b8; font: 13px system-ui, sans-serif; }
  #room .btns button { flex: 1; padding: 6px 4px; font-size: 13px; white-space: nowrap; }
  #room .msg { margin: 6px 0 0; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rank" hidden>
  <form id="rank-form">
    <input id="rank-name" maxlength="20" placeholder="이름 (최대 12자)" autocomplete="off">
    <button type="submit">등록</button>
  </form>
  <p class="msg" id="rank-msg"></p>
  <ol id="rank-list"></ol>
</div>
<div id="rank-side" hidden></div>
<button id="pause-btn" type="button" aria-label="일시정지" hidden>❚❚</button>
<div id="items" hidden></div>
<div id="feed" hidden></div>
<div id="mp-open" hidden>
  <button id="over-solo" class="solo" type="button">🚕 혼자 하기</button>
  <button id="over-multi" type="button">👥 같이 하기</button>
</div>
<div id="mode" hidden>
  <button id="mode-solo" class="solo" type="button">🚕 혼자 하기</button>
  <button id="mode-multi" type="button">👥 같이 하기</button>
</div>
<div id="mp" hidden>
  <div class="box">
    <h2>같이 하기 (최대 4명)</h2>
    <!-- 1단계: 이름 입력 → 2단계: 방 만들기 / 코드로 참여 (초대 링크면 이름 입력 후 바로 참여) -->
    <div id="mp-step1">
      <div class="row"><input id="mp-name" maxlength="12" placeholder="내 이름 (최대 12자, 랭킹에도 사용)" autocomplete="off"></div>
      <div class="row"><button id="mp-next" type="button" style="flex:1">다음</button></div>
    </div>
    <div id="mp-step2" hidden>
      <p class="who"><span>이름: <b id="mp-who"></b></span><button id="mp-rename" class="sub" type="button">변경</button></p>
      <p class="rooms-title">방 만들기</p>
      <div class="row mode-row">
        <button id="mp-create-item" type="button">🎁 아이템전</button>
        <button id="mp-create-normal" type="button">🚕 노템전</button>
      </div>
      <p class="rooms-title">열린 방 (눌러서 입장)</p>
      <ol id="mp-rooms"></ol>
      <div class="row">
        <input id="mp-code" maxlength="4" placeholder="방 코드로 참여 (선택)" autocomplete="off" autocapitalize="characters">
        <button id="mp-join" type="button">참여</button>
      </div>
    </div>
    <p class="msg" id="mp-msg"></p>
    <div class="row"><button id="mp-close" class="sub" type="button" style="flex:1">닫기</button></div>
  </div>
</div>
<div id="room" hidden>
  <div class="head"><span id="room-title" class="name"></span><span id="room-count"></span></div>
  <div class="code" id="room-code"></div>
  <ol id="room-list"></ol>
  <div class="btns" id="room-btns">
    <button id="room-start" type="button">시작</button>
    <button id="room-copy" class="sub" type="button">초대</button>
    <button id="room-leave" class="sub" type="button">나가기</button>
  </div>
  <div class="botrow" id="room-botrow" hidden>
    <select id="room-bot-level" aria-label="컴퓨터 난이도">
      <option value="easy">쉬움</option>
      <option value="normal" selected>보통</option>
      <option value="hard">어려움</option>
    </select>
    <button id="room-bot-add" class="sub" type="button">🤖 컴퓨터 추가</button>
  </div>
  <p class="msg" id="room-msg"></p>
</div>
<script>
// 배포 버전: 코드를 바꿔 배포할 때마다 함께 올려야 캐시된 예전 화면이 자동으로 갱신됨
const VERSION = '2026-10-28.55';
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // 물리 상수: 체공 약 0.9초, 최고 높이 약 185px
  const GRAVITY = 1850;
  const JUMP_VELOCITY = 830;
  const CAR_SCALE = 1.6; // 로드스터 크기 배율
  const ROLLS_PER_JUMP = 1; // 점프당 배럴롤 횟수 (영상 기준 약 1바퀴)
  const START_SPEED = 380;
  const MAX_SPEED = 900;
  const SPEED_GAIN = 9; // 초당 속도 증가량
  // 길게 누르기: 상승 중 누르고 있는 동안(최대 HOLD_MAX초) 중력을 줄여 더 높고 길게 점프
  // 탭: 최고 약 186px·체공 0.9초 / 길게: 최고 약 333px·체공 1.26초
  const HOLD_GRAVITY = 0.4;
  const HOLD_MAX = 0.35;
  const NEAR_MISS = 16;     // 차량 위를 이 높이(px) 이내로 스치면 '아슬아슬'
  const MAX_COMBO_BONUS = 3;
  // 라이벌 차량: 차량을 ROLL_AFTER대 넘긴 뒤부터 가끔(ROLL_CHANCE) 우리 차와 같은 모델(민트 단색 랩핑)이
  // 배럴롤 점프로 우리 차를 뛰어넘어 뒤로 지나감. 가만히 있으면 머리 위로 지나가고, 그 순간 점프하면 공중 충돌.
  // 체공 시간은 속도와 상관없이 ROLL_TIME초로 고정해 우리 차처럼 느긋하게 돎
  const ROLL_AFTER = 25;
  const ROLL_CHANCE = 0.2;
  const ROLL_TIME = 1.1;  // 체공 시간(초) — 우리 차 탭 점프 0.9초, 길게 누르기 1.26초
  // 뛰어넘기 최고 높이: 우리 차 위를 지날 때 라이벌 바닥이 약 317 이상 → 길게 누른 점프(정점 약 333)로도 위로 넘을 수 없고 충돌
  const OVER_HOP = 380;
  const OVER_SPAN = 700;  // 뛰어넘는 동안 이동 거리 (정점이 우리 차 바로 위)
  const PLAYER_H = 64;    // 공중 충돌 판정용 우리 차 높이 (루프 표시등 포함)
  // 하이퍼루프 피버타임: FEVER_SCORE점 이상이면 달이 한 주기를 돌 때마다(삭) 터널이 등장.
  // 터널 안에서 연타하면 천장에 거꾸로 매달려 달리고 그 아래로 차량이 지나감.
  // 연타가 GRIP_TIME초 넘게 끊기면 추락해 게임 오버, 터널을 빠져나가면 배럴롤로 자동 착지
  const FEVER_SCORE = 100;
  const TUNNEL_TIME = 7;    // 터널 길이 (등장 시 속도로 달리는 시간, 초)
  const TUNNEL_CEIL = 230;  // 천장 높이(px)
  const TUNNEL_TOP = 272;   // 튜브 바깥 높이(px)
  const CEIL_Y = TUNNEL_CEIL - 66; // 매달렸을 때 player.y (뒤집힌 바퀴 윗면이 천장에 닿는 높이)
  const GRIP_TIME = 0.4;    // 마지막 탭 후 이 시간 안에 다시 눌러야 매달려 있음
  const CLIMB_TIME = 0.35;  // 천장까지 뒤집으며 올라가는 시간
  const EXIT_TIME = 0.9;    // 출구 배럴롤 착지 시간
  const FEVER_BONUS = 10;   // 터널 통과 보너스
  // 난이도 단계: LEVEL_SCORE점부터 LEVEL_STEP점마다 1단계씩 (최대 MAX_LEVEL)
  // 단계가 오를수록 연속 차량·라이벌 확률이 늘고 간격 랜덤 폭이 줄며, 박자를 깨는 러시 패턴이 자주 나옴
  const LEVEL_SCORE = 200;
  const LEVEL_STEP = 150;
  const MAX_LEVEL = 5;
  const LEVEL_OFFSET = 2;   // 단계별 난이도 = 단계 + 이 값 (LV1부터 바로 어렵게: LV1 = 예전 LV3 수준)
  const BURST_MAX = 6;      // 러시 최대 차량 수 (점프당 타이밍 허용 폭 0.1초 유지)
  // 러시 중 차량 간격 = 최소 간격 + 이 값 (랜덤 없이 일정한 박자). 점프마다 타이밍 오차를 이 폭 안에서만 허용:
  // 최악 패턴 기준 러시 4대 약 0.13초, 5대 약 0.11초, 6대(BURST_MAX) 0.1초
  const BURST_GAP = 0.035;
  // 일반 구간 최소 간격 = 최소 간격 + 이 값 = 탭 체공 시간(약 0.99초) + 0.1초 → 몇 대가 이어져도 점프당 허용 폭 0.1초 유지
  const CHAIN_GAP = 0.105;
  const GROUP_PAD = 0.35;   // 최고 속도에서 2~3대 묶음 뒤 추가 간격 (묶음 길이 무관)
  const SPREAD_CUT = 0.18;  // 난이도 값마다 간격 랜덤 폭을 이 비율씩 줄임 (LV1 약 0.5초 → LV3부터 약 0.1초)
  const SPREAD_MIN = 0.1;   // 랜덤 폭 최소 비율
  const BURST_REST = 1.0;   // 러시가 끝난 뒤 쉬는 시간 (박자 깨기)
  const BURST_PAIR = 0.35;  // 러시 중 2대 연속(길게 누르기) 섞일 확률 — 탭·길게 누르기 번갈아 요구

  // 장애물 차량: 테슬라 차종 이미지 (모두 왼쪽을 향하도록 배경 제거·반전한 PNG)
  // w: 화면 표시 폭(px), hitTop: 이미지 위쪽에서 판정 제외 비율, points: 넘었을 때 점수
  const OBSTACLE_TYPES = [
    { name: 'model3',     src: 'assets/cars/model3.png',     w: 150, hitTop: 0.15, points: 1 },
    { name: 'modely',     src: 'assets/cars/modely.png',     w: 140, hitTop: 0.15, points: 1 },
    { name: 'models',     src: 'assets/cars/models.png',     w: 150, hitTop: 0.15, points: 1 },
    { name: 'cybercab',   src: 'assets/cars/cybercab.png',   w: 120, hitTop: 0.2,  points: 1 },
    { name: 'modelx',     src: 'assets/cars/modelx.png',     w: 150, hitTop: 0.35, points: 2 }, // 팔콘윙 도어
    { name: 'cybertruck', src: 'assets/cars/cybertruck.png', w: 165, hitTop: 0.1,  points: 2 },
  ];
  // 이미지를 처음 그릴 때 디코딩하느라 프레임이 멈추지 않게, 로드 직후 캔버스에 미리 그려 둠.
  // 야간 장면용으로 살짝 어둡게(밝기 78%) 하는 것도 여기서 한 번만 처리 (매 프레임 ctx.filter 는 느림)
  function bakeCar(img) {
    const cv = document.createElement('canvas');
    cv.width = img.naturalWidth;
    cv.height = img.naturalHeight;
    const g = cv.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.fillRect(0, 0, cv.width, cv.height);
    return cv;
  }
  for (const t of OBSTACLE_TYPES) {
    t.img = new Image();
    t.img.onload = () => {
      t.h = Math.round(t.w * t.img.naturalHeight / t.img.naturalWidth);
      t.sprite = bakeCar(t.img);
    };
    t.img.src = t.src;
    t.h = Math.round(t.w * 0.33); // 로드 전 임시 높이
  }

  // 세로 화면(좁은 폭)에서도 다가오는 차량이 충분히 보이도록
  // 게임 월드를 최소 VIEW_MIN_W 논리 폭으로 잡고 화면에 맞게 축소해서 그림
  const VIEW_MIN_W = 820;
  // 가로로 낮은 화면(모바일 가로 모드)에서도 길게 누른 점프(최고 약 333px)와 라이벌 뛰어넘기(최고 380px)가 화면 안에 들어오도록 최소 논리 높이도 보장
  const VIEW_MIN_H = 660;
  let W = 0, H = 0, groundY = 0;  // 게임 월드(논리) 크기
  let SW = 0, SH = 0, viewScale = 1, dpr = 1; // 실제 화면 크기와 축소 배율
  // 같이 하기: 화면 위쪽 topInset(px)에 상대 화면을 그리고 내 게임은 그 아래에 그림
  let topInset = 0;
  let state = 'ready'; // ready | playing | over
  let speed, distance, score, best, obstacles, spawnTimer, particles, flips, popups, combo, carsPassed, level, burst;
  let holding = false; // 점프 버튼을 누르고 있는지
  let clock = 0;       // 배경 애니메이션용 경과 시간
  let player;
  let tunnel = null;   // 하이퍼루프 터널 { x: 입구 위치, len: 길이 }
  let moonCycle = 0;   // 지금까지 지난 달 주기 수 (피버타임 등장 판정)
  let cleared = false; // 만점(MAX_SCORE) 달성으로 끝났는지
  let feverEndAt = -Infinity; // 터널 구간 차량 생성이 끝난 시각

  try { best = Number(localStorage.getItem('roadster-best')) || 0; } catch { best = 0; }

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.6, r: Math.random() * 1.2 + 0.3 }));

  function resize() {
    dpr = window.devicePixelRatio || 1;
    SW = window.innerWidth;
    // 상대가 있는 방이면 화면 높이의 1/4 을 상대 화면 줄로 씀
    topInset = room && room.players.size > 1 ? Math.round(window.innerHeight / 4) : 0;
    document.documentElement.style.setProperty('--top', `${topInset}px`);
    SH = window.innerHeight - topInset;
    canvas.width = SW * dpr;
    canvas.height = window.innerHeight * dpr;
    // iOS Safari 의 100vh 는 주소창·하단 막대가 숨었을 때 높이라 보이는 화면보다 큼 → 캔버스가 세로로 늘어나
    // 캔버스 글자와 HTML 패널(랭킹·방) 위치가 어긋남. 보이는 화면 크기로 직접 맞춤
    canvas.style.width = `${SW}px`;
    canvas.style.height = `${window.innerHeight}px`;
    viewScale = Math.min(1, SW / VIEW_MIN_W, SH / VIEW_MIN_H);
    W = SW / viewScale;
    H = SH / viewScale;
    // 세로 화면은 하늘이 지나치게 넓어지지 않게 도로를 화면 중간쯤에 둠
    groundY = Math.round(H * (SH > SW ? 0.6 : 0.72));
    if (player) player.x = Math.max(100, W * 0.2);
  }

  function reset() {
    speed = START_SPEED;
    distance = 0;
    score = 0;
    flips = 0;
    combo = 0;
    carsPassed = 0;
    level = 0;
    burst = 0; // 남은 러시 차량 수
    feverEndAt = -Infinity;
    popups = [];
    obstacles = [];
    particles = [];
    spawnTimer = 1.2;
    player = {
      x: Math.max(100, W * 0.2), y: 0, vy: 0, roll: 0, airTime: 0,
      wheel: 0, onGround: true, smokeTimer: 0, jumpClears: 0, jumpNear: 0,
      mode: null, modeT: 0, y0: 0, r0: 0, lastTap: 0, // 피버 모드: toCeiling | ceiling | falling | exitRoll
    };
    tunnel = null;
    cleared = false;
    moonCycle = Math.floor(clock / MOON_CYCLE + 0.1);
    resetItems();
  }

  function airDuration() {
    return (2 * JUMP_VELOCITY) / GRAVITY;
  }

  function jump() {
    if (!player.onGround) return;
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    player.airTime = 0;
    player.jumpClears = 0;
    player.jumpNear = 0;
    smoke(player.x - 40 * CAR_SCALE, groundY - 6, 8, 40);
  }

  // 게임 오버 화면은 실수로 닫히지 않게 RESTART_HOLD초 동안 길게 눌러야 다시 시작
  const RESTART_HOLD = 0.6;
  let restartHold = null; // 길게 누르기 시작 시각 (clock 기준)

  function handleInput() {
    if (!mpDialog.hidden) return;
    if (paused) return setPaused(false); // 일시정지 중 입력은 재개만 (점프로 이어지지 않음)
    if (state === 'playing') return feverTap() || jump();
    if (room) return; // 같이 하기 방에서는 방장이 '시작'을 눌러야 다 같이 출발
    if (state === 'over') {
      restartHold = clock;
      return;
    }
    startGame();
  }

  function startGame() {
    if (!room && pendingVersion && applyUpdate()) return; // 방에 있는 동안은 새로고침으로 방이 끊기지 않게
    hideRanking();
    reset();
    state = 'playing';
    pauseBtn.hidden = false;
    jump();
    botsStart();
    roomStatus();
  }

  // ---------- 일시정지 ----------
  // 게임 중 버튼 / Esc·P 키로 멈춤, 화면 탭·Enter·Space·버튼으로 재개. 앱 전환·탭 숨김 시 자동 일시정지
  const pauseBtn = document.getElementById('pause-btn');
  let paused = false;

  function setPaused(on) {
    if (on && state !== 'playing') return;
    paused = on;
    holding = false;
    pauseBtn.textContent = on ? '▶' : '❚❚';
    pauseBtn.setAttribute('aria-label', on ? '계속하기' : '일시정지');
    if (!on && player && player.mode === 'ceiling') player.lastTap = clock; // 재개 직후 바로 떨어지지 않게
  }

  pauseBtn.addEventListener('pointerdown', (e) => e.stopPropagation()); // 버튼 탭이 점프로 전달되지 않게
  pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); setPaused(!paused); pauseBtn.blur(); });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') setPaused(!paused);
    if (e.key === '1' || e.key === '2' || e.key === '3') useItem(Number(e.key) - 1); // 아이템전: 아이템 사용
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; // 랭킹 이름 입력·버튼 포커스 중에는 점프/재시작 안 함
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (e.repeat) return;
    holding = true;
    handleInput();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' || e.key === ' ') holding = false;
  });
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    holding = true;
    if (!modeEl.hidden) return; // 시작 화면에서는 혼자 하기 / 같이 하기 버튼으로 선택 (키보드 Enter/Space 는 혼자 하기)
    handleInput();
  });
  window.addEventListener('pointerup', () => { holding = false; });
  window.addEventListener('pointercancel', () => { holding = false; });
  window.addEventListener('blur', () => { holding = false; setPaused(true); });

  const isTouch = window.matchMedia('(pointer: coarse)').matches; // 조작 안내 문구용 (탭 / 키보드)

  // ---------- 파티클 (불꽃 / 연기) ----------

  function sparks(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      particles.push({
        kind: 'spark', x, y,
        vx: -Math.random() * 160 - 40,
        vy: -Math.random() * 160,
        life: 0.5 + Math.random() * 0.3,
        color,
      });
    }
  }

  // 착지·번아웃 연기: 테일램프 빛을 받은 붉은 기와 투광등의 푸른 기를 섞음
  function smoke(x, y, n, spread) {
    for (let i = 0; i < n; i++) {
      particles.push({
        kind: 'smoke',
        x: x + (Math.random() - 0.5) * spread,
        y: y - Math.random() * 10,
        vx: (Math.random() - 0.5) * 50,
        vy: -Math.random() * 40 - 10,
        r: 8 + Math.random() * 10,
        life: 1 + Math.random() * 0.8,
        maxLife: 1.8,
        color: Math.random() < 0.35 ? '249,168,212' : '203,213,225',
      });
    }
  }

  function randomType() {
    return OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  }

  function addCar(type, x) {
    obstacles.push({ type, w: type.w, h: type.h, x, passed: false, minClear: Infinity });
  }

  // 라이벌: 차체 중심이 우리 차 위를 정점으로 지나가도록 이륙·착지 지점을 잡음 (터널 안에서는 이륙하지 않음)
  function addRival(x) {
    const o = {
      type: RIVAL, w: RIVAL.w, h: RIVAL.h, x, passed: false, minClear: Infinity,
      rival: true, jumpAt: player.x + OVER_SPAN / 2 - RIVAL.w / 2, land: player.x - OVER_SPAN / 2 - RIVAL.w / 2, peak: OVER_HOP,
      t: -1, p: 0, hop: 0, roll: 0, pitch: 0, landed: false, wheel: 0,
    };
    obstacles.push(o);
    return o;
  }

  // 장애물 패턴: 단일 차량 / 2~3대 연속(길게 누르기)
  // 연속 차량은 길게 누른 점프로 넘을 수 있는 속도 구간에서만 등장. 반환값은 다음 생성까지 추가 대기 시간
  function spawnObstacle(inBurst) {
    const x0 = W + 40;
    const r = Math.random();
    let count = 1;
    if (inBurst) {
      if (speed >= 450 && r < BURST_PAIR) count = 2;
    } else if (speed >= 650 && r < 0.15 + 0.04 * diff()) count = 3;
    else if (speed >= 450 && r < 0.4 + 0.06 * diff()) count = 2;
    if (!inBurst && count === 1 && carsPassed >= ROLL_AFTER && Math.random() < ROLL_CHANCE + 0.03 * diff()) {
      // 앞 차량과 겹치지 않게 조금 더 뒤에서 등장
      const x = x0 + speed * 0.3;
      const o = addRival(x);
      // 우리 차 위를 지나갈 때까지 다음 차량이 오지 않게 함 (점프해야 하는 상황과 겹치지 않도록)
      return (x - o.jumpAt) / speed + ROLL_TIME + 0.3;
    }
    let x = x0;
    for (let i = 0; i < count; i++) {
      const type = randomType();
      addCar(type, x);
      x += type.w + 30;
    }
    if (count === 1) return 0;
    // 묶음도 한 번에 넘고 가장 늦은 점프 시점은 첫 차량이 정하므로, 최고 속도에서는 착지가 묶음 길이와 거의 무관.
    // 길게 누르기 체공(약 1.25초)이 탭(약 0.99초)보다 긴 만큼만 여유를 둠 → 러시에서도 점프당 허용 폭 0.1초 유지
    // 그보다 느리면 묶음이 지나가는 시간이 길어 묶음 길이만큼 착지 여유를 둠
    if (speed >= MAX_SPEED) return GROUP_PAD;
    return (x - 30 - x0) / speed + 0.45;
  }

  // 난이도 값: 단계가 없으면 0, 있으면 단계 + LEVEL_OFFSET
  function diff() {
    return level ? level + LEVEL_OFFSET : 0;
  }

  // 다음 생성까지 대기 시간. 단계가 있으면 가끔 러시(짧은 간격으로 몰아서 등장 → 긴 휴식) 패턴
  function nextSpawn() {
    const minGap = 0.85 + 120 / speed;
    const d = diff();
    // 터널 출구 배럴롤 착지가 첫 점프를 늦추므로 터널 뒤 첫 차량은 러시로 시작하지 않음
    if (!burst && d && clock - feverEndAt > 1 && Math.random() < 0.1 + 0.05 * d) burst = Math.min(BURST_MAX, 3 + Math.floor(Math.random() * (1 + d / 2)));
    if (burst) {
      burst--;
      const extra = spawnObstacle(true);
      if (!burst) return minGap + extra + BURST_REST + Math.random() * 0.5;
      return minGap + extra + BURST_GAP;
    }
    const extra = spawnObstacle();
    // 단계가 높으면 랜덤 폭이 작아 일반 차량이 끝없이 빠듯하게 이어질 수 있음 → CHAIN_GAP 으로 허용 폭이 쌓여 줄지 않게 함
    return minGap + extra + (d ? CHAIN_GAP : 0) + Math.random() * 1.1 * Math.max(SPREAD_MIN, 1 - SPREAD_CUT * d);
  }

  function popup(text, color) {
    popups.push({ text, color, x: player.x, y: groundY - player.y - 70 - popups.length * 22, life: 1.1 });
  }

  // 착지 시 보너스 정산: 아슬아슬 콤보 + 한 번에 여러 대 넘기
  function settleJump() {
    if (!player.jumpClears) return;
    if (player.jumpNear) {
      combo++;
      const bonus = Math.min(combo, MAX_COMBO_BONUS);
      score += bonus;
      popup(combo > 1 ? `아슬아슬! x${combo} +${bonus}` : `아슬아슬! +${bonus}`, '#38bdf8');
    } else {
      combo = 0;
    }
    if (player.jumpClears >= 2) {
      const bonus = player.jumpClears - 1;
      score += bonus;
      popup(`${player.jumpClears === 2 ? 'DOUBLE' : 'TRIPLE'} +${bonus}`, '#fbbf24');
    }
  }

  // ---------- 하이퍼루프 피버타임 ----------

  function inTunnel() {
    return tunnel && player.x >= tunnel.x && player.x < tunnel.x + tunnel.len;
  }

  function startFever() {
    // 이미 화면에 나온 차량을 넘고 나서 진입하도록 화면 밖 멀리서 등장
    tunnel = { x: W + 40 + speed * 1.5, len: speed * TUNNEL_TIME };
    burst = 0;
    popup('FEVER TIME!', '#f472b6');
  }

  // 터널 구간의 차량 생성: 입구 직후·출구 착지 구간은 비우고, 안쪽에만 단일 차량(점수 2배)
  // 반환값은 다음 확인까지 대기 시간, 0 이면 터널을 지나 평소대로 생성
  function feverSpawn() {
    const x0 = W + 40;
    const end = tunnel.x + tunnel.len;
    if (x0 < tunnel.x + speed * 0.9) return 0.15;
    if (x0 + 170 < end - 700) {
      // 라이벌도 가끔 등장하지만 터널 안이라 뛰지 않고 바닥에 붙어 아래로 지나감 (updateRival)
      if (carsPassed >= ROLL_AFTER && Math.random() < ROLL_CHANCE) addRival(x0);
      else addCar(randomType(), x0);
      obstacles[obstacles.length - 1].fever = true;
      return 0.55 + Math.random() * 0.7;
    }
    if (x0 < end + speed * (EXIT_TIME + 0.6)) return 0.15;
    feverEndAt = clock;
    tunnel.done = true; // 넓은 화면에서는 아직 출구를 지나기 전일 수 있어 정리는 update 에서
    return 0;
  }

  // 피버 중 입력: 매달려 있으면 그립 유지, 터널 안이면 천장으로 점프. 처리했으면 true
  function feverTap() {
    const m = player.mode;
    if (m === 'ceiling' || m === 'toCeiling') {
      player.lastTap = clock;
      if (m === 'ceiling') sparks(player.x + (Math.random() - 0.5) * 100, groundY - TUNNEL_CEIL + 4, 5, '#f8fafc');
      return true;
    }
    if (m) return true; // 추락·착지 중에는 입력 무시
    if (!inTunnel()) return false;
    startClimb();
    return true;
  }

  function startClimb() {
    if (player.onGround) smoke(player.x - 40 * CAR_SCALE, groundY - 6, 8, 40);
    player.mode = 'toCeiling';
    player.modeT = 0;
    player.y0 = player.y;
    player.r0 = player.roll % (Math.PI * 2);
    player.onGround = false;
    player.vy = 0;
    player.lastTap = clock;
    player.jumpClears = 0;
    player.jumpNear = 0;
  }

  function updateFeverPlayer(dt) {
    player.modeT += dt;
    if ((player.mode === 'ceiling' || player.mode === 'toCeiling') && (!tunnel || player.x >= tunnel.x + tunnel.len)) {
      // 출구: 배럴롤로 자동 착지
      player.mode = 'exitRoll';
      player.modeT = 0;
      player.y0 = player.y;
    }
    const ease = (p) => p - Math.sin(2 * Math.PI * p) / (2 * Math.PI);
    if (player.mode === 'toCeiling') {
      const p = Math.min(1, player.modeT / CLIMB_TIME);
      const e = p * p * (3 - 2 * p);
      player.y = player.y0 + (CEIL_Y - player.y0) * e;
      player.roll = player.r0 + (Math.PI - player.r0) * e;
      if (p >= 1) {
        player.mode = 'ceiling';
        player.lastTap = clock;
        sparks(player.x, groundY - TUNNEL_CEIL + 4, 12, '#f8fafc');
      }
    } else if (player.mode === 'ceiling') {
      player.y = CEIL_Y;
      player.roll = Math.PI;
      if (clock - player.lastTap > GRIP_TIME) {
        player.mode = 'falling';
        player.vy = 0;
        popup('연타 실패!', '#ef4444');
      }
    } else if (player.mode === 'falling') {
      player.vy -= GRAVITY * dt;
      player.y += player.vy * dt;
      if (player.y <= 0) {
        player.y = 0;
        gameOver(); // 뒤집힌 채로 도로에 추락
      }
    } else if (player.mode === 'exitRoll') {
      // 뒤집힌 상태(π)에서 1.5바퀴 돌며 작은 포물선으로 내려와 바로 선 채 착지
      const p = Math.min(1, player.modeT / EXIT_TIME);
      player.y = player.y0 * (1 - p) + 160 * p * (1 - p);
      player.roll = Math.PI + Math.PI * 3 * ease(p);
      if (p >= 1) {
        player.mode = null;
        player.y = 0;
        player.vy = 0;
        player.roll = 0;
        player.onGround = true;
        player.smokeTimer = 0.45;
        flips++;
        score += FEVER_BONUS;
        popup(`하이퍼루프 클리어! +${FEVER_BONUS}`, '#f472b6');
        smoke(player.x, groundY - 4, 26, 100 * CAR_SCALE);
      }
    }
  }

  function update(dt) {
    clock += dt;
    if (state === 'over' && restartHold !== null) {
      if (!holding) restartHold = null;
      else if (clock - restartHold >= RESTART_HOLD) {
        restartHold = null;
        startGame();
      }
    }
    // 바퀴는 항상 시계 방향으로 보이게: 스포크 5개(72° 간격)라 한 프레임에 36° 이상 돌면
    // 눈에는 거꾸로 도는 것처럼 보이므로(마차 바퀴 효과) 프레임당 회전량을 0.45rad(약 26°)로 제한
    player.wheel += Math.min(speed * dt / 14, 0.45);
    updateParticles(dt);
    for (const p of popups) { p.life -= dt; p.y -= 40 * dt; }
    popups = popups.filter((p) => p.life > 0);
    if (cleared && Math.random() < dt * 4) {
      sparks(W * (0.2 + Math.random() * 0.6), groundY * (0.15 + Math.random() * 0.4), 24, ['#fbbf24', '#f472b6', '#67e8f9', '#6ee7b7'][Math.floor(Math.random() * 4)]);
    }
    // 달이 한 주기를 돌 때마다(삭) 피버타임 판정
    const cycle = Math.floor(clock / MOON_CYCLE + 0.1);
    const newMoon = cycle !== moonCycle;
    moonCycle = cycle;
    if (state !== 'playing') return;
    if (newMoon && score >= FEVER_SCORE && !tunnel) startFever();
    const lv = score < LEVEL_SCORE ? 0 : Math.min(MAX_LEVEL, 1 + Math.floor((score - LEVEL_SCORE) / LEVEL_STEP));
    if (lv > level) level = lv; // 단계는 화면에 표시하지 않고 난이도에만 반영
    if (tunnel) {
      tunnel.x -= speed * dt;
      // 출구 뒤 비우는 구간(feverSpawn)과 출구 착지가 모두 끝나고 출구가 화면 밖으로 나가면 정리
      if (tunnel.done && !player.mode && tunnel.x + tunnel.len < -100) tunnel = null;
    }

    speed = Math.min(MAX_SPEED, speed + SPEED_GAIN * dt);
    distance += speed * dt;

    // 일반 점프 중 터널에 들어가면 자동으로 천장에 매달림 (이후 연타 필요)
    if (!player.mode && !player.onGround && inTunnel()) startClimb();
    if (player.mode) {
      updateFeverPlayer(dt);
      if (state !== 'playing') return;
    } else if (!player.onGround) {
      player.airTime += dt;
      const boost = holding && player.vy > 0 && player.airTime < HOLD_MAX;
      player.vy -= GRAVITY * (boost ? HOLD_GRAVITY : 1) * dt;
      player.y += player.vy * dt;
      // 배럴롤: 이륙 직후 천천히 → 정점 부근에서 빠르게 → 착지 전 다시 천천히 정렬
      const p = Math.min(1, player.airTime / airDuration());
      const eased = p - Math.sin(2 * Math.PI * p) / (2 * Math.PI);
      player.roll = Math.PI * 2 * ROLLS_PER_JUMP * eased;
      if (player.y <= 0) {
        player.y = 0;
        player.vy = 0;
        player.roll = 0;
        player.onGround = true;
        player.smokeTimer = 0.45;
        flips++;
        settleJump();
        smoke(player.x, groundY - 4, 26, 100 * CAR_SCALE);
      }
    } else if (player.smokeTimer > 0) {
      // 착지 직후 잠깐 이어지는 타이어 연기
      player.smokeTimer -= dt;
      smoke(player.x - 32 * CAR_SCALE, groundY - 4, 2, 20);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const wait = tunnel ? feverSpawn() : 0;
      spawnTimer = wait || nextSpawn();
    }

    for (const o of obstacles) {
      o.x -= speed * dt;
      if (o.rival) updateRival(o, dt);
      // 라이벌은 판정 범위가 우리 차 뒤로 완전히 벗어난 뒤에 통과 처리 (보너스 표시 후 충돌하는 일이 없도록)
      const behind = o.rival ? o.x + o.w * 0.92 < player.x - 44 * CAR_SCALE : o.x + o.w < player.x - 45;
      if (!o.passed && behind) {
        o.passed = true;
        carsPassed++;
        const pts = o.type.points * (o.fever ? 2 : 1);
        score += pts;
        if (o.rival && !o.sky) popup(`안전운전 +${pts}점`, o.fever ? '#f472b6' : '#facc15');
        else if (o.fever) popup(`FEVER +${pts}`, '#f472b6');
        if (!player.onGround && (!o.rival || o.sky)) { // 하늘색 라이벌은 일반 차량처럼 뛰어넘음
          player.jumpClears++;
          if (o.minClear < NEAR_MISS) player.jumpNear++;
        }
      }
    }
    obstacles = obstacles.filter((o) => o.x + o.w > -50);

    // 충돌 판정 (회전 중인 차체를 감안해 박스를 조금 줄임)
    const half = 44 * CAR_SCALE;
    const px1 = player.x - half, px2 = player.x + half;
    const pBottom = groundY - player.y;
    for (const o of obstacles) {
      if (o.rival && o.hop > 0) {
        // 공중의 라이벌: 높이 구간 [hop, hop + 차 높이]와 우리 차 [y, y + PLAYER_H]가 겹치면 공중 충돌
        if (px2 > o.x + o.w * 0.08 && px1 < o.x + o.w * 0.92
          && player.y + PLAYER_H > o.hop && player.y < o.hop + o.h * (1 - o.type.hitTop)) {
          gameOver();
          break;
        }
        continue;
      }
      // 이미지 여백을 감안해 좌우 8%, 위쪽 hitTop 비율만큼 판정 제외
      const oTop = groundY - o.h * (1 - o.type.hitTop);
      if (px2 > o.x + o.w * 0.08 && px1 < o.x + o.w * 0.92) {
        o.minClear = Math.min(o.minClear, oTop - pBottom); // 차량 위 여유 높이 (아슬아슬 판정)
        if (pBottom > oTop) {
          gameOver();
          break;
        }
      }
    }
    itemTick();
    if (state === 'playing' && score >= MAX_SCORE) gameClear();
  }

  function updateParticles(dt) {
    const scroll = state === 'playing' ? speed : 0;
    for (const p of particles) {
      if (p.kind === 'smoke') {
        p.x += (p.vx - scroll * 0.75) * dt;
        p.y += p.vy * dt;
        p.vy *= 0.98;
        p.r += 34 * dt;
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
      }
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  function gameOver() {
    state = 'over';
    pauseBtn.hidden = true;
    restartHold = null; // 충돌 순간 누르고 있던 입력은 다시 시작으로 이어지지 않게
    sparks(player.x + 30, groundY - player.y, 30, '#ef4444');
    smoke(player.x + 30, groundY - player.y, 14, 60);
    if (score > best) {
      best = score;
      try { localStorage.setItem('roadster-best', String(best)); } catch {}
    }
    showRanking();
    roomStatus();
  }

  // 만점 달성: 점수를 만점으로 맞추고 게임 종료 + 축하 화면
  function gameClear() {
    score = MAX_SCORE;
    cleared = true;
    state = 'over';
    pauseBtn.hidden = true;
    restartHold = null;
    best = score;
    try { localStorage.setItem('roadster-best', String(best)); } catch {}
    showRanking();
    roomStatus();
  }

  // ---------- 새 버전 자동 갱신 ----------
  // GitHub Pages 캐시 때문에 예전 index.html 이 열려 있으면, 서버의 최신 파일 버전과 비교해
  // 게임 중이 아닐 때 ?v=새버전 주소로 다시 열어 캐시를 우회함
  let pendingVersion = null;

  function applyUpdate() {
    try {
      // 같은 버전으로 반복 새로고침되는 것 방지 (배포 직후 서버 반영이 늦는 경우)
      if (sessionStorage.getItem('roadster-reload') === pendingVersion) return false;
      sessionStorage.setItem('roadster-reload', pendingVersion);
    } catch {}
    location.replace(`${location.pathname}?v=${encodeURIComponent(pendingVersion)}`);
    return true;
  }

  async function checkUpdate() {
    try {
      const html = await (await fetch(location.pathname, { cache: 'no-store' })).text();
      const latest = (html.match(/const VERSION = '([^']+)'/) || [])[1];
      if (!latest || latest === VERSION) return;
      pendingVersion = latest;
      if (state === 'ready' && !room) applyUpdate();
    } catch {}
  }

  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

  // ---------- 온라인 랭킹 (Supabase) ----------
  // publishable 키는 공개용 키라 코드에 포함해도 됨. 쓰기 권한은 DB의 RLS 정책(supabase/scores.sql)으로 제한
  const SUPABASE_URL = 'https://auwkyehgnxejxacoklqt.supabase.co';

  const MAX_SCORE = 9999;
  const canSubmit = (v) => Number.isInteger(v) && v > 0 && v <= MAX_SCORE;
  const rankEl = document.getElementById('rank');

  function api(path, options = {}) {
    return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers },
    }).then(async (r) => {
      const text = await r.text(); // 본문이 비어 있는 응답(void 함수 등)도 처리
      if (!r.ok) { console.error('Supabase', r.status, text); throw new Error(r.status); }

  async function loadRanking() {
    rankMsg.textContent = '랭킹 불러오는 중…';
    try {
      const rows = await api('scores?select=name,score&order=score.desc,created_at.asc&limit=10');

      rankList.replaceChildren(...rows.map((r, i) => {

        const no = document.createElement('span'); no.className = 'no'; no.textContent = ['🥇', '🥈', '🥉'][i] || i + 1;
        const n = document.createElement('span'); n.className = 'name'; n.textContent = r.name;
        const v = document.createElement('span'); v.className = 'score'; v.textContent = r.score;
        li.append(no, n, v);
        return li;
      }));
      rankMsg.textContent = rows.length ? 'TOP 10' : '아직 기록이 없어요';

  // auto: 같이 하기에서 자동 등록 (실패해도 입력 폼 없이 안내만)

      const result = await api('rpc/submit_score', { method: 'POST', body: JSON.stringify({ p_name: name, p_score: score }) });

  // ---------- 같이 하기 (멀티플레이, Supabase Realtime) ----------
  // 방 코드 = Realtime 채널 이름. 접속자 목록은 Presence, 시작 신호·게임 화면 상태는 Broadcast 로 주고받음.

  const ROOM_MAX = 4;

  // (Supabase Realtime 메시지 한도를 넘지 않게 초당 약 6번)
  const FRAME_SEND = 0.16;
  const MINI_H = 520, MINI_GROUND = 440; // 상대 화면의 논리 높이·도로 위치 (긴 점프·터널이 들어가는 높이)
  const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js';
  const mpOpen = document.getElementById('mp-open');
  const mpDialog = document.getElementById('mp');
  const mpName = document.getElementById('mp-name');
  const mpCode = document.getElementById('mp-code');
  const mpMsg = document.getElementById('mp-msg');
  const roomEl = document.getElementById('room');
  const roomList = document.getElementById('room-list');

  const roomMsg = document.getElementById('room-msg');
  const myId = Math.random().toString(36).slice(2, 10);
  let room = null;          // { code, ch, players: Map(id → { id, name, joined, score, status, t }), host }
  let countdownAt = 0;      // 출발 시각 (performance.now 기준), 0 이면 카운트다운 없음
  let sentAt = 0, sendSeq = 0, roomRenderKey = '';
  let sbClient = null;

  function loadSupabase() {
    if (window.supabase) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = SUPABASE_JS;
      s.onload = resolve;
      s.onerror = reject;
      document.head.append(s);
    });
  }

  // 같이 하기 창: 항상 이름 입력(1단계)부터. code 가 있으면(초대 링크) 이름 입력 후 바로 그 방에 참여
  let pendingCode = '';
  async function ensureClient() {
    await loadSupabase();
    sbClient = sbClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  // 방 제목: 방 코드로 정해지는 자동 이름 (방장이 바뀌어도 그대로)
  const TITLE_A = ['신나는', '빠른', '용감한', '반짝이는', '졸린', '배고픈', '행복한', '수상한', '전설의', '번개같은', '느긋한', '날쌘'];
  const TITLE_B = ['택시', '로드스터', '사이버트럭', '하이퍼루프', '점프왕', '드라이버', '질주단', '고속도로', '야간 레이서', '배럴롤'];
  function roomTitle(code) {
    let h = 0;
    for (const c of code) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return `${TITLE_A[h % TITLE_A.length]} ${TITLE_B[Math.floor(h / TITLE_A.length) % TITLE_B.length]}`;
  }

  // ---------- 열린 방 목록 (로비) ----------
  // 모든 방의 방장이 로비 채널 Presence 에 { 방 코드, 방장 이름, 인원, 게임 중 } 을 올려 두고,
  // 같이 하기 창(2단계)을 연 사람은 로비 채널을 구독해 목록을 보여 줌. DB 테이블 없이 동작
  const LOBBY = 'car-jump-lobby';
  let lobbyCh = null, lobbyReady = false, lobbyMeta = '';

  // 같은 이름의 채널을 막 닫는 중이면 supabase-js 가 그 (닫히는) 채널을 그대로 돌려줘
  // 새 구독이 동작하지 않음 → 남아 있는 채널을 먼저 완전히 닫고 새로 만듦
  async function freshChannel(name, opts) {
    const stale = sbClient.getChannels().find((c) => c.topic === `realtime:${name}`);
    if (stale) await sbClient.removeChannel(stale);
    return sbClient.channel(name, opts);
  }

  let lobbyOpening = false;
  async function openLobby() {
    if (lobbyCh || lobbyOpening || !sbClient) return;
    lobbyOpening = true;
    const ch = await freshChannel(LOBBY, { config: { presence: { key: myId } } });
    lobbyOpening = false;
    if (lobbyCh) return;
    lobbyCh = ch;
    ch.on('presence', { event: 'sync' }, () => { if (lobbyCh === ch) renderLobby(); })
      .subscribe((status) => {
        if (lobbyCh !== ch) return;
        if (status === 'SUBSCRIBED') { lobbyReady = true; lobbyMeta = ''; lobbySync(); renderLobby(); closeLobbyIfIdle(); }
      });
  }

  // 같이 하기 창이 닫혀 있고 내가 방장이 아니면 로비 연결을 끊음
  function closeLobbyIfIdle() {
    if (!lobbyCh || !mpDialog.hidden || (room && room.host === myId)) return;
    sbClient.removeChannel(lobbyCh);
    lobbyCh = null;
    lobbyReady = false;
    lobbyMeta = '';
  }

  // 내가 방장이면 로비에 내 방 정보를 올리고(바뀔 때만), 아니면 내림
  function lobbySync() {
    if (room && room.host === myId) openLobby();
    if (!lobbyCh || !lobbyReady) return;
    if (room && room.host === myId) {
      const ps = [...room.players.values()];
      const meta = { code: room.code, host: room.me.name, mode: room.mode, n: room.players.size, playing: ps.some(running) || !!countdownAt }; // 창을 닫은 유령은 게임 중으로 치지 않음
      const k = JSON.stringify(meta);
      if (k !== lobbyMeta) { lobbyMeta = k; lobbyCh.track(meta); }
    } else if (lobbyMeta) {
      lobbyMeta = '';
      lobbyCh.untrack();
    }
  }

  function renderLobby() {
    const list = document.getElementById('mp-rooms');
    if (!lobbyCh || !lobbyReady) {
      list.replaceChildren(Object.assign(document.createElement('li'), { className: 'empty', textContent: '방 목록 불러오는 중…' }));
      return;
    }
    // 방장이 바뀌는 순간 같은 방이 두 번 보일 수 있어 코드별로 하나만 (인원이 많은 쪽)
    const byCode = new Map();
    for (const metas of Object.values(lobbyCh.presenceState())) {
      const m = metas[metas.length - 1];
      if (!m.code || (room && m.code === room.code)) continue;
      const cur = byCode.get(m.code);
      if (!cur || m.n > cur.n) byCode.set(m.code, m);
    }
    const rooms = [...byCode.values()].sort((a, b) => a.playing - b.playing || (a.n >= ROOM_MAX) - (b.n >= ROOM_MAX) || b.n - a.n);
    if (!rooms.length) {
      list.replaceChildren(Object.assign(document.createElement('li'), { className: 'empty', textContent: '열린 방이 없어요. 방을 만들어 보세요!' }));
      return;
    }
    list.replaceChildren(...rooms.map((m) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'room';
      const full = m.n >= ROOM_MAX;
      b.disabled = full;
      const info = document.createElement('span'); info.className = 'info';
      const t = document.createElement('span'); t.className = 'title'; t.textContent = roomTitle(m.code);
      const h = document.createElement('span'); h.className = 'host'; h.textContent = `👑 ${m.host}${m.mode ? ` · ${modeLabel(m.mode)}` : ''}`;
      info.append(t, h);
      const st = document.createElement('span'); st.className = 'state'; st.textContent = m.playing ? '게임 중' : full ? '가득 참' : '대기 중'; // 가득 찬 방도 게임 중이면 게임 중으로
      const c = document.createElement('span'); c.className = 'count'; c.textContent = `${m.n}/${ROOM_MAX}`;
      b.append(info, st, c);
      b.addEventListener('click', () => joinRoom(m.code));
      li.append(b);
      return li;
    }));
  }

  function openMp(code = '') {
    try { mpName.value = mpName.value || localStorage.getItem('roadster-name') || ''; } catch {}
    pendingCode = code;
    mpCode.value = code;
    mpMsg.textContent = code ? `방 ${code} 에 참여해요. 이름을 입력해 주세요` : '';
    mpStep(1);
    mpDialog.hidden = false;
    holding = false;
    mpName.focus();
  }

  function mpStep(n) {
    document.getElementById('mp-step1').hidden = n !== 1;
    document.getElementById('mp-step2').hidden = n !== 2;
    for (const b of mpDialog.querySelectorAll('button')) b.disabled = false;
  }

  function mpNext() {
    const name = mpName.value.trim().slice(0, 12);
    if (!name) { mpMsg.textContent = '이름을 입력해 주세요'; mpName.focus(); return; }
    try { localStorage.setItem('roadster-name', name); } catch {}
    document.getElementById('mp-who').textContent = name;
    mpStep(2);
    mpMsg.textContent = '';
    if (pendingCode) {
      pendingCode = '';
      joinRoom(mpCode.value);
      return;
    }
    renderLobby();
    ensureClient().then(() => { if (!mpDialog.hidden) openLobby(); }, () => { mpMsg.textContent = '연결 모듈을 불러오지 못했어요'; });
  }

  function closeMp() {
    mpDialog.hidden = true;
    document.activeElement.blur();
    closeLobbyIfIdle();
  }

  function myStatus() {
    return { id: myId, score: score || 0, status: state, t: ++sendSeq };
  }

  // 받은 정보가 더 최신(t 가 큼)일 때만 반영
  function mergePlayer(p) {
    const cur = room.players.get(p.id);
    if (!cur || p.t < (cur.t || 0)) return;
    Object.assign(cur, { score: p.score, status: p.status, t: p.t });
    if (p.f) { cur.frame = p.f; cur.frameAt = performance.now(); }
  }

  // 상대 화면을 그리기 위한 내 게임 상태 (위치는 내 차 기준 상대 좌표)
  function snapshot() {
    const px = player.x;
    const r1 = (v) => Math.round(v), r2 = (v) => Math.round(v * 100) / 100;
    return {
      d: r1(distance), s: r1(speed),
      p: [r1(player.y), r1(player.vy), r2(player.roll), r2(player.airTime), player.onGround ? 1 : 0, player.mode || ''],
      o: obstacles.filter((o) => o.x - px < 1800).map((o) => o.rival
        ? [o.sky ? -2 : -1, r1(o.x - px), r1(o.jumpAt - px), r1(o.land - px), r2(o.t), o.landed ? 1 : 0]
        : [OBSTACLE_TYPES.indexOf(o.type), r1(o.x - px)]),
      fx: (clock < whiteUntil ? 1 : 0) | (clock < fogUntil ? 2 : 0) | (clock < shieldUntil ? 4 : 0), // 받은 공격·방어막 표시
      tn: tunnel ? [r1(tunnel.x - px), r1(tunnel.len)] : 0,
    };
  }

  function sendFrame() {
    const p = { ...myStatus(), f: snapshot() };
    room.ch.send({ type: 'broadcast', event: 'frame', payload: p });
    sentAt = clock;
    mergePlayer(p);
  }

  // mode: 방을 만들 때만 'item'(아이템전) / 'normal'(노템전). 참여할 때는 방 사람들의 정보에서 받아 옴
  async function joinRoom(code, mode) {
    const name = mpName.value.trim().slice(0, 12);
    if (!name) { mpMsg.textContent = '이름을 입력해 주세요'; mpName.focus(); return; }
    code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 4) { mpMsg.textContent = '방 코드 4자리를 입력해 주세요'; mpCode.focus(); return; }
    try { localStorage.setItem('roadster-name', name); } catch {}
    mpMsg.textContent = '연결 중…';
    for (const b of mpDialog.querySelectorAll('button')) b.disabled = true;
    try {
      await ensureClient();
    } catch {
      mpMsg.textContent = '연결 모듈을 불러오지 못했어요';
      for (const b of mpDialog.querySelectorAll('button')) b.disabled = false;
      return;
    }
    const ch = await freshChannel(`car-jump-room-${code}`, { config: { presence: { key: myId }, broadcast: { self: false } } });
    const r = { code, ch, players: new Map(), bots: new Map(), host: null, mode, me: { name, joined: Date.now() } };
    ch.on('presence', { event: 'sync' }, () => onPresence(r))
      .on('broadcast', { event: 'start' }, () => { if (room === r) startCountdown(); })
      .on('broadcast', { event: 'frame' }, ({ payload }) => { if (room === r) { mergePlayer(payload); renderRoom(); } })
      .on('broadcast', { event: 'attack' }, ({ payload }) => { if (room === r) { receiveAttack(payload); botsReceive(payload); } })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          if (room && room !== r) return;
          room = r;
          await trackMe();
          closeMp();
          history.replaceState(null, '', `${location.pathname}?room=${code}`);
        } else if ((status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') && room !== r) {
          sbClient.removeChannel(ch);
          mpMsg.textContent = '방에 연결하지 못했어요. 다시 시도해 주세요';
          for (const b of mpDialog.querySelectorAll('button')) b.disabled = false;
        }
      });
  }

  function onPresence(r) {
    const prev = r.players;
    const list = Object.entries(r.ch.presenceState()).map(([id, metas]) => ({ id, ...metas[metas.length - 1] }));
    // 먼저 들어온 순서로 정렬: 맨 앞이 방장, ROOM_MAX 명까지만 입장
    list.sort((a, b) => a.joined - b.joined || (a.id < b.id ? -1 : 1));
    if (room === r && list.findIndex((p) => p.id === myId) >= ROOM_MAX) {
      leaveRoom();
      openMp();
      mpMsg.textContent = `방이 가득 찼어요 (최대 ${ROOM_MAX}명)`;
      return;
    }
    r.players = new Map(list.slice(0, ROOM_MAX).map((p) => {
      const old = prev.get(p.id);
      const now = performance.now();
      if (!old) return [p.id, { ...p, syncAt: now }];
      return [p.id, { ...p, frame: old.frame, frameAt: old.frameAt, syncAt: p.t !== old.t ? now : old.syncAt, ...(old.t > p.t ? { score: old.score, status: old.status, t: old.t } : {}) }];
    }));
    r.host = list[0] && list[0].id;
    addBotsFromHost(r, list, prev);
    // 방 모드는 방을 만든 사람에게서 시작해 모두가 자기 정보에 함께 올려 둠 (방장이 나가도 유지)
    if (!r.mode) r.mode = (list.find((p) => p.mode) || {}).mode;
    const mine = list.find((p) => p.id === myId);
    if (room === r && r.mode && mine && !mine.mode) trackMe();
    if (room === r) renderRoom();
  }

  function trackMe() {
    // 방장은 자기가 돌리는 컴퓨터 상대 목록도 함께 올림 (방장이 나가면 컴퓨터도 같이 사라짐)
    const bots = room.host === myId ? [...room.bots.values()].map((b) => ({ id: b.id, name: b.name, level: b.level, status: b.status, score: b.sim ? b.sim.score : 0 })) : [];
    return room.ch.track({ name: room.me.name, joined: room.me.joined, mode: room.mode, bots, ...myStatus() });
  }

  function leaveRoom() {
    if (!room) return;
    sbClient.removeChannel(room.ch);
    room = null;
    countdownAt = 0;
    roomEl.hidden = true;
    roomRenderKey = '';
    lobbySync();
    closeLobbyIfIdle();
    relayout();
    history.replaceState(null, '', location.pathname);
  }

  // 시작/게임 오버 때 상태를 Presence 에도 남겨 나중에 들어온 사람도 볼 수 있게 함
  function roomStatus() {
    if (!room) return;
    trackMe();
    sendFrame();
    renderRoom();
  }

  // 게임 중에는 FRAME_SEND 초마다 화면 상태 전송 (매 프레임 호출)
  function roomTick(now) {
    if (!room) return;
    if (countdownAt && now >= countdownAt) {
      countdownAt = 0;
      setPaused(false);
      startGame();
    }
    if (state === 'playing' && !paused && clock - sentAt >= FRAME_SEND) {
      sendFrame();
      renderRoom();
    } else if (now - roomCheckAt > 1000) {
      // 멈춘 사람이 생기면 시작 버튼이 풀리도록 가끔 다시 확인
      roomCheckAt = now;
      renderRoom();
    }
  }
  let roomCheckAt = 0;

  // 상대가 생기거나 모두 나가면 화면 위쪽 상대 화면 줄을 넣거나 빼고 다시 배치
  function relayout() {
    resize();
    plaidCache = {};
    overLayoutKey = '';
  }

  // 받은 상태 + 받은 뒤 지난 시간(dt)만큼 예측한 상대 월드 { distance, player, obstacles, tunnel }
  function remoteWorld(rp, now, px) {
    const f = rp.frame;
    const dt = f && rp.status === 'playing' ? Math.min(0.5, (now - rp.frameAt) / 1000) : 0;
    const sp = f ? f.s : START_SPEED;
    const distance = (f ? f.d : 0) + sp * dt;
    if (!f) return { distance, player: { y: 0, roll: 0, onGround: true }, obstacles: [], tunnel: null, fx: 0 };
    let [y, vy, roll, air, ground, mode] = f.p;
    if (!ground && !mode) {
      air += dt;
      y += vy * dt - GRAVITY * dt * dt / 2;
      const p = Math.min(1, air / airDuration());
      roll = Math.PI * 2 * ROLLS_PER_JUMP * (p - Math.sin(2 * Math.PI * p) / (2 * Math.PI));
      if (y <= 0) { y = 0; roll = 0; ground = 1; }
    }
    const obstacles = f.o.map(([ti, rx, jump, land, t, landed]) => {
      if (ti >= 0) return { type: OBSTACLE_TYPES[ti], x: px + rx - sp * dt };
      const o = { rival: true, sky: ti === -2, x: px + rx - sp * dt, hop: 0, roll: 0 };
      if (t >= 0 && !landed) {
        const tt = t + dt, p = Math.min(1, tt / ROLL_TIME);
        if (p < 1) {
          o.x = px + jump + (land - jump) * p;
          o.hop = 4 * OVER_HOP * p * (1 - p);
          o.roll = Math.PI * 2 * (p - Math.sin(2 * Math.PI * p) / (2 * Math.PI));
        } else {
          o.x = px + land - sp * (tt - ROLL_TIME);
        }
      }
      return o;
    });
    return { distance, player: { y, roll, onGround: !!ground }, obstacles, tunnel: f.tn ? { x: px + f.tn[0] - sp * dt, len: f.tn[1] } : null, fx: f.fx || 0 };
  }

  // 상대 화면용 라이벌 회전 프레임 (상대 화면에 라이벌이 처음 나올 때 한 번만 저해상도로 만듦)
  const MINI_RIVAL_FRAMES = 24;
  const miniRivalSprites = {};
  function miniRivalSprite(roll, sky) {
    const key = sky ? 'sky' : 'mint';
    if (!miniRivalSprites[key]) {
      const k = CAR_SCALE * Math.max(1, dpr * 0.5);
      const list = miniRivalSprites[key] = [];
      // 하늘색 라이벌은 뛰지 않으므로 바로 선 프레임 하나만 있으면 됨
      for (let i = 0; i < (sky ? 1 : MINI_RIVAL_FRAMES); i++) {
        const cv = document.createElement('canvas');
        cv.width = SPRITE_W * k;
        cv.height = SPRITE_H * k;
        const g = cv.getContext('2d');
        g.setTransform(-k, 0, 0, k, cv.width / 2, cv.height / 2); // 좌우 반전: 왼쪽을 향함
        renderRoadster(g, (i / MINI_RIVAL_FRAMES) * Math.PI * 2, 0, sky ? SKY_MESH : RIVAL_MESH);
        list.push(cv);
      }
    }
    const list = miniRivalSprites[key], n = list.length;
    return list[((Math.round((roll / (Math.PI * 2)) * n) % n) + n) % n];
  }

  // 상대 화면 한 칸: 성능을 위해 배경(하늘·빌딩·달·조명)과 효과(연기·분사·빛 번짐)는 빼고
  // 단색 하늘·도로, 단순한 터널, 미리 그려 둔 차량 이미지만 그림 (g: 논리 좌표로 변환된 컨텍스트)
  function drawMini(g, wd, Wm) {
    const gy = MINI_GROUND;
    g.fillStyle = '#060a16';
    g.fillRect(0, 0, Wm, gy);
    g.fillStyle = '#0c0f16';
    g.fillRect(0, gy, Wm, MINI_H - gy);
    g.fillStyle = '#334155';
    const dash = wd.distance % 60;
    for (let x = -dash; x < Wm; x += 60) g.fillRect(x, gy + 22, 30, 3);
    if (wd.fx & 1) { // 화이트아웃 공격을 받는 중
      g.fillStyle = 'rgba(248,250,252,0.95)';
      g.fillRect(0, 0, Wm, MINI_H);
    }
    const tn = wd.tunnel;
    if (tn && tn.x < Wm && tn.x + tn.len > 0) {
      const x1 = Math.max(0, tn.x), w = Math.min(Wm, tn.x + tn.len) - x1;
      g.fillStyle = 'rgba(225,18,40,0.16)';
      g.fillRect(x1, gy - TUNNEL_CEIL, w, TUNNEL_CEIL);
      g.fillStyle = '#e11d48';
      g.fillRect(x1, gy - TUNNEL_TOP, w, TUNNEL_TOP - TUNNEL_CEIL);
    }
    for (const o of wd.obstacles) {
      if (o.x > Wm || o.x < -300) continue;
      if (o.rival) {
        const sp = miniRivalSprite(o.roll, o.sky);
        const cx = o.x + RIVAL.w / 2, cy = gy - o.hop - AXIS_Y * CAR_SCALE;
        g.drawImage(sp, cx - (SPRITE_W / 2) * CAR_SCALE, cy - (SPRITE_H / 2) * CAR_SCALE, SPRITE_W * CAR_SCALE, SPRITE_H * CAR_SCALE);
      } else if (o.type.sprite) {
        g.drawImage(o.type.sprite, o.x, gy - o.type.h + 2, o.type.w, o.type.h);
      }
    }
    const pl = wd.player, px = wd.px;
    const sprites = pl.onGround ? groundSprites : rollSprites;
    const frame = pl.onGround ? 0 : ((Math.round((pl.roll / (Math.PI * 2)) * ROLL_FRAMES) % ROLL_FRAMES) + ROLL_FRAMES) % ROLL_FRAMES;
    const cy = gy - pl.y - AXIS_Y * CAR_SCALE;
    g.drawImage(sprites[frame], px - (SPRITE_W / 2) * CAR_SCALE, cy - (SPRITE_H / 2) * CAR_SCALE, SPRITE_W * CAR_SCALE, SPRITE_H * CAR_SCALE);
    if (wd.fx & 2) { // 안개 공격을 받는 중
      g.fillStyle = 'rgba(203,213,225,0.8)';
      g.fillRect(px + 50 * CAR_SCALE, 0, Wm, MINI_H);
    }
    if (wd.fx & 4) { // 방어막
      g.strokeStyle = 'rgba(103,232,249,0.9)';
      g.lineWidth = 6;
      g.beginPath();
      g.arc(px, cy, 70 * CAR_SCALE, 0, Math.PI * 2);
      g.stroke();
    }
  }

  // 화면 위쪽 topInset 높이에 상대 수만큼 가로로 균등하게 나눠 상대 게임 화면을 그림.
  // 별도 캔버스에 초당 MINI_FPS 번만 다시 그리고, 매 프레임은 그 이미지를 복사만 함
  const MINI_FPS = 30;
  const miniCanvas = document.createElement('canvas');
  const miniCtx = miniCanvas.getContext('2d');
  let miniAt = 0;
  function drawRivalViews() {
    const others = [...room.players.values()].filter((p) => p.id !== myId);
    if (!others.length) return;
    const now = performance.now();
    const chH = topInset;
    if (miniCanvas.width !== Math.round(SW * dpr) || miniCanvas.height !== Math.round(chH * dpr)) {
      miniCanvas.width = Math.round(SW * dpr);
      miniCanvas.height = Math.round(chH * dpr);
      miniAt = 0;
    }
    if (now - miniAt >= 1000 / MINI_FPS - 2) {
      miniAt = now;
      const g = miniCtx;
      const cw = SW / others.length;
      const s = chH / MINI_H;
      others.forEach((rp, i) => {
        const x0 = Math.round(i * cw), w = Math.round((i + 1) * cw) - x0;
        const Wm = w / s;
        const wd = remoteWorld(rp, now, Math.max(90, Wm * 0.2));
        wd.px = Math.max(90, Wm * 0.2);
        g.save();
        g.setTransform(dpr * s, 0, 0, dpr * s, x0 * dpr, 0);
        g.beginPath();
        g.rect(0, 0, Wm, MINI_H);
        g.clip();
        drawMini(g, wd, Wm);
        g.restore();

        // 이름·점수·상태 (화면 픽셀 기준)
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (rp.status !== 'playing') {
          g.fillStyle = 'rgba(2,6,23,0.55)';
          g.fillRect(x0, 0, w, chH);
          g.textAlign = 'center';
          g.fillStyle = rp.status === 'over' ? '#ef4444' : '#cbd5e1';
          g.font = `bold ${Math.min(22, Math.max(13, chH / 8))}px system-ui, sans-serif`;
          g.fillText(rp.status === 'over' ? 'CRASH!' : '대기 중', x0 + w / 2, chH / 2 + 6);
        }
        g.font = 'bold 13px system-ui, sans-serif';
        const label = `${rp.id === room.host ? '👑 ' : ''}${rp.name}`;
        const scoreText = String(rp.score || 0);
        g.fillStyle = 'rgba(2,6,23,0.6)';
        g.fillRect(x0, 0, w, 22);
        g.textAlign = 'left';
        g.fillStyle = '#f8fafc';
        const scoreW = g.measureText(scoreText).width;
        let name = label;
        while (name.length > 1 && g.measureText(name).width > w - scoreW - 22) name = name.slice(0, -1);
        g.fillText(name === label ? name : `${name}…`, x0 + 6, 16);
        g.textAlign = 'right';
        g.fillStyle = '#fbbf24';
        g.fillText(scoreText, x0 + w - 6, 16);
        // 칸 구분선·아래 경계선
        g.fillStyle = 'rgba(148,163,184,0.5)';
        if (i) g.fillRect(x0, 0, 1, chH);
        if (i === others.length - 1) g.fillRect(0, chH - 1, SW, 1);
      });
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(miniCanvas, 0, 0);
  }

  function startCountdown() {
    if (state === 'playing' || countdownAt) return;
    countdownAt = performance.now() + COUNTDOWN * 1000;
    hideRanking();
    renderRoom();
  }

  // '달리는 중'인데 STALE_MS 동안 게임 화면 정보가 오지 않은 사람 (새로고침·창 닫기 후 접속 정보만 남은 경우,
  // 앱 전환·일시정지로 멈춘 경우). 공격 대상·시작 대기·순위의 '달리는 중' 인원에서 뺌
  const STALE_MS = 3000;
  function running(p) {
    if (p.status !== 'playing') return false;
    if (p.id === myId) return state === 'playing';
    return performance.now() - Math.max(p.frameAt || 0, p.syncAt || 0) < STALE_MS;
  }

  function canStart() {
    return room && room.host === myId && !countdownAt && ![...room.players.values()].some(running);
  }

  function renderRoom() {
    if (!room) return;
    if ((room.players.size > 1 ? Math.round(window.innerHeight / 4) : 0) !== topInset) relayout();
    lobbySync();
    closeLobbyIfIdle(); // 방장이 넘어가면 로비 연결 정리
    const players = [...room.players.values()];
    const playing = state === 'playing' || countdownAt;
    // 게임을 시작한 뒤에는 점수 순, 대기 중에는 들어온 순
    if (players.some((p) => p.status !== 'ready')) players.sort((a, b) => b.score - a.score);
    const host = room.host === myId;
    const msg = countdownAt ? '곧 출발!'
      : playing ? ''
      : host ? (canStart() ? '모두 모이면 시작을 눌러 주세요' : '다른 사람이 끝날 때까지 기다려요')
      : '방장이 시작하면 같이 출발해요';
    const key = JSON.stringify([players.map((p) => [p.id, p.name, p.score, p.status]), room.host, playing, msg, canStart(), topInset, room.mode]);
    if (key === roomRenderKey) return;
    roomRenderKey = key;
    // 게임 중 상대 화면 줄이 있으면 점수는 거기서 보이므로 방 패널은 숨겨 내 화면을 가리지 않게 함
    roomEl.hidden = !!playing && topInset > 0;
    roomEl.classList.toggle('playing', !!playing);
    document.getElementById('room-title').textContent = roomTitle(room.code);
    document.getElementById('room-code').textContent = `코드 ${room.code}${room.mode ? ` · ${modeLabel(room.mode)}` : ''}`;
    document.getElementById('room-count').textContent = `${room.players.size}/${ROOM_MAX}`;
    roomList.replaceChildren(...players.map((p) => {
      const li = document.createElement('li');
      if (p.id === myId) li.classList.add('me');
      if (p.status === 'over') li.classList.add('over');
      const n = document.createElement('span'); n.className = 'name';
      const label = p.bot ? `🤖 ${p.name} · ${BOT_LEVELS[p.level] ? BOT_LEVELS[p.level].label : ''}` : p.name;
      n.textContent = `${p.id === room.host ? '👑 ' : ''}${label}${p.status === 'over' ? ' 💥' : p.status === 'playing' ? ' 🚕' : ''}`;
      const v = document.createElement('span'); v.className = 'score'; v.textContent = p.status === 'ready' ? '대기' : p.score;
      li.append(n, v);
      if (p.bot && host && !playing && ![...room.players.values()].some(running)) {
        const x = document.createElement('button'); x.type = 'button'; x.className = 'kick'; x.textContent = '✕'; x.setAttribute('aria-label', `${p.name} 빼기`);
        x.addEventListener('click', () => removeBot(p.id));
        li.append(x);
      }
      return li;
    }));
    document.getElementById('room-btns').hidden = !!playing;
    document.getElementById('room-botrow').hidden = !host || !!playing || room.players.size >= ROOM_MAX || [...room.players.values()].some(running);
    roomStart.hidden = !host;
    roomStart.disabled = !canStart();
    roomMsg.textContent = msg;
    roomMsg.hidden = !msg;
  }

  // 시작 화면: 혼자 하기 / 같이 하기 선택. 혼자 한 판 끝난 게임 오버 화면에서는 왼쪽 위에 같은 두 버튼
  const modeEl = document.getElementById('mode');
  function syncMpButton() {
    const free = !room && mpDialog.hidden;
    const showMode = free && state === 'ready';
    const showOpen = free && state === 'over';
    if (modeEl.hidden === showMode) modeEl.hidden = !showMode;
    if (mpOpen.hidden === showOpen) mpOpen.hidden = !showOpen;
  }

  for (const el of [mpOpen, mpDialog, roomEl, modeEl]) el.addEventListener('pointerdown', (e) => e.stopPropagation());
  document.getElementById('over-solo').addEventListener('click', (e) => { e.currentTarget.blur(); startGame(); });
  document.getElementById('over-multi').addEventListener('click', (e) => { e.currentTarget.blur(); openMp(); });
  document.getElementById('mode-solo').addEventListener('click', (e) => { e.currentTarget.blur(); startGame(); });
  document.getElementById('mode-multi').addEventListener('click', (e) => { e.currentTarget.blur(); openMp(); });
  document.getElementById('mp-next').addEventListener('click', mpNext);
  mpName.addEventListener('keydown', (e) => { if (e.key === 'Enter') mpNext(); });
  document.getElementById('mp-rename').addEventListener('click', () => { mpStep(1); mpMsg.textContent = ''; mpName.focus(); });
  document.getElementById('mp-close').addEventListener('click', closeMp);
  const newCode = () => Array.from({ length: 4 }, () => ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)]).join('');
  document.getElementById('mp-create-item').addEventListener('click', () => joinRoom(newCode(), 'item'));
  document.getElementById('mp-create-normal').addEventListener('click', () => joinRoom(newCode(), 'normal'));
  document.getElementById('mp-join').addEventListener('click', () => joinRoom(mpCode.value));
  mpCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(mpCode.value); });
  roomStart.addEventListener('click', () => {
    roomStart.blur();
    if (!canStart()) return;
    room.ch.send({ type: 'broadcast', event: 'start', payload: {} });
    startCountdown();
  });
  document.getElementById('room-copy').addEventListener('click', async (e) => {
    const url = `${location.origin}${location.pathname}?room=${room.code}`;
    e.currentTarget.blur();
    try {
      if (navigator.share && isTouch) await navigator.share({ title: 'Kakao Taxi Jump 같이 하기', url });
      else { await navigator.clipboard.writeText(url); roomMsg.hidden = false; roomMsg.textContent = '초대 링크를 복사했어요'; roomRenderKey = ''; }
    } catch {}
  });
  document.getElementById('room-leave').addEventListener('click', (e) => { e.currentTarget.blur(); leaveRoom(); });
  window.addEventListener('pagehide', () => { if (room) sbClient.removeChannel(room.ch); });

  // 초대 링크(?room=코드)로 들어오면 참여 창을 바로 띄움
  const inviteCode = (new URLSearchParams(location.search).get('room') || '').toUpperCase().slice(0, 4);
  if (inviteCode) openMp(inviteCode);

  // ---------- 아이템전 ----------
  // 점수가 ITEM_EVERY 점 오를 때마다 무작위 아이템 1개 (공격·방어 합쳐 최대 ITEM_MAX 개 보관, 꽉 차면 버림).
  // 공격 아이템은 같은 방에서 달리고 있는 상대 모두에게, 방어는 나에게만 적용.
  // 같은 공격이 겹치면(여러 명이 동시에 보내거나 효과 중에 또 받으면) 화이트아웃·안개는 시간이 늘고 라이벌은 대수가 늘어남
  const ITEM_EVERY = 50;
  const ITEM_MAX = 3;
  const ATTACK_TIME = 3;   // 화이트아웃·안개 지속 시간(초)
  const SHIELD_TIME = 8;   // 방어막 지속 시간(초)
  const ITEM_INFO = {
    white: { icon: '⚪', name: '화이트아웃' },  // 상대 배경을 흰색으로
    fog: { icon: '🌫️', name: '안개' },          // 상대 차 앞에 안개
    mint: { icon: '🚙', name: '민트 라이벌' },  // 상대에게 뛰어넘어 오는 민트 라이벌
    sky: { icon: '🚘', name: '하늘 라이벌' },   // 상대에게 뛰지 않는 하늘색 라이벌
    shield: { icon: '🛡️', name: '방어막' },    // 받은 공격 제거 + 일정 시간 공격 막기
  };
  const ITEM_KINDS = Object.keys(ITEM_INFO);
  const itemsEl = document.getElementById('items');
  let items = [], nextItemAt = ITEM_EVERY, whiteUntil = 0, fogUntil = 0, shieldUntil = 0, itemsKey = '';
  let whiteFrom = 0, fogFrom = 0; // 효과가 시작된 시각 (겹쳐서 늘어나도 시작 페이드는 한 번만)

  function itemMode() {
    return !!room && room.mode === 'item';
  }

  // ---------- 아이템전 알림창 (채팅처럼 쌓임) ----------
  const FEED_MAX = 5;      // 한 번에 보이는 줄 수
  const FEED_TIME = 6000;  // 한 줄이 보이는 시간(ms), CSS feedfade 와 같은 값
  const feedEl = document.getElementById('feed');
  let feed = [], feedSeq = 0, feedKey = '';

  function feedPush(text, color) {
    feed.push({ id: ++feedSeq, text, color, at: performance.now() });
    if (feed.length > FEED_MAX) feed.shift();
  }

  // 매 프레임 호출: 보일 줄이 바뀔 때만 다시 그림 (새 줄 추가·오래된 줄 사라짐)
  function renderFeed() {
    const now = performance.now();
    feed = feed.filter((m) => now - m.at < FEED_TIME);
    const show = itemMode() && state === 'playing' && feed.length > 0;
    const key = show ? feed.map((m) => m.id).join() : '';
    if (key === feedKey) return;
    feedKey = key;
    feedEl.hidden = !show;
    if (!show) return;
    // 이미 있던 줄은 DOM 에서 빼지 않아야 사라지는 애니메이션이 처음부터 다시 시작하지 않음 → 지난 줄만 지우고 새 줄만 덧붙임
    const ids = new Set(feed.map((m) => String(m.id)));
    for (const el of [...feedEl.children]) if (!ids.has(el.dataset.id)) el.remove();
    const shown = new Set([...feedEl.children].map((el) => el.dataset.id));
    for (const m of feed) {
      if (shown.has(String(m.id))) continue;
      const el = document.createElement('div');
      el.dataset.id = m.id;
      el.textContent = m.text;
      el.style.setProperty('--c', m.color);
      el.style.animationDuration = `${FEED_TIME}ms`;
      feedEl.append(el);
    }
  }

  function resetItems() {
    feed = [];
    items = [];
    nextItemAt = ITEM_EVERY;
    whiteUntil = fogUntil = shieldUntil = whiteFrom = fogFrom = 0;
  }

  function itemTick() {
    if (!itemMode()) return;
    while (score >= nextItemAt) {
      nextItemAt += ITEM_EVERY;
      if (items.length >= ITEM_MAX) continue;
      const k = ITEM_KINDS[Math.floor(Math.random() * ITEM_KINDS.length)];
      items.push(k);
      feedPush(`🎁 ${ITEM_INFO[k].icon} ${ITEM_INFO[k].name} 획득`, '#a78bfa');
    }
  }

  function useItem(i) {
    if (state !== 'playing' || paused || !itemMode() || !items[i]) return;
    const k = items[i];
    const info = ITEM_INFO[k];
    let targets = [];
    if (k !== 'shield') {
      // 지금 이 방에서 실제로 달리고 있는 상대 모두 (running: 접속 정보만 남은 사람·멈춘 사람 제외)
      targets = [...room.players.values()].filter((p) => p.id !== myId && running(p));
      if (!targets.length) { feedPush('공격할 상대가 없어요 (아이템은 그대로)', '#94a3b8'); return; }
    }
    items.splice(i, 1);
    if (k === 'shield') {
      // 지금 받은 공격 제거: 화이트아웃·안개 끝내고, 아직 다가오는 공격 차량은 치움 (머리 위를 넘는 중인 라이벌은 그대로)
      whiteUntil = fogUntil = 0;
      obstacles = obstacles.filter((o) => !o.attack || o.passed || (o.rival && o.t >= 0 && !o.landed) || o.x < player.x + 60 * CAR_SCALE);
      // 방어막 중에 또 쓰면 남은 시간에 더함
      shieldUntil = Math.max(shieldUntil, clock) + SHIELD_TIME;
      feedPush(`${info.icon} 방어막 사용 (${Math.ceil(shieldUntil - clock)}초)`, '#67e8f9');
    } else {
      const payload = { room: room.code, from: myId, to: targets.map((p) => p.id), kind: k };
      room.ch.send({ type: 'broadcast', event: 'attack', payload });
      botsReceive(payload); // 내가 돌리는 컴퓨터 상대는 브로드캐스트를 받지 못하므로 직접 전달
      feedPush(`나 → ${targets.length > 1 ? `모두(${targets.length}명)` : targets[0].name}: ${info.icon} ${info.name}`, '#a78bfa');
    }
  }

  function receiveAttack({ room: code, from, to, kind }) {
    const info = ITEM_INFO[kind];
    if (!info || kind === 'shield' || !Array.isArray(to) || !itemMode()) return;
    // 같은 방 사람이 보낸 공격만 받음
    if (code !== room.code || from === myId || !room.players.has(from)) return;
    const who = room.players.get(from).name;
    if (!to.includes(myId) || state !== 'playing') {
      // 내가 대상이 아니면 (이미 끝났거나 대기 중) 알림만
      feedPush(`${who} → ${to.length > 1 ? `모두(${to.length}명)` : (room.players.get(to[0]) || {}).name || '상대'}: ${info.icon} ${info.name}`, '#94a3b8');
      return;
    }
    if (clock < shieldUntil) {
      feedPush(`🛡️ ${who}의 ${info.icon} ${info.name} 막음`, '#67e8f9');
      return;
    }
    if (kind === 'white' || kind === 'fog') {
      // 이미 같은 효과 중이면 남은 시간에 ATTACK_TIME 을 더함
      const until = kind === 'white' ? whiteUntil : fogUntil;
      const stacked = clock < until;
      const next = (stacked ? until : clock) + ATTACK_TIME;
      if (kind === 'white') { if (!stacked) whiteFrom = clock; whiteUntil = next; }
      else { if (!stacked) fogFrom = clock; fogUntil = next; }
      feedPush(`${who} → 나: ${info.icon} ${info.name}${stacked ? ` 추가 (총 ${Math.ceil(next - clock)}초)` : ''}`, '#f87171');
    } else {
      // 라이벌은 받을 때마다 한 대씩 더 (앞 라이벌 뒤에 차례로 배치)
      forceRival(kind === 'sky');
      const n = obstacles.filter((o) => o.attack && !o.passed && !!o.sky === (kind === 'sky')).length;
      feedPush(`${who} → 나: ${info.icon} ${info.name}${n > 1 ? ` x${n}` : ''}`, '#f87171');
    }
  }

  // 공격으로 라이벌을 바로 등장시킴. 이미 오고 있는 차량을 다 지난 뒤에 오게 하고, 다음 차량도 그만큼 늦춰
  // 피할 수 없는 배치는 만들지 않음 (점프 착지 여유 GAP 초)
  function forceRival(sky) {
    const GAP = 0.9;
    // 각 차량이 내 차를 다 지나가는 시각(초 후)
    const done = (o) => o.rival && !o.sky ? (o.x - o.jumpAt) / speed + ROLL_TIME + 0.3 : (o.x + o.w - player.x) / speed;
    let t = 0;
    for (const o of obstacles) if (!o.passed && !(o.rival && o.t >= 0)) t = Math.max(t, done(o));
    const x = Math.max(W + 40, player.x + speed * (t + GAP));
    const o = addRival(x);
    o.attack = true;
    if (sky) {
      o.sky = true;
      o.type = SKY_RIVAL;
      o.landed = true; // 뛰지 않음
    }
    // 다음 일반 차량은 이 라이벌이 지나간 뒤에 오도록
    spawnTimer = Math.max(spawnTimer, done(o) + GAP - (W + 40 - player.x) / speed);
    burst = 0;
  }

  // 공격 효과 투명도: 시작·끝에 짧게 페이드
  function effectAlpha(from, until) {
    const left = until - clock;
    if (left <= 0) return 0;
    return Math.max(0, Math.min(1, left / 0.3, (clock - from) / 0.2 + 0.2));
  }

  // 화이트아웃: 배경(하늘·도로·터널)을 흰색으로 덮고 차량은 그 위에 그림
  function drawWhiteout() {
    const a = effectAlpha(whiteFrom, whiteUntil);
    if (!a) return;
    ctx.fillStyle = `rgba(248,250,252,${0.97 * a})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 안개: 내 차 앞쪽을 반투명하게 가림 (다가오는 차가 흐릿하게 보이는 정도)
  function drawFog() {
    const a = effectAlpha(fogFrom, fogUntil);
    if (!a) return;
    const x0 = player.x + 50 * CAR_SCALE;
    const grad = ctx.createLinearGradient(x0, 0, x0 + 200, 0);
    grad.addColorStop(0, 'rgba(203,213,225,0)');
    grad.addColorStop(1, `rgba(203,213,225,${0.8 * a})`);
    ctx.fillStyle = grad;
    ctx.fillRect(x0, 0, W - x0, H);
    // 흘러가는 안개 덩어리
    for (let i = 0; i < 7; i++) {
      const span = Math.max(1, W - x0 - 100);
      const fx = x0 + 100 + ((i * 173 + clock * 60) % span);
      glow(fx, groundY - 30 - (i % 3) * 70, 110, '226,232,240', 0.35 * a);
    }
  }

  function drawShield() {
    if (clock >= shieldUntil) return;
    const left = shieldUntil - clock;
    const a = left < 1.5 ? 0.5 + 0.5 * Math.sin(clock * 20) : 1; // 끝나기 전 깜빡임
    const cx = player.x, cy = groundY - player.y - AXIS_Y * CAR_SCALE;
    glow(cx, cy, 110, '103,232,249', 0.25 * a);
    ctx.strokeStyle = `rgba(103,232,249,${0.8 * a})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 70 * CAR_SCALE, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 아이템 칸 (HTML): 바뀔 때만 다시 만듦 (매 프레임 호출)
  function renderItems() {
    const show = itemMode() && state === 'playing';
    const shieldLeft = clock < shieldUntil ? Math.ceil(shieldUntil - clock) : 0;
    const key = show ? `${items.join()}|${nextItemAt}|${shieldLeft}` : '';
    if (key === itemsKey) return;
    itemsKey = key;
    itemsEl.hidden = !show;
    if (!show) return;
    const slots = [];
    for (let i = 0; i < ITEM_MAX; i++) {
      const k = items[i];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = k ? '' : 'empty';
      b.setAttribute('aria-label', k ? `${ITEM_INFO[k].name} 사용` : '빈 칸');
      b.innerHTML = `<span class="key">${i + 1}</span><span class="ic">${k ? ITEM_INFO[k].icon : '·'}</span><span>${k ? ITEM_INFO[k].name.slice(0, 5) : ''}</span>`;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); useItem(i); });
      slots.push(b);
    }
    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = `🎁 ${nextItemAt}점${shieldLeft ? `<span class="shield">🛡️ ${shieldLeft}초</span>` : ''}`;
    itemsEl.replaceChildren(...slots, info);
  }
  itemsEl.addEventListener('pointerdown', (e) => e.stopPropagation());

  // ---------- 컴퓨터 상대 ----------
  // 방장 브라우저가 컴퓨터마다 간단한 게임을 따로 돌리고(차량 생성·점프·충돌·점수·아이템),
  // 사람과 똑같이 게임 화면 상태를 보내서 다른 사람에게는 상대 한 명으로 보임.
  // 컴퓨터 목록은 방장의 접속 정보에 함께 올라가므로 방장이 나가면 컴퓨터도 같이 사라짐.
  // 난이도 = 차량마다 실수할 확률 (화이트아웃·안개 중에는 4배, 사람이 모두 끝나면 10배로 빨리 마무리)
  const BOT_LEVELS = {
    easy: { label: '쉬움', fail: 0.06 },
    normal: { label: '보통', fail: 0.025 },
    hard: { label: '어려움', fail: 0.008 },
  };
  const BOT_LEAD = 0.08;    // 차량 앞 이 시간(초)만큼 거리에서 점프
  const BOT_SPAWN_X = 900;  // 차량 등장 위치 (컴퓨터 차 기준)

  // 방장의 접속 정보에 있는 컴퓨터를 참가자 목록에 넣음 (사람 + 컴퓨터 최대 ROOM_MAX)
  function addBotsFromHost(r, list, prev) {
    const hostMeta = list[0] || {};
    let bots = Array.isArray(hostMeta.bots) ? hostMeta.bots : [];
    const humans = Math.min(list.length, ROOM_MAX);
    if (bots.length > ROOM_MAX - humans) {
      // 사람이 들어와 자리가 모자라면 방장이 컴퓨터를 뒤에서부터 뺌
      bots = bots.slice(0, ROOM_MAX - humans);
      if (room === r && r.host === myId) {
        for (const id of [...r.bots.keys()]) if (!bots.some((b) => b.id === id)) r.bots.delete(id);
        trackMe();
      }
    }
    const now = performance.now();
    for (const b of bots) {
      const old = prev.get(b.id);
      r.players.set(b.id, old
        ? { ...old, name: b.name, level: b.level, bot: true }
        : { id: b.id, name: b.name, level: b.level, bot: true, status: b.status, score: b.score, t: 0, syncAt: now });
    }
  }

  function addBot() {
    if (!room || room.host !== myId || room.players.size >= ROOM_MAX) return;
    const used = new Set([...room.players.values()].filter((p) => p.bot).map((p) => p.name));
    let k = 1;
    while (used.has(`컴퓨터${k}`)) k++;
    const id = `bot-${myId}-${Date.now().toString(36)}`;
    room.bots.set(id, { id, name: `컴퓨터${k}`, level: document.getElementById('room-bot-level').value, status: 'ready', sim: null, t: 0, sentAt: 0 });
    trackMe();
  }

  function removeBot(id) {
    if (!room || room.host !== myId) return;
    room.bots.delete(id);
    room.players.delete(id);
    trackMe();
    roomRenderKey = '';
    renderRoom();
  }

  function botsStart() {
    if (!room || room.host !== myId) return;
    for (const b of room.bots.values()) {
      b.sim = {
